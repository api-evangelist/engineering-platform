tags:
- name: API Token Permission Groups
paths:
  /user/tokens/permission_groups:
    get:
      description: Find all available permission groups for API Tokens
      operationId: permission-groups-list-permission-groups
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_api-response-common-failure'
          description: List Token Permission Groups response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_schemas-response_collection'
          description: List Token Permission Groups response
      security:
      - api_token: []
      summary: APIs.io Engineering Platform List Token Permission Groups
      tags:
      - API Token Permission Groups
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.token.read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
