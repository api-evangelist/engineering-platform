paths:
  /accounts/{account_id}/access/bookmarks:
    get:
      deprecated: true
      description: Lists Bookmark applications.
      operationId: access-bookmark-applications-(-deprecated)-list-bookmark-applications
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_components-schemas-identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: List Bookmark applications response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_bookmarks_components-schemas-response_collection'
          description: List Bookmark applications response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List Bookmark applications
      tags:
      - Access Bookmark Applications (Deprecated)
      x-api-token-group:
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-cfDeprecation:
        description: This endpoint is deprecated in favor of using a specialized Access Application App Type.
        display: true
        eol: '2023-03-19'
        id: bookmarks_deprecation
  /accounts/{account_id}/access/bookmarks/{bookmark_id}:
    delete:
      deprecated: true
      description: Deletes a Bookmark application.
      operationId: access-bookmark-applications-(-deprecated)-delete-a-bookmark-application
