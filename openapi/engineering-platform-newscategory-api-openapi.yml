components:
  schemas:
    MediaObject:
      properties:
        contentUrl:
          type: string
          description: Original URL to retrieve the source (file) for the media object (e.g the source URL for the image).
          readOnly: true
        height:
          type: integer
          description: The height of the source media object, in pixels.
          format: int32
          readOnly: true
        width:
          type: integer
          description: The width of the source media object, in pixels.
          format: int32
          readOnly: true
      description: Defines a media object.
      allOf:
      - $ref: '#/components/schemas/CreativeWork'
    NewsArticle:
      properties:
        category:
          type: string
          description: The news category that the article belongs to. For example, Sports. If the news category cannot be determined, the article does not include this field.
          readOnly: true
        clusteredArticles:
          type: array
          description: A list of related news articles.
          readOnly: true
          items:
            $ref: '#/components/schemas/NewsArticle'
        headline:
          type: boolean
          description: A Boolean value that indicates whether the news article is a headline. If true, the article is a headline. The article includes this field only for news categories requests that do not specify the category query parameter.
          readOnly: true
      description: Defines a news article.
      allOf:
      - $ref: '#/components/schemas/Article'
    ErrorResponse:
      required:
      - errors
      properties:
        errors:
