openapi: 3.2.0
info:
  title: .io Engineering Platform Postman APIS API
  description: "The Postman API enables you to programmatically access data stored in your Postman account.\n\n> Certain endpoints may be unavailable depending on your region and/or Postman plan.\n\nFor a comprehensive set of examples of requests and responses, see the [**Postman API** collection](https://www.postman.com/postman/workspace/postman-public-workspace/documentation/12959542-c8142d51-e97c-46b6-bd77-52bb66712c9a).\n\n## Getting started\n\nYou can get started with the Postman API by creating a copy of this definition in your workspace.\n\n### EU users\n\nFor users in the EU with [**Enterprise** plans](https://www.postman.com/pricing/), the Postman API uses the `http://api.eu.postman.com` subdomain. This is available in the definition's list of servers. You can change this by selecting the `http://api.eu.postman.com` subdomain in the **Server** dropdown list below.\n\n## About the Postman API\n\n- You must use a valid API Key to send requests to the API endpoints.\n- The API has [rate and usage limits](https://learning.postman.com/docs/developer/postman-api/postman-api-rate-limits/).\n- The API only responds to HTTPS-secured communications. Any requests sent via HTTP return an HTTP `301` redirect to the corresponding HTTPS resources.\n- The API returns requests responses in JSON format. When an API request returns an error, it is sent in the JSON response as an error key.\n- The request method (verb) determines the nature of action you intend to perform. A request made using the `GET` method implies that you want to fetch something from Postman. The `POST` method implies you want to save something new to Postman.\n- For all requests, API calls respond with their corresponding [HTTP status codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes). In the Postman client, the status code also provides help text that details the possible meaning of the response code.\n- When calling the API Builder endpoints, you must send an `Accept` header with the `application/vnd.api.v10+json` value.\n\n### IDs and UIDs\n\nAll items in Postman, such as collections, workspaces, and APIs, have IDs and UIDs:\n\n- An ID is the unique ID assigned to a Postman item. For example, `ec29121c-5203-409f-9e84-e83ffc10f226`.\n- The UID is the **full** ID of a Postman item. This value is the item's unique ID concatenated with the user ID. For example, in the `12345678-ec29121c-5203-409f-9e84-e83ffc10f226` UID:\n    - `12345678` is the user's ID.\n    - `ec29121c-5203-409f-9e84-e83ffc10f226` is the item's ID.\n\n### Enum values\n\nAny documented enum values should be considered partial lists and may change over time.\n\n### 403 response for unavailable features\n\nDepending on your region and/or Postman [plan](https://www.postman.com/pricing/), some endpoints will return an HTTP `403 Forbidden` response with the \"This feature isn't available in your region.\" detail.\n\n### 503 response\n\nAn HTTP `503 Service Unavailable` response from our servers indicates there is an unexpected spike in API access traffic. The server is usually operational within the next five minutes.\n\nIf the outage persists or you receive any other form of an HTTP `5XX` error, [contact support](https://support.postman.com/hc/en-us/requests/new/).\n\n## Authentication\n\nPostman uses API keys for authentication. The API key tells the API server that the request came from you. Everything that you have access to in Postman is accessible with your API key. You can [generate](https://learning.postman.com/docs/developer/postman-api/authentication/#generate-a-postman-api-key) a Postman API key in the [**API keys**](https://postman.postman.co/settings/me/api-keys) section of your Postman account settings.\n\nYou must include an API key in each request to the Postman API with the `X-API-Key` request header. In Postman, you can store your API key as a [vault secret](https://learning.postman.com/docs/sending-requests/postman-vault/postman-vault-secrets/) or an [environment variable](https://www.getpostman.com/docs/environments). The Postman API [collection](https://www.getpostman.com/docs/collections) will use it to make API calls.\n\n### SCIM authentication\n\nWhile all other endpoints in this collection require a Postman API key, the SCIM endpoints require a [SCIM API key](https://learning.postman.com/docs/administration/scim-provisioning/scim-provisioning-overview/#generating-scim-api-key).\n\n### Authentication error response\n\nIf an API key is missing, malformed, or invalid, you will receive an HTTP `401 Unauthorized` response code.\n\n## Rate and usage limits\n\nAPI access [rate limits](https://learning.postman.com/docs/developer/postman-api/postman-api-rate-limits/) apply at a per-user basis in unit time. The limit is **300 requests per minute**. Postman Monitors, the GET `/collections`, and the GET `/workspaces` endpoint have a rate limit of **10 calls in 10 seconds**. Depending on your [plan](https://www.postman.com/pricing/), you may also have [usage limits](https://learning.postman.com/docs/billing/resource-usage/).\n\nWhen you reach your rate or usage limits, the API returns the following HTTP `429 Too Many Requests` status code with one of the following error responses:\n\n- `rateLimited` — Rate limits reached. The response returns the time after which you can resume calls to the Postman API.\n- `serviceLimitExhausted` — Postman API service limits reached. You will need to contact your Postman Team Admin for assistance.\n\n## Support\n\nFor help regarding accessing the Postman API, you can:\n\n- Visit [Postman Support](https://support.postman.com/hc/en-us) or our [Community and Support](https://www.postman.com/community/) sites.\n- Reach out to the [Postman community](https://community.postman.com/).\n- Submit a help request to [Postman support](https://support.postman.com/hc/en-us/requests/new/).\n\n## Policies\n\n- [Postman Terms of Service](http://www.postman.com/legal/terms/)\n- [Postman Privacy Policy](https://www.postman.com/legal/privacy-policy/)\n"
  version: '1.0'
  termsOfService: https://www.postman.com/legal/terms/
  contact:
    name: Postman Support
    email: help@postman.com
    url: https://www.postman.com/community/
servers:
- url: https://api.getpostman.com
- url: https://api.eu.postman.com
security:
- PostmanApiKey: []
- scimApiKey: []
tags:
- name: Apis
paths:
  /apis:
    parameters:
    - $ref: '#/components/parameters/workspaceIdQueryTrue'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get all APIs
      description: Gets information about all APIs in a workspace.
      operationId: getApis
      tags:
      - Apis
      responses:
        '200':
          $ref: '#/components/responses/getApis'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/api404ErrorNotFound'
        '422':
          $ref: '#/components/responses/v9Unsupported'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/workspaceIdQueryTrue'
      - $ref: '#/components/parameters/createdBy'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/apiDescription'
      - $ref: '#/components/parameters/limit'
    post:
      summary: APIs.io Engineering Platform Create an API
      description: Creates an API.
      operationId: createApi
      tags:
      - Apis
      requestBody:
        $ref: '#/components/requestBodies/createApi'
      responses:
        '200':
          $ref: '#/components/responses/createApi'
        '400':
          $ref: '#/components/responses/workspace400ErrorParamMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/api403ErrorForbidden'
                - $ref: '#/components/schemas/api403ErrorLimitReached'
                - $ref: '#/components/schemas/featureUnavailable403Error'
              examples:
                Forbidden:
                  $ref: '#/components/examples/api403ErrorForbidden'
                API Limit Reached:
                  $ref: '#/components/examples/api403ErrorLimitReached'
                Feature Unavailable:
                  $ref: '#/components/examples/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/workspace404Error'
        '500':
          $ref: '#/components/responses/common500Error'
  /apis/{apiId}:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get an API
      description: 'Gets information about an API.


        **Note:**


        - Git-connected APIs will only return the `versions` and `gitInfo` query responses. This is because schema and collection information is stored in the connected Git repository. The `gitInfo` object only lists the repository and folder locations of the files.

        - API viewers can only use the `versions` option in the `include` query parameter.

        '
      operationId: getApi
      tags:
      - Apis
      responses:
        '200':
          $ref: '#/components/responses/getApi'
        '400':
          $ref: '#/components/responses/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/api404ErrorNotFound'
        '422':
          $ref: '#/components/responses/v9Unsupported'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/apiInclude'
    put:
      summary: APIs.io Engineering Platform Update an API
      description: Updates an API.
      operationId: updateApi
      tags:
      - Apis
      requestBody:
        $ref: '#/components/requestBodies/updateApi'
      responses:
        '200':
          $ref: '#/components/responses/updateApi'
        '400':
          $ref: '#/components/responses/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/api403ErrorAndFeatureUnavailable'
        '404':
          $ref: '#/components/responses/api404ErrorNotFound'
        '422':
          $ref: '#/components/responses/v9Unsupported'
        '500':
          $ref: '#/components/responses/common500Error'
    delete:
      summary: APIs.io Engineering Platform Delete an API
      description: Deletes an API. On success, this returns an HTTP `204 No Content` response.
      operationId: deleteApi
      tags:
      - Apis
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/api403ErrorAndFeatureUnavailable'
        '404':
          $ref: '#/components/responses/api404ErrorNotFound'
        '422':
          $ref: '#/components/responses/v9Unsupported'
        '500':
          $ref: '#/components/responses/common500Error'
  /apis/{apiId}/tasks/{taskId}:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/apiTaskId'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get status of an asynchronous task
      description: Gets the status of an asynchronous task.
      operationId: getStatusOfAnAsyncTask
      tags:
      - Apis
      responses:
        '200':
          $ref: '#/components/responses/getStatusOfAnAsyncTask'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiVersion400ErrorInvalidParam'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Invalid Parameter:
                  $ref: '#/components/examples/apiVersion400ErrorInvalidParam'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/api403ErrorAndFeatureUnavailable'
        '404':
          $ref: '#/components/responses/taskNotFound'
        '500':
          $ref: '#/components/responses/common500Error'
  /apis/{apiId}/versions/{versionId}:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/apiVersionId'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get a version
      description: 'Gets information about an API version.


        **Note:**


        - For API editors, this endpoint returns an HTTP `302 Found` status code when the version status is pending. It also returns the `/apis/{apiId}/tasks/{taskId}` task status response header.

        - For API viewers, this endpoint returns an HTTP `404 Not Found` when the version status is pending.

        '
      operationId: getApiVersion
      tags:
      - Apis
      responses:
        '200':
          $ref: '#/components/responses/getApiVersion'
        '302':
          description: Found
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/apiVersion404ErrorNotFound'
        '500':
          $ref: '#/components/responses/common500Error'
components:
  responses:
    updateApi:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            description: Information about the API.
            required:
            - name
            properties:
              id:
                type: string
                description: The API's ID.
                example: 5360b75f-447e-467c-9299-12fd6c92450d
              name:
                type: string
                description: The API's name.
                example: Test API A
              summary:
                type: string
                description: The API's summary.
                example: Test API A Schema
              createdAt:
                type: string
                format: date-time
                description: The date and time at which the API was created.
                example: '2022-06-29T20:46:58.000Z'
              createdBy:
                type: string
                description: The user ID of the user that created the API.
                example: '12345678'
              updatedAt:
                type: string
                format: date-time
                description: The date and time at which the API was last updated.
                example: '2022-06-29T20:46:58.000Z'
              updatedBy:
                type: string
                description: The user ID of the user that updated the API.
                example: '12345678'
              description:
                type: string
                description: The API's description. This supports Markdown formatting.
                example: This is Test API A.
          example:
            createdAt: '2022-06-29T20:46:58.000Z'
            updatedAt: '2022-06-29T20:46:58.000Z'
            id: 5360b75f-447e-467c-9299-12fd6c92450d
            name: Test API A
            summary: Test API A Schema
            description: This is Test API A.
            createdBy: '12345678'
            updatedBy: '12345678'
    getApis:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            description: Information about the API schema.
            properties:
              apis:
                type: array
                items:
                  type: object
                  title: API Base Data Schema
                  description: The API's base data schema.
                  properties:
                    id:
                      type: string
                      description: The API's ID.
                      example: 5360b75f-447e-467c-9299-12fd6c92450d
                    name:
                      type: string
                      description: The API's name.
                      example: User Management API
                    summary:
                      type: string
                      description: The API's short summary.
                      example: An API to manager users.
                    createdAt:
                      type: string
                      format: date-time
                      description: The date and time at which the API was created.
                      example: '2023-08-22T14:21:57.000Z'
                    createdBy:
                      type: integer
                      description: The Postman ID of the user that created the API.
                      example: 12345678
                    updatedAt:
                      type: string
                      format: date-time
                      description: The date and time at which the API was updated.
                      example: '2023-08-22T14:21:57.000Z'
                    updatedBy:
                      type: integer
                      description: The Postman ID of the user that updated the API.
                      example: 12345678
                    description:
                      type: string
                      description: The API's description.
                      example: This API includes operations to add/remove/update users.
              meta:
                type: object
                description: The response's meta information for paginated results.
                properties:
                  limit:
                    type: number
                    example: 100
                    description: The maximum number of records in the paginated response.
                  total:
                    type: number
                    example: 1000
                    description: The number of records that match the defined criteria.
                  nextCursor:
                    type: string
                    format: base64
                    description: The pagination cursor that points to the next record in the results set.
                    example: RnJpIEZlYiAyNCAyMDIzIDEzOjI0OjA5IEdNVCswMDAwIChDb29yZGluYXRlZCBVbml2ZXJzYWwgVGltZSk=
          example:
            meta:
              nextCursor: VGh1IE1hciAxNiAyMDIzIDE3OjIxOjUzIEdNVCswMDAwIChDb29yZGluYXRlZCBVbml2ZXJzYWwgVGltZSk=
              total: 4
              limit: 10
            apis:
            - updatedBy: 12345678
              createdBy: 12345678
              name: New API
              summary: ''
              description: ''
              createdAt: '2023-02-15T06:27:16.000Z'
              id: 73e15000-bc7a-4802-b80e-05fff18fd7f8
              updatedAt: '2023-02-15T06:27:24.000Z'
            - updatedBy: 12345678
              createdBy: 12345678
              name: Test API
              summary: This is a test API.
              description: This is an API for testing purposes.
              createdAt: '2023-02-15T13:07:08.000Z'
              id: fec65321-5f55-4feb-8525-be95bccae8dd
              updatedAt: '2023-02-15T13:07:08.000Z'
            - updatedBy: 12345678
              createdBy: 12345678
              name: Test API
              summary: This is a test API.
              description: This is an API for testing purposes.
              createdAt: '2023-02-16T05:52:27.000Z'
              id: b7c54faa-d119-4572-a18d-e2f5c32348ce
              updatedAt: '2023-02-16T05:52:27.000Z'
            - updatedBy: 12345678
              createdBy: 12345678
              name: Test API
              summary: This is a test API.
              description: This is an API for testing purposes.
              createdAt: '2023-02-16T07:07:16.000Z'
              id: d535a8ba-ed4b-4c6a-bf1c-13fac95485b8
              updatedAt: '2023-02-16T07:07:16.000Z'
    featureUnavailable403Error:
      description: Feature Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/featureUnavailable403Error'
          example:
            value:
              type: https://api.postman.com/problems/forbidden
              title: Forbidden
              detail: This feature isn't available in your region.
              status: 403
    v9Unsupported:
      description: v9 Unsupported
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The error type.
                example: unsupportedEntityError
              title:
                type: string
                description: A short summary of the problem.
                example: Unsupported API
              detail:
                type: string
                description: Details about the error.
                example: This endpoint does not support v9 APIs.
          example:
            type: unsupportedEntityError
            title: Unsupported API
            detail: This endpoint does not support v9 APIs.
    api403ErrorAndFeatureUnavailable:
      description: Forbidden
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/api403ErrorForbidden'
            - $ref: '#/components/schemas/featureUnavailable403Error'
          examples:
            Forbidden:
              $ref: '#/components/examples/api403ErrorForbidden'
            Feature Unavailable:
              $ref: '#/components/examples/featureUnavailable403Error'
    apiVersion404ErrorNotFound:
      description: API Version Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/apiVersion404ErrorNotFound'
          examples:
            API Version Not Found:
              $ref: '#/components/examples/apiVersion404ErrorNotFound'
    workspace400ErrorParamMissing:
      description: Missing Workspace ID
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The type of error.
                example: paramMissingError
              title:
                type: string
                description: A short summary of the problem.
                example: Parameter is missing in the request.
              detail:
                type: string
                description: Information about the error.
                example: Parameter, workspaceId is missing in the request.
          example:
            type: paramMissingError
            title: Parameter is missing in the request.
            detail: Parameter, workspaceId is missing in the request.
    taskNotFound:
      description: Task Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/taskNotFound'
          examples:
            Task Not Found:
              $ref: '#/components/examples/taskNotFound'
    common500Error:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri-reference
                description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
                example: https://api.postman.com/problems/internal-server-error
              title:
                type: string
                description: A short summary of the problem.
                example: Internal Server Error
              detail:
                type: string
                description: Information about the error.
                example: Internal Server Error
          example:
            type: https://api.postman.com/problems/internal-server-error
            title: Internal Server Error
            detail: Internal Server Error
    getApi:
      description: Successful Response
      content:
        application/json:
          schema:
            anyOf:
            - type: object
              title: API Base Data Schema
              description: The API's base data schema.
              properties:
                id:
                  type: string
                  description: The API's ID.
                  example: 5360b75f-447e-467c-9299-12fd6c92450d
                name:
                  type: string
                  description: The API's name.
                  example: User Management API
                summary:
                  type: string
                  description: The API's short summary.
                  example: An API to manager users.
                createdAt:
                  type: string
                  format: date-time
                  description: The date and time at which the API was created.
                  example: '2023-08-22T14:21:57.000Z'
                createdBy:
                  type: integer
                  format: int64
                  description: The Postman ID of the user that created the API.
                  example: 12345678
                updatedAt:
                  type: string
                  format: date-time
                  description: The date and time at which the API was updated.
                  example: '2023-08-22T14:21:57.000Z'
                updatedBy:
                  type: integer
                  format: int64
                  description: The Postman ID of the user that updated the API.
                  example: 12345678
                description:
                  type: string
                  description: The API's description.
                  example: This API includes operations to add/remove/update users.
            - type: object
              title: API Extended Data Schema
              description: 'The API''s extended data schema.


                **Note:**


                Git-connected APIs will only return the `versions` and `gitInfo` query responses. This is because schema and collection information is stored in the connected Git repository. The `gitInfo` object only lists the repository and folder locations of the files.

                '
              allOf:
              - type: object
                title: API Base Data Schema
                description: The API's base data schema.
                properties:
                  id:
                    type: string
                    description: The API's ID.
                    example: 5360b75f-447e-467c-9299-12fd6c92450d
                  name:
                    type: string
                    description: The API's name.
                    example: User Management API
                  summary:
                    type: string
                    description: The API's short summary.
                    example: An API to manager users.
                  createdAt:
                    type: string
                    format: date-time
                    description: The date and time at which the API was created.
                    example: '2023-08-22T14:21:57.000Z'
                  createdBy:
                    type: integer
                    format: int64
                    description: The Postman ID of the user that created the API.
                    example: 12345678
                  updatedAt:
                    type: string
                    format: date-time
                    description: The date and time at which the API was updated.
                    example: '2023-08-22T14:21:57.000Z'
                  updatedBy:
                    type: integer
                    format: int64
                    description: The Postman ID of the user that updated the API.
                    example: 12345678
                  description:
                    type: string
                    description: The API's description.
                    example: This API includes operations to add/remove/update users.
              - type: object
                title: API Details
                description: Detailed information about the API.
                properties:
                  gitInfo:
                    type: object
                    title: Git Repo Data Schema
                    description: Information about the API's Git repository integration.
                    properties:
                      domain:
                        type:
                        - string
                        - 'null'
                        description: The domain at which the Git repository is hosted.
                        example: https://git.example.com
                      repository:
                        type: string
                        description: The repository's name.
                        example: test-api-repo
                      organization:
                        type: string
                        description: The organization that owns the repository.
                        example: test-org
                      schemaFolder:
                        type: string
                        description: The API definition's repository folder location.
                        example: test-api-schema
                      collectionFolder:
                        type: string
                        description: The API definition's collection repository folder location.
                        example: test-api-collection
                  schemas:
                    type: array
                    description: The API's schemas.
                    items:
                      type: object
                      description: Information about the schema.
                      properties:
                        id:
                          type: string
                          description: The schema's ID.
