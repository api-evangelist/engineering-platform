tags:
- name: DEX Synthetic Application Monitoring
paths:
  /accounts/{account_id}/dex/colos:
    get:
      description: List Cloudflare colos that account's devices were connected to during a time period, sorted by usage starting from the most used colo. Colos without traffic are also returned and sorted alphabetically.
      operationId: dex-endpoints-list-colos
      parameters:
      - description: unique identifier linked to an account in the API request path.
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Start time for connection period in RFC3339 (ISO 8601) format.
        in: query
        name: from
        required: true
        schema:
          example: '2023-08-20T20:45:00Z'
          type: string
      - description: End time for connection period in RFC3339 (ISO 8601) format.
        in: query
        name: to
        required: true
        schema:
          example: '2023-08-24T20:45:00Z'
          type: string
      - description: Type of usage that colos should be sorted by. If unspecified, returns all Cloudflare colos sorted alphabetically.
        in: query
        name: sortBy
        schema:
          enum:
          - fleet-status-usage
          - application-tests-usage
          type: string
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: List colos failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-collection'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_colos_response'
          description: List colos response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List Cloudflare colos
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/fleet-status/devices:
    get:
      description: List details for devices using WARP
      operationId: dex-fleet-status-devices
      parameters:
      - description: Unique identifier for account
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Time range end in ISO format
        in: query
        name: to
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_timestamp'
      - description: Time range beginning in ISO format
        in: query
        name: from
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_timestamp'
      - description: Page number
        in: query
        name: page
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_page'
      - description: Number of results per page
        in: query
        name: per_page
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_per_page'
      - description: Dimension to sort results by
        in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_sort_by'
      - description: Cloudflare colo
        in: query
        name: colo
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_colo'
      - description: Device-specific ID, given as UUID v4
        in: query
        name: device_id
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_device_id'
      - description: The mode under which the WARP client is run
        in: query
        name: mode
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_mode'
      - description: Network status
        in: query
        name: status
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_status'
      - description: Operating system
        in: query
        name: platform
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_platform'
      - description: WARP client version
        in: query
        name: version
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_version'
      - description: "Source:\n  * `hourly` - device details aggregated hourly, up to 7 days prior\n  * `last_seen` - device details, up to 24 hours prior\n  * `raw` - device details, up to 7 days prior\n"
        in: query
        name: source
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_source'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: List devices response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_fleet_status_devices_response'
          description: List devices response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List fleet status devices
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/fleet-status/live:
    get:
      description: List details for live (up to 60 minutes) devices using WARP
      operationId: dex-fleet-status-live
      parameters:
      - description: Unique identifier for account
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Number of minutes before current time
        in: query
        name: since_minutes
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_since_minutes'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: List device details (live) response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_fleet_status_live_response'
          description: List device details (live) response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List fleet status details by dimension
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/fleet-status/over-time:
    get:
      description: List details for devices using WARP, up to 7 days
      operationId: dex-fleet-status-over-time
      parameters:
      - description: Unique identifier for account
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Time range end in ISO format
        in: query
        name: to
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_timestamp'
      - description: Time range beginning in ISO format
        in: query
        name: from
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_timestamp'
      - description: Cloudflare colo
        in: query
        name: colo
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_colo'
      - description: Device-specific ID, given as UUID v4
        in: query
        name: device_id
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_device_id'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: DEX HTTP test details failure response
        '200':
          description: List DEX devices response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List fleet status aggregate details by dimension
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/http-tests/{test_id}:
    get:
      description: Get test details and aggregate performance metrics for an http test for a given time period between 1 hour and 7 days.
      operationId: dex-endpoints-http-test-details
      parameters:
      - description: unique identifier linked to an account in the API request path.
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: unique identifier for a specific test
        in: path
        name: test_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      - description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
        in: query
        name: deviceId
        schema:
          items:
            type: string
          type: array
      - description: Start time for aggregate metrics in ISO ms
        in: query
        name: from
        required: true
        schema:
          example: 1689520412000.0
          type: string
      - description: End time for aggregate metrics in ISO ms
        in: query
        name: to
        required: true
        schema:
          example: 1689606812000.0
          type: string
      - description: Time interval for aggregate time slots.
        in: query
        name: interval
        required: true
        schema:
          enum:
          - minute
          - hour
          type: string
      - description: Optionally filter result stats to a Cloudflare colo. Cannot be used in combination with deviceId param.
        in: query
        name: colo
        schema:
          type: string
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: DEX HTTP test details failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_http_details_response'
          description: DEX HTTP test details response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Get details and aggregate metrics for an http test
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/http-tests/{test_id}/percentiles:
    get:
      description: Get percentiles for an http test for a given time period between 1 hour and 7 days.
      operationId: dex-endpoints-http-test-percentiles
      parameters:
      - description: unique identifier linked to an account in the API request path.
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: unique identifier for a specific test
        in: path
        name: test_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      - description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
        in: query
        name: deviceId
        schema:
          items:
            type: string
          type: array
      - description: Start time for aggregate metrics in ISO format
        in: query
        name: from
        required: true
        schema:
          example: '2023-09-20T17:00:00Z'
          type: string
      - description: End time for aggregate metrics in ISO format
        in: query
        name: to
        required: true
        schema:
          example: '2023-09-20T17:00:00Z'
          type: string
      - description: Optionally filter result stats to a Cloudflare colo. Cannot be used in combination with deviceId param.
        in: query
        name: colo
        schema:
          type: string
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: DEX HTTP test percentiles failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_http_details_percentiles_response'
          description: DEX HTTP test percentiles response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Get percentiles for an http test
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/tests/overview:
    get:
      description: List DEX tests with overview metrics
      operationId: dex-endpoints-list-tests-overview
      parameters:
      - description: unique identifier linked to an account in the API request path.
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Optionally filter result stats to a Cloudflare colo. Cannot be used in combination with deviceId param.
        in: query
        name: colo
        schema:
          type: string
      - description: Optionally filter results by test name
        in: query
        name: testName
        schema:
          type: string
      - description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
        in: query
        name: deviceId
        schema:
          items:
            type: string
          type: array
      - description: Page number of paginated results
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: number
      - description: Number of items per page
        in: query
        name: per_page
        schema:
          default: 10
          maximum: 50
          minimum: 1
          type: number
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_tests_response'
                    result_info:
                      $ref: '#/components/schemas/digital-experience-monitoring_result_info'
          description: success response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List DEX test analytics
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/tests/unique-devices:
    get:
      description: Returns unique count of devices that have run synthetic application monitoring tests in the past 7 days.
      operationId: dex-endpoints-tests-unique-devices
      parameters:
      - description: unique identifier linked to an account in the API request path.
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Optionally filter results by test name
        in: query
        name: testName
        schema:
          type: string
      - description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
        in: query
        name: deviceId
        schema:
          items:
            type: string
          type: array
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: DEX unique devices targeted failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_unique_devices_response'
          description: DEX unique devices targeted response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Get count of devices targeted
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/traceroute-test-results/{test_result_id}/network-path:
    get:
      description: Get a breakdown of hops and performance metrics for a specific traceroute test run
      operationId: dex-endpoints-traceroute-test-result-network-path
      parameters:
      - description: unique identifier linked to an account
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: unique identifier for a specific traceroute test
        in: path
        name: test_result_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: DEX traceroute test result network path failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_traceroute_test_result_network_path_response'
          description: DEX traceroute test result network path response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Get details for a specific traceroute test run
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/traceroute-tests/{test_id}:
    get:
      description: Get test details and aggregate performance metrics for an traceroute test for a given time period between 1 hour and 7 days.
      operationId: dex-endpoints-traceroute-test-details
      parameters:
      - description: Unique identifier linked to an account
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: Unique identifier for a specific test
        in: path
        name: test_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      - description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
        in: query
        name: deviceId
        schema:
          items:
            type: string
          type: array
      - description: Start time for aggregate metrics in ISO ms
        in: query
        name: from
        required: true
        schema:
          example: 1689520412000.0
          type: string
      - description: End time for aggregate metrics in ISO ms
        in: query
        name: to
        required: true
        schema:
          example: 1689606812000.0
          type: string
      - description: Time interval for aggregate time slots.
        in: query
