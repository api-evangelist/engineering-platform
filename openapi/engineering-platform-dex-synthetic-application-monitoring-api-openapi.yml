      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
          description: DEX traceroute test details response failure response
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_traceroute_details_response'
          description: DEX traceroute test details response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Get details and aggregate metrics for a traceroute test
      tags:
      - DEX Synthetic Application Monitoring
      x-cfPermissionsRequired:
        enum:
        - '#dex:read'
        - '#teams:report'
  /accounts/{account_id}/dex/traceroute-tests/{test_id}/network-path:
    get:
      description: Get a breakdown of metrics by hop for individual traceroute test runs
      operationId: dex-endpoints-traceroute-test-network-path
      parameters:
      - description: unique identifier linked to an account
        in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - description: unique identifier for a specific test
        in: path
        name: test_id
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      - description: Device to filter tracroute result runs to
        in: query
        name: deviceId
        required: true
        schema:
