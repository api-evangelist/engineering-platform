openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare IP Address Management Address Maps API
  version: 4.0.0
tags:
- name: IP Address Management Address Maps
paths:
  /accounts/{account_id}/addressing/address_maps:
    get:
      description: List all address maps owned by the account.
      operationId: ip-address-management-address-maps-list-address-maps
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_components-schemas-response_collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: List Address Maps response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_components-schemas-response_collection'
          description: List Address Maps response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List Address Maps
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
      - Address Maps Read
    post:
      description: Create a new address map under the account.
      operationId: ip-address-management-address-maps-create-address-map
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  $ref: '#/components/schemas/addressing_schemas-description'
                enabled:
                  $ref: '#/components/schemas/addressing_enabled'
                ips:
                  items:
                    $ref: '#/components/schemas/addressing_ip_address'
                  type: array
                memberships:
                  $ref: '#/components/schemas/addressing_memberships'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_full_response'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Create Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_full_response'
          description: Create Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create Address Map
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
  /accounts/{account_id}/addressing/address_maps/{address_map_id}:
    delete:
      description: Delete a particular address map owned by the account. An Address Map must be disabled before it can be deleted.
      operationId: ip-address-management-address-maps-delete-address-map
      parameters:
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_api-response-collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Delete Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_api-response-collection'
          description: Delete Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete Address Map
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
    get:
      description: Show a particular address map owned by the account.
      operationId: ip-address-management-address-maps-address-map-details
      parameters:
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_full_response'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Address Map Details response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_full_response'
          description: Address Map Details response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Address Map Details
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
      - Address Maps Read
    patch:
      description: Modify properties of an address map owned by the account.
      operationId: ip-address-management-address-maps-update-address-map
      parameters:
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                default_sni:
                  $ref: '#/components/schemas/addressing_default_sni'
                description:
                  $ref: '#/components/schemas/addressing_schemas-description'
                enabled:
                  $ref: '#/components/schemas/addressing_enabled'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_components-schemas-single_response'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Update Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_components-schemas-single_response'
          description: Update Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update Address Map
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
  /accounts/{account_id}/addressing/address_maps/{address_map_id}/accounts/{account_id}:
    delete:
      description: Remove an account as a member of a particular address map.
      operationId: ip-address-management-address-maps-remove-an-account-membership-from-an-address-map
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_api-response-collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Remove an account membership from an Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_api-response-collection'
          description: Remove an account membership from an Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Remove an account membership from an Address Map
      tags:
      - IP Address Management Address Maps
    put:
      description: Add an account as a member of a particular address map.
      operationId: ip-address-management-address-maps-add-an-account-membership-to-an-address-map
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_api-response-collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Add an account membership to an Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_api-response-collection'
          description: Add an account membership to an Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Add an account membership to an Address Map
      tags:
      - IP Address Management Address Maps
  /accounts/{account_id}/addressing/address_maps/{address_map_id}/ips/{ip_address}:
    delete:
      description: Remove an IP from a particular address map.
      operationId: ip-address-management-address-maps-remove-an-ip-from-an-address-map
      parameters:
      - in: path
        name: ip_address
        required: true
        schema:
          $ref: '#/components/schemas/addressing_ip_address'
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_api-response-collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Remove an IP from an Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_api-response-collection'
          description: Remove an IP from an Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Remove an IP from an Address Map
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
    put:
      description: Add an IP from a prefix owned by the account to a particular address map.
      operationId: ip-address-management-address-maps-add-an-ip-to-an-address-map
      parameters:
      - in: path
        name: ip_address
        required: true
        schema:
          $ref: '#/components/schemas/addressing_ip_address'
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_api-response-collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Add an IP to an Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_api-response-collection'
          description: Add an IP to an Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Add an IP to an Address Map
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
  /accounts/{account_id}/addressing/address_maps/{address_map_id}/zones/{zone_id}:
    delete:
      description: Remove a zone as a member of a particular address map.
      operationId: ip-address-management-address-maps-remove-a-zone-membership-from-an-address-map
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_api-response-collection'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Remove a zone membership from an Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_api-response-collection'
          description: Remove a zone membership from an Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Remove a zone membership from an Address Map
      tags:
      - IP Address Management Address Maps
    put:
      description: Add a zone as a member of a particular address map.
      operationId: ip-address-management-address-maps-add-a-zone-membership-to-an-address-map
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
