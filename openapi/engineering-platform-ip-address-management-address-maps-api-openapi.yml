                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Address Map Details response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_full_response'
          description: Address Map Details response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Address Map Details
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
      - Address Maps Read
    patch:
      description: Modify properties of an address map owned by the account.
      operationId: ip-address-management-address-maps-update-address-map
      parameters:
      - in: path
        name: address_map_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/addressing_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                default_sni:
                  $ref: '#/components/schemas/addressing_default_sni'
                description:
                  $ref: '#/components/schemas/addressing_schemas-description'
                enabled:
                  $ref: '#/components/schemas/addressing_enabled'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/addressing_components-schemas-single_response'
                - $ref: '#/components/schemas/addressing_api-response-common-failure'
          description: Update Address Map response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addressing_components-schemas-single_response'
          description: Update Address Map response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update Address Map
      tags:
      - IP Address Management Address Maps
      x-api-token-group:
      - Address Maps Write
