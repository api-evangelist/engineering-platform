paths:
  /accounts/{account_id}/ai/run/@cf/meta/m2m100-1.2b:
    post:
      operationId: workers-ai-post-run-cf-meta-m2m100-1-2b
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                source_lang:
                  default: en
                  type: string
                target_lang:
                  type: string
                text:
                  minLength: 1
                  type: string
              required:
              - text
              - target_lang
              type: object
      responses:
        '200':
          content:
            image/png:
              schema:
                properties:
                  result:
                    format: binary
                    type: string
                  success:
                    default: 'true'
                    type: boolean
                type: object
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    type: boolean
                required:
                - errors
                - success
                - result
                type: object
          description: Bad request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Execute @cf/meta/m2m100-1.2b model.
      tags:
      - Workers AI Translation
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
