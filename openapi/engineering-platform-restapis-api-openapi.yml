          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
      parameters:
      - name: restapi_id
        in: path
        required: true
        description: The string identifier of the associated RestApi.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'The type of API entities of the to-be-retrieved documentation parts. '
        schema:
          type: string
          enum:
          - API
          - AUTHORIZER
          - MODEL
          - RESOURCE
          - METHOD
          - PATH_PARAMETER
          - QUERY_PARAMETER
          - REQUEST_HEADER
          - REQUEST_BODY
          - RESPONSE
          - RESPONSE_HEADER
          - RESPONSE_BODY
      - name: name
        in: query
        required: false
        description: The name of API entities of the to-be-retrieved documentation parts.
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: The path of API entities of the to-be-retrieved documentation parts.
        schema:
          type: string
      - name: position
        in: query
        required: false
        description: The current pagination position in the paged result set.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: The maximum number of returned results per page. The default value is 25 and the maximum value is 500.
        schema:
          type: integer
      - name: locationStatus
        in: query
        required: false
        description: The status of the API documentation parts to retrieve. Valid values are <code>DOCUMENTED</code> for retrieving DocumentationPart resources with content and <code>UNDOCUMENTED</code> for DocumentationPart resources without content.
        schema:
          type: string
          enum:
          - DOCUMENTED
          - UNDOCUMENTED
      tags:
      - Restapis
    put:
      operationId: ImportDocumentationParts
      description: Imports documentation parts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationPartIds'
        '480':
          description: BadRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
        '481':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '482':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '483':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
        '484':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '485':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
      parameters:
      - name: restapi_id
        in: path
        required: true
        description: The string identifier of the associated RestApi.
