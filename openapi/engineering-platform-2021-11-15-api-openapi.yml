      parameters:
      - name: FunctionName
        in: path
        required: true
        description: <p>The name of the Lambda function.</p> <p class="title"> <b>Name formats</b> </p> <ul> <li> <p> <b>Function name</b> â€“ <code>my-function</code>.</p> </li> <li> <p> <b>Function ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:my-function</code>.</p> </li> <li> <p> <b>Partial ARN</b> â€“ <code>123456789012:function:my-function</code>.</p> </li> </ul> <p>The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.</p>
        schema:
          type: string
          pattern: (arn:(aws[a-zA-Z-]*)?:lambda:)?([a-z]{2}(-gov)?-[a-z]+-\d{1}:)?(\d{12}:)?(function:)?([a-zA-Z0-9-_\.]+)(:(\$LATEST|[a-zA-Z0-9-_]+))?
          minLength: 1
          maxLength: 170
      - name: X-Amz-Invocation-Type
        in: header
        required: false
        description: <p>Use one of the following options:</p> <ul> <li> <p> <code>RequestResponse</code> (default) â€“ Invoke the function synchronously. Keep the connection open until the function returns a response or times out. The API operation response includes the function response and additional data.</p> </li> <li> <p> <code>DryRun</code> â€“ Validate parameter values and verify that the IAM user or role has permission to invoke the function.</p> </li> </ul>
        schema:
          type: string
          enum:
          - RequestResponse
          - DryRun
      - name: X-Amz-Log-Type
        in: header
        required: false
        description: Set to <code>Tail</code> to include the execution log in the response. Applies to synchronously invoked functions only.
        schema:
          type: string
          enum:
          - None
          - Tail
      - name: X-Amz-Client-Context
        in: header
        required: false
        description: Up to 3,583 bytes of base64-encoded data about the invoking client to pass to the function in the context object.
        schema:
          type: string
      - name: Qualifier
        in: query
        required: false
        description: The alias name.
        schema:
          type: string
          pattern: (|[a-zA-Z0-9$_-]+)
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Payload:
                  description: '<p>The JSON that you want to provide to your Lambda function as input.</p> <p>You can enter the JSON directly. For example, <code>--payload ''{ "key": "value" }''</code>. You can also specify a file path. For example, <code>--payload file://payload.json</code>.</p>'
                  type: string
                  format: password
      tags:
      - 2021 11 15
components:
  schemas:
    InvalidRequestContentException: {}
    InvalidRuntimeException: {}
    InvalidSecurityGroupIDException: {}
    ResourceNotFoundException: {}
    EFSMountFailureException: {}
    ResourceConflictException: {}
    RequestTooLargeException: {}
    EFSMountConnectivityException: {}
    SubnetIPAddressLimitReachedException: {}
    InvalidSubnetIDException: {}
    InvalidParameterValueException: {}
    EC2UnexpectedException: {}
    InvokeResponseStreamUpdate:
      type: object
      properties:
        Payload:
          allOf:
          - $ref: '#/components/schemas/Blob'
          - description: Data returned by your Lambda function.
      description: A chunk of the streamed response payload.
    SnapStartTimeoutException: {}
    ENILimitReachedException: {}
    InvokeWithResponseStreamResponseEvent:
      type: object
      properties:
        PayloadChunk:
          allOf:
          - $ref: '#/components/schemas/InvokeResponseStreamUpdate'
          - description: A chunk of the streamed response payload.
        InvokeComplete:
          allOf:
          - $ref: '#/components/schemas/InvokeWithResponseStreamCompleteEvent'
          - description: An object that's returned when the stream has ended and all the payload chunks have been returned.
      description: An object that includes a chunk of the response payload. When the stream has ended, Lambda includes a <code>InvokeComplete</code> object.
    KMSNotFoundException: {}
    SnapStartNotReadyException: {}
    EFSMountTimeoutException: {}
    KMSDisabledException: {}
    UnsupportedMediaTypeException: {}
    EFSIOException: {}
    ServiceException: {}
    String:
      type: string
    Blob:
      type: string
      format: password
    InvalidZipFileException: {}
    InvokeWithResponseStreamResponse:
      type: object
      properties:
        StatusCode:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: For a successful request, the HTTP status code is in the 200 range. For the <code>RequestResponse</code> invocation type, this status code is 200. For the <code>DryRun</code> invocation type, this status code is 204.
        EventStream:
          allOf:
          - $ref: '#/components/schemas/InvokeWithResponseStreamResponseEvent'
          - description: The stream of response payloads.
    ResourceNotReadyException: {}
    KMSInvalidStateException: {}
    Integer:
      type: integer
    TooManyRequestsException: {}
    InvokeWithResponseStreamCompleteEvent:
      type: object
      properties:
        ErrorCode:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: An error code.
        ErrorDetails:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The details of any returned error.
        LogResult:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The last 4 KB of the execution log, which is base64-encoded.
      description: A response confirming that the event stream is complete.
    EC2AccessDeniedException: {}
    KMSAccessDeniedException: {}
    EC2ThrottledException: {}
    SnapStartException: {}
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
