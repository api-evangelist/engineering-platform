openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Workers AI API
  version: 4.0.0
tags:
- name: Workers AI
paths:
  /accounts/{account_id}/ai/authors/search:
    get:
      operationId: workers-ai-search-author
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      type: object
                    type: array
                  messages:
                    items:
                      type: object
                    type: array
                  result:
                    items:
                      type: object
                    type: array
                  success:
                    type: boolean
                required:
                - success
                - result
                - errors
                - messages
                type: object
          description: Returns a list of authors
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Object not found
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Author Search
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/ai/models/schema:
    get:
      operationId: workers-ai-get-model-schema
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      - description: Model Name
        in: query
        name: model
        required: true
        schema:
          description: Model Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - result
                type: object
          description: Model Schema
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get Model Schema
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/ai/models/search:
    get:
      operationId: workers-ai-search-model
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      - in: query
        name: per_page
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - description: Filter by Task Name
        in: query
        name: task
        schema:
          description: Filter by Task Name
          example: Text Generation
          type: string
      - description: Filter by Author
        in: query
        name: author
        schema:
          description: Filter by Author
          type: string
      - description: Filter by Source Id
        in: query
        name: source
        schema:
          description: Filter by Source Id
          type: number
      - description: Filter to hide experimental models
        in: query
        name: hide_experimental
        schema:
          description: Filter to hide experimental models
          type: boolean
      - description: Search
        in: query
        name: search
        schema:
          description: Search
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      type: object
                    type: array
                  messages:
                    items:
                      type: object
                    type: array
                  result:
                    items:
                      type: object
                    type: array
                  success:
                    type: boolean
                required:
                - success
                - result
                - errors
                - messages
                type: object
          description: Returns a list of models
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Object not found
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Model Search
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/ai/run/{model_name}:
    post:
      description: 'This endpoint provides users with the capability to run specific AI models on-demand.


        By submitting the required input data, users can receive real-time predictions or results generated by the chosen AI

        model. The endpoint supports various AI model types, ensuring flexibility and adaptability for diverse use cases.


        Model specific inputs available in [Cloudflare Docs](https://developers.cloudflare.com/workers-ai/models/).'
      operationId: workers-ai-post-run-model
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      - in: path
        name: model_name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - properties:
                  text:
                    minLength: 1
                    type: string
                required:
                - text
                title: Text Classification
                type: object
              - properties:
                  guidance:
                    default: 7.5
                    type: number
                  height:
                    maximum: 2048
                    minimum: 256
                    type: integer
                  image:
                    items:
                      type: number
                    type: array
                  image_b64:
                    type: string
                  mask:
                    items:
                      type: number
                    type: array
                  negative_prompt:
                    type: string
                  num_steps:
                    default: 20
                    maximum: 20
                    type: integer
                  prompt:
                    minLength: 1
                    type: string
                  seed:
                    type: integer
                  strength:
                    default: 1
                    type: number
                  width:
                    maximum: 2048
                    minimum: 256
                    type: integer
                required:
                - prompt
                title: Text To Image
                type: object
              - properties:
                  text:
                    oneOf:
                    - minLength: 1
                      type: string
                    - items:
                        minLength: 1
                        type: string
                      maxItems: 100
                      type: array
                required:
                - text
                title: Text Embeddings
                type: object
              - oneOf:
                - format: binary
                  type: string
                - properties:
                    audio:
                      items:
                        type: number
                      type: array
                    source_lang:
                      type: string
                    target_lang:
                      type: string
                  required:
                  - audio
                  type: object
                title: Automatic Speech Recognition
                type: object
              - oneOf:
                - format: binary
                  type: string
                - properties:
                    image:
                      items:
                        type: number
                      type: array
                  required:
                  - image
                  type: object
                title: Image Classification
                type: object
              - oneOf:
                - format: binary
                  type: string
                - properties:
                    image:
                      items:
                        type: number
                      type: array
                  type: object
                title: Object Detection
                type: object
              - oneOf:
                - properties:
                    frequency_penalty:
                      maximum: 2
                      minimum: 0
                      type: number
                    lora:
                      type: string
                    max_tokens:
                      default: 256
                      type: integer
                    presence_penalty:
                      maximum: 2
                      minimum: 0
                      type: number
                    prompt:
                      maxLength: 131072
                      minLength: 1
                      type: string
                    raw:
                      default: false
                      type: boolean
                    repetition_penalty:
                      maximum: 2
                      minimum: 0
                      type: number
                    seed:
                      maximum: 9999999999.0
                      minimum: 1
                      type: integer
                    stream:
                      default: false
                      type: boolean
                    temperature:
                      default: 0.6
                      maximum: 5
                      minimum: 0
                      type: number
                    top_k:
                      maximum: 50
                      minimum: 1
                      type: integer
                    top_p:
                      maximum: 2
                      minimum: 0
                      type: number
                  required:
                  - prompt
                - properties:
                    frequency_penalty:
                      maximum: 2
                      minimum: 0
                      type: number
                    functions:
                      items:
                        properties:
                          code:
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        - code
                        type: object
                      type: array
                    max_tokens:
                      default: 256
                      type: integer
                    messages:
                      items:
                        properties:
                          content:
                            maxLength: 131072
                            type: string
                          role:
                            type: string
                        required:
                        - role
                        - content
                        type: object
                      type: array
                    presence_penalty:
                      maximum: 2
                      minimum: 0
                      type: number
                    repetition_penalty:
                      maximum: 2
                      minimum: 0
                      type: number
                    seed:
                      maximum: 9999999999.0
                      minimum: 1
                      type: integer
                    stream:
                      default: false
                      type: boolean
                    temperature:
                      default: 0.6
                      maximum: 5
                      minimum: 0
                      type: number
                    tools:
                      items:
                        oneOf:
                        - properties:
                            description:
                              type: string
                            name:
                              type: string
                            parameters:
                              properties:
                                properties:
                                  additionalProperties:
                                    properties:
                                      description:
                                        type: string
                                      type:
                                        type: string
                                    required:
                                    - type
                                    - description
                                    type: object
                                  type: object
                                required:
                                  items:
                                    type: string
                                  type: array
                                type:
                                  type: string
                              required:
                              - type
                              - properties
                              type: object
                          required:
                          - name
                          - description
                          - parameters
                        - properties:
                            function:
                              properties:
                                description:
                                  type: string
                                name:
                                  type: string
                                parameters:
                                  properties:
                                    properties:
                                      additionalProperties:
                                        properties:
                                          description:
                                            type: string
                                          type:
                                            type: string
                                        required:
                                        - type
                                        - description
                                        type: object
                                      type: object
                                    required:
                                      items:
                                        type: string
                                      type: array
                                    type:
                                      type: string
                                  required:
                                  - type
                                  - properties
                                  type: object
                              required:
                              - name
                              - description
                              - parameters
                              type: object
                            type:
                              type: string
                          required:
                          - type
                          - function
                        type: object
                      type: array
                    top_k:
                      maximum: 50
                      minimum: 1
                      type: integer
                    top_p:
                      maximum: 2
                      minimum: 0
                      type: number
                  required:
                  - messages
                title: Text Generation
                type: object
              - properties:
                  source_lang:
                    default: en
                    type: string
                  target_lang:
                    type: string
                  text:
                    minLength: 1
                    type: string
                required:
                - text
                - target_lang
                title: Translation
                type: object
              - properties:
                  input_text:
                    minLength: 1
                    type: string
                  max_length:
                    default: 1024
                    type: integer
                required:
                - input_text
                title: Summarization
                type: object
              - oneOf:
                - format: binary
                  type: string
                - not:
                    required:
                    - prompt
                    - messages
                  properties:
                    image:
                      oneOf:
                      - items:
                          type: number
                        type: array
                      - format: binary
                        type: string
                    max_tokens:
                      default: 512
                      type: integer
                    messages:
                      items:
                        properties:
                          content:
                            maxLength: 6144
                            type: string
                          role:
                            type: string
                        required:
                        - role
                        - content
                        type: object
                      type: array
                    prompt:
                      type: string
                    raw:
                      default: false
                      type: boolean
                    temperature:
                      type: number
                  required:
                  - image
                  type: object
                title: Image To Text
                type: object
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    oneOf:
                    - items:
                        properties:
                          label:
                            type: string
                          score:
                            type: number
                        type: object
                      title: Text Classification
                      type: array
                    - format: binary
                      title: Text To Image
                      type: string
                    - properties:
                        data:
                          items:
                            items:
                              type: number
                            type: array
                          type: array
                        shape:
                          items:
                            type: number
                          type: array
                      title: Text Embeddings
                      type: object
                    - properties:
                        text:
                          type: string
                        vtt:
                          type: string
                        word_count:
                          type: number
                        words:
                          items:
                            properties:
                              end:
                                type: number
                              start:
                                type: number
                              word:
                                type: string
                            type: object
                          type: array
                      required:
                      - text
                      title: Automatic Speech Recognition
                      type: object
                    - items:
                        properties:
                          label:
                            type: string
                          score:
                            type: number
                        type: object
                      title: Image Classification
                      type: array
                    - items:
                        properties:
                          box:
                            properties:
                              xmax:
                                type: number
                              xmin:
                                type: number
                              ymax:
                                type: number
                              ymin:
                                type: number
                            type: object
                          label:
                            type: string
                          score:
                            type: number
                        type: object
                      title: Object Detection
                      type: array
                    - oneOf:
                      - properties:
                          response:
                            type: string
                          tool_calls:
                            items:
                              properties:
                                arguments:
                                  type: object
                                name:
                                  type: string
                              type: object
                            type: array
                        type: object
                      - format: binary
                        type: string
                      title: Text Generation
                      type: object
                    - properties:
                        translated_text:
                          type: string
                      title: Translation
                      type: object
                    - properties:
                        summary:
                          type: string
                      title: Summarization
                      type: object
                    - properties:
                        description:
                          type: string
                      title: Image To Text
                      type: object
                    type: object
                type: object
          description: Model response
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Execute AI model
      tags:
      - Workers AI
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/ai/tasks/search:
    get:
      operationId: workers-ai-search-task
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      type: object
                    type: array
                  messages:
                    items:
                      type: object
                    type: array
                  result:
                    items:
                      type: object
                    type: array
                  success:
                    type: boolean
                required:
                - success
                - result
                - errors
                - messages
                type: object
          description: Returns a list of tasks
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Object not found
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Task Search
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
components:
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
