components:
  schemas:
    cloudforce-one_uuid:
      description: UUID
      example: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
      maxLength: 36
      type: string
    cloudforce-one_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      type: string
    cloudforce-one_tlp:
      description: The CISA defined Traffic Light Protocol (TLP)
      enum:
      - clear
      - amber
      - amber-strict
      - green
      - red
      title: TLP
      type: string
    cloudforce-one_request-constants:
      properties:
        priority:
          example:
          - routine
          - high
          - urgent
          items:
            $ref: '#/components/schemas/cloudforce-one_priority'
          type: array
        status:
          example:
          - open
          - accepted
          - reported
          - approved
          - completed
          - declined
          items:
            $ref: '#/components/schemas/cloudforce-one_request-status'
          type: array
        tlp:
          example:
          - clear
          - green
          - amber
          - amber-strict
          - red
          items:
            $ref: '#/components/schemas/cloudforce-one_tlp'
          type: array
      title: Request Constants
      type: object
    cloudforce-one_request-status:
      description: Request Status
      enum:
      - open
      - accepted
      - reported
      - approved
      - completed
      - declined
      title: Request Status
      type: string
    cloudforce-one_time:
      example: '2022-04-01T05:20:00Z'
      format: date-time
      type: string
    cloudforce-one_api-response-common:
      properties:
        errors:
