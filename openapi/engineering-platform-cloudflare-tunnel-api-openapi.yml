        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_tunnel_response_token'
          description: Get a Cloudflare Tunnel management token response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
