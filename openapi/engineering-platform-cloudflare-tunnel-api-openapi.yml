        required: true
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                resources:
                  items:
                    $ref: '#/components/schemas/tunnel_management-resources'
                  type: array
              required:
              - resources
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
