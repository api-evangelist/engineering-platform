paths:
  /accounts/{account_id}/cfd_tunnel:
    get:
      description: Lists and filters Cloudflare Tunnels in an account.
      operationId: cloudflare-tunnel-list-cloudflare-tunnels
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      - in: query
        name: name
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_name'
      - in: query
        name: is_deleted
        schema:
          description: If `true`, only include deleted tunnels. If `false`, exclude deleted tunnels. If empty, all tunnels will be included.
          example: true
          type: boolean
      - in: query
        name: existed_at
        schema:
          $ref: '#/components/schemas/tunnel_existed_at'
      - in: query
        name: uuid
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      - in: query
        name: was_active_at
        schema:
          example: '2009-11-10T23:00:00Z'
          format: date-time
          type: string
      - in: query
        name: was_inactive_at
        schema:
          example: '2009-11-10T23:00:00Z'
          format: date-time
          type: string
      - in: query
        name: include_prefix
        schema:
          example: vpc1-
          type: string
      - in: query
        name: exclude_prefix
        schema:
          example: vpc1-
          type: string
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/tunnel_status'
      - in: query
        name: per_page
        schema:
          $ref: '#/components/schemas/tunnel_per_page'
      - in: query
        name: page
        schema:
          default: 1
          description: Page number of paginated results.
          minimum: 1
          type: number
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tunnel_tunnel-response-collection'
                - $ref: '#/components/schemas/tunnel_api-response-common-failure'
          description: List Cloudflare Tunnels response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_tunnel-response-collection'
          description: List Cloudflare Tunnels response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List Cloudflare Tunnels
      tags:
      - Cloudflare Tunnel
      x-api-token-group:
      - Cloudflare One Connectors Write
      - Cloudflare One Connectors Read
      - Cloudflare One cloudflared Connectors Write
      - Cloudflare One cloudflared Connectors Read
      - Argo Tunnel Write
      - Argo Tunnel Read
    post:
      description: Creates a new Cloudflare Tunnel in an account.
      operationId: cloudflare-tunnel-create-a-cloudflare-tunnel
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                config_src:
                  $ref: '#/components/schemas/tunnel_config_src'
                name:
                  $ref: '#/components/schemas/tunnel_tunnel_name'
                tunnel_secret:
                  $ref: '#/components/schemas/tunnel_tunnel_secret'
              required:
              - name
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tunnel_tunnel-response-single'
                - $ref: '#/components/schemas/tunnel_api-response-common-failure'
          description: Create a Cloudflare Tunnel response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_tunnel-response-single'
          description: Create a Cloudflare Tunnel response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Create a Cloudflare Tunnel
      tags:
      - Cloudflare Tunnel
      x-api-token-group:
      - Cloudflare One Connectors Write
      - Cloudflare One cloudflared Connectors Write
      - Argo Tunnel Write
  /accounts/{account_id}/cfd_tunnel/{tunnel_id}:
    delete:
      description: Deletes a Cloudflare Tunnel from an account.
      operationId: cloudflare-tunnel-delete-a-cloudflare-tunnel
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      - in: path
        name: tunnel_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
