          description: Delete a Cloudflare Tunnel response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Delete a Cloudflare Tunnel
      tags:
      - Cloudflare Tunnel
      x-api-token-group:
      - Cloudflare One Connectors Write
      - Cloudflare One cloudflared Connectors Write
      - Argo Tunnel Write
    get:
      description: Fetches a single Cloudflare Tunnel.
      operationId: cloudflare-tunnel-get-a-cloudflare-tunnel
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      - in: path
        name: tunnel_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tunnel_tunnel-response-single'
                - $ref: '#/components/schemas/tunnel_api-response-common-failure'
          description: Get a Cloudflare Tunnel response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_tunnel-response-single'
          description: Get a Cloudflare Tunnel response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Get a Cloudflare Tunnel
      tags:
      - Cloudflare Tunnel
      x-api-token-group:
      - Cloudflare One Connectors Write
      - Cloudflare One Connectors Read
      - Cloudflare One cloudflared Connectors Write
      - Cloudflare One cloudflared Connectors Read
      - Argo Tunnel Write
      - Argo Tunnel Read
    patch:
      description: Updates an existing Cloudflare Tunnel.
      operationId: cloudflare-tunnel-update-a-cloudflare-tunnel
      parameters:
      - in: path
        name: tunnel_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  $ref: '#/components/schemas/tunnel_tunnel_name'
                tunnel_secret:
                  $ref: '#/components/schemas/tunnel_tunnel_secret'
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tunnel_tunnel-response-single'
                - $ref: '#/components/schemas/tunnel_api-response-common-failure'
          description: Update a Cloudflare Tunnel response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_tunnel-response-single'
          description: Update a Cloudflare Tunnel response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Update a Cloudflare Tunnel
      tags:
      - Cloudflare Tunnel
      x-api-token-group:
      - Cloudflare One Connectors Write
      - Cloudflare One cloudflared Connectors Write
      - Argo Tunnel Write
  /accounts/{account_id}/cfd_tunnel/{tunnel_id}/connections:
    delete:
      description: Removes a connection (aka Cloudflare Tunnel Connector) from a Cloudflare Tunnel independently of its current state. If no connector id (client_id) is provided all connectors will be removed. We recommend running this command after rotating tokens.
      operationId: cloudflare-tunnel-clean-up-cloudflare-tunnel-connections
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      - in: path
        name: tunnel_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      - in: query
        name: client_id
        schema:
          $ref: '#/components/schemas/tunnel_client_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tunnel_empty_response'
                - $ref: '#/components/schemas/tunnel_api-response-common-failure'
          description: Clean up Cloudflare Tunnel connections response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_empty_response'
          description: Clean up Cloudflare Tunnel connections response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform Clean up Cloudflare Tunnel connections
      tags:
      - Cloudflare Tunnel
    get:
      description: Fetches connection details for a Cloudflare Tunnel.
      operationId: cloudflare-tunnel-list-cloudflare-tunnel-connections
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_account_id'
      - in: path
        name: tunnel_id
        required: true
        schema:
          $ref: '#/components/schemas/tunnel_tunnel_id'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tunnel_tunnel_connections_response'
                - $ref: '#/components/schemas/tunnel_api-response-common-failure'
          description: List Cloudflare Tunnel connections response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tunnel_tunnel_connections_response'
          description: List Cloudflare Tunnel connections response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      - user_service_key: []
      summary: APIs.io Engineering Platform List Cloudflare Tunnel connections
      tags:
      - Cloudflare Tunnel
  /accounts/{account_id}/cfd_tunnel/{tunnel_id}/connectors/{connector_id}:
