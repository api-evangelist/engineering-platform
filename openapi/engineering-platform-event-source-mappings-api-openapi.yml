paths:
  /2015-03-31/event-source-mappings/:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateEventSourceMapping
      description: <p>Creates a mapping between an event source and an Lambda function. Lambda reads items from the event source and invokes the function.</p> <p>For details about how to configure different event sources, see the following topics. </p> <ul> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-ddb.html#services-dynamodb-eventsourcemapping"> Amazon DynamoDB Streams</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html#services-kinesis-eventsourcemapping"> Amazon Kinesis</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html#events-sqs-eventsource"> Amazon SQS</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-mq.html#services-mq-eventsourcemapping"> Amazon MQ and RabbitMQ</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html"> Amazon MSK</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/kafka-smaa.html"> Apache Kafka</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-documentdb.html"> Amazon DocumentDB</a> </p> </li> </ul> <p>The following error handling options are available only for stream sources (DynamoDB and Kinesis):</p> <ul> <li> <p> <code>BisectBatchOnFunctionError</code> â€“ If the function returns an error, split the batch in two and retry.</p> </li> <li> <p> <code>DestinationConfig</code> â€“ Send discarded records to an Amazon SQS queue or Amazon SNS topic.</p> </li> <li> <p> <code>MaximumRecordAgeInSeconds</code> â€“ Discard records older than the specified age. The default value is infinite (-1). When set to infinite (-1), failed records are retried until the record expires</p> </li> <li> <p> <code>MaximumRetryAttempts</code> â€“ Discard records after the specified number of retries. The default value is infinite (-1). When set to infinite (-1), failed records are retried until the record expires.</p> </li> <li> <p> <code>ParallelizationFactor</code> â€“ Process multiple batches from each shard concurrently.</p> </li> </ul> <p>For information about which configuration parameters apply to each event source, see the following topics.</p> <ul> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-ddb.html#services-ddb-params"> Amazon DynamoDB Streams</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html#services-kinesis-params"> Amazon Kinesis</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html#services-sqs-params"> Amazon SQS</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-mq.html#services-mq-params"> Amazon MQ and RabbitMQ</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html#services-msk-parms"> Amazon MSK</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-kafka.html#services-kafka-parms"> Apache Kafka</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-documentdb.html#docdb-configuration"> Amazon DocumentDB</a> </p> </li> </ul>
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSourceMappingConfiguration'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '482':
          description: ResourceConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceConflictException'
        '483':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
        '484':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - FunctionName
              properties:
                EventSourceArn:
                  description: <p>The Amazon Resource Name (ARN) of the event source.</p> <ul> <li> <p> <b>Amazon Kinesis</b> â€“ The ARN of the data stream or a stream consumer.</p> </li> <li> <p> <b>Amazon DynamoDB Streams</b> â€“ The ARN of the stream.</p> </li> <li> <p> <b>Amazon Simple Queue Service</b> â€“ The ARN of the queue.</p> </li> <li> <p> <b>Amazon Managed Streaming for Apache Kafka</b> â€“ The ARN of the cluster.</p> </li> <li> <p> <b>Amazon MQ</b> â€“ The ARN of the broker.</p> </li> <li> <p> <b>Amazon DocumentDB</b> â€“ The ARN of the DocumentDB change stream.</p> </li> </ul>
                  type: string
                  pattern: arn:(aws[a-zA-Z0-9-]*):([a-zA-Z0-9\-])+:([a-z]{2}(-gov)?-[a-z]+-\d{1})?:(\d{12})?:(.*)
                FunctionName:
                  description: <p>The name of the Lambda function.</p> <p class="title"> <b>Name formats</b> </p> <ul> <li> <p> <b>Function name</b> â€“ <code>MyFunction</code>.</p> </li> <li> <p> <b>Function ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:MyFunction</code>.</p> </li> <li> <p> <b>Version or Alias ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:MyFunction:PROD</code>.</p> </li> <li> <p> <b>Partial ARN</b> â€“ <code>123456789012:function:MyFunction</code>.</p> </li> </ul> <p>The length constraint applies only to the full ARN. If you specify only the function name, it's limited to 64 characters in length.</p>
                  type: string
                  pattern: (arn:(aws[a-zA-Z-]*)?:lambda:)?([a-z]{2}(-gov)?-[a-z]+-\d{1}:)?(\d{12}:)?(function:)?([a-zA-Z0-9-_]+)(:(\$LATEST|[a-zA-Z0-9-_]+))?
                  minLength: 1
                  maxLength: 140
                Enabled:
                  description: '<p>When true, the event source mapping is active. When false, Lambda pauses polling and invocation.</p> <p>Default: True</p>'
                  type: boolean
                BatchSize:
                  description: <p>The maximum number of records in each batch that Lambda pulls from your stream or queue and sends to your function. Lambda passes all of the records in the batch to the function in a single call, up to the payload limit for synchronous invocation (6 MB).</p> <ul> <li> <p> <b>Amazon Kinesis</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Amazon DynamoDB Streams</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Amazon Simple Queue Service</b> â€“ Default 10. For standard queues the max is 10,000. For FIFO queues the max is 10.</p> </li> <li> <p> <b>Amazon Managed Streaming for Apache Kafka</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Self-managed Apache Kafka</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Amazon MQ (ActiveMQ and RabbitMQ)</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>DocumentDB</b> â€“ Default 100. Max 10,000.</p> </li> </ul>
                  type: integer
                  minimum: 1
                  maximum: 10000
                FilterCriteria:
                  description: ' An object that contains the filters for an event source. '
                  type: object
                  properties:
                    Filters:
                      allOf:
                      - $ref: '#/components/schemas/FilterList'
                      - description: ' A list of filters. '
                MaximumBatchingWindowInSeconds:
                  description: '<p>The maximum amount of time, in seconds, that Lambda spends gathering records before invoking the function. You can configure <code>MaximumBatchingWindowInSeconds</code> to any value from 0 seconds to 300 seconds in increments of seconds.</p> <p>For streams and Amazon SQS event sources, the default batching window is 0 seconds. For Amazon MSK, Self-managed Apache Kafka, Amazon MQ, and DocumentDB event sources, the default batching window is 500 ms. Note that because you can only change <code>MaximumBatchingWindowInSeconds</code> in increments of seconds, you cannot revert back to the 500 ms default batching window after you have changed it. To restore the default batching window, you must create a new event source mapping.</p> <p>Related setting: For streams and Amazon SQS event sources, when you set <code>BatchSize</code> to a value greater than 10, you must set <code>MaximumBatchingWindowInSeconds</code> to at least 1.</p>'
                  type: integer
                  minimum: 0
                  maximum: 300
                ParallelizationFactor:
                  description: (Kinesis and DynamoDB Streams only) The number of batches to process from each shard concurrently.
                  type: integer
                  minimum: 1
                  maximum: 10
                StartingPosition:
                  description: The position in a stream from which to start reading. Required for Amazon Kinesis, Amazon DynamoDB, and Amazon MSK Streams sources. <code>AT_TIMESTAMP</code> is supported only for Amazon Kinesis streams and Amazon DocumentDB.
                  type: string
                  enum:
                  - TRIM_HORIZON
                  - LATEST
                  - AT_TIMESTAMP
                StartingPositionTimestamp:
                  description: With <code>StartingPosition</code> set to <code>AT_TIMESTAMP</code>, the time from which to start reading.
                  type: string
                  format: date-time
                DestinationConfig:
                  description: A configuration object that specifies the destination of an event after Lambda processes it.
                  type: object
                  properties:
                    OnSuccess:
                      allOf:
                      - $ref: '#/components/schemas/OnSuccess'
                      - description: The destination configuration for successful invocations.
                    OnFailure:
                      allOf:
                      - $ref: '#/components/schemas/OnFailure'
                      - description: The destination configuration for failed invocations.
                MaximumRecordAgeInSeconds:
                  description: (Kinesis and DynamoDB Streams only) Discard records older than the specified age. The default value is infinite (-1).
                  type: integer
                  minimum: -1
                  maximum: 604800
                BisectBatchOnFunctionError:
                  description: (Kinesis and DynamoDB Streams only) If the function returns an error, split the batch in two and retry.
                  type: boolean
                MaximumRetryAttempts:
                  description: (Kinesis and DynamoDB Streams only) Discard records after the specified number of retries. The default value is infinite (-1). When set to infinite (-1), failed records are retried until the record expires.
                  type: integer
                  minimum: -1
                  maximum: 10000
                TumblingWindowInSeconds:
                  description: (Kinesis and DynamoDB Streams only) The duration in seconds of a processing window for DynamoDB and Kinesis Streams event sources. A value of 0 seconds indicates no tumbling window.
                  type: integer
                  minimum: 0
                  maximum: 900
                Topics:
                  description: The name of the Kafka topic.
                  type: array
                  items:
                    $ref: '#/components/schemas/Topic'
                  minItems: 1
                  maxItems: 1
                Queues:
                  description: ' (MQ) The name of the Amazon MQ broker destination queue to consume. '
                  type: array
                  items:
                    $ref: '#/components/schemas/Queue'
                  minItems: 1
                  maxItems: 1
                SourceAccessConfigurations:
                  description: An array of authentication protocols or VPC components required to secure your event source.
                  type: array
                  items:
                    $ref: '#/components/schemas/SourceAccessConfiguration'
                  minItems: 0
                  maxItems: 22
                SelfManagedEventSource:
                  description: The self-managed Apache Kafka cluster for your event source.
                  type: object
                  properties:
                    Endpoints:
                      allOf:
                      - $ref: '#/components/schemas/Endpoints'
                      - description: 'The list of bootstrap servers for your Kafka brokers in the following format: <code>"KAFKA_BOOTSTRAP_SERVERS": ["abc.xyz.com:xxxx","abc2.xyz.com:xxxx"]</code>.'
                FunctionResponseTypes:
                  description: (Kinesis, DynamoDB Streams, and Amazon SQS) A list of current response type enums applied to the event source mapping.
                  type: array
                  items:
                    $ref: '#/components/schemas/FunctionResponseType'
                  minItems: 0
                  maxItems: 1
                AmazonManagedKafkaEventSourceConfig:
                  description: Specific configuration settings for an Amazon Managed Streaming for Apache Kafka (Amazon MSK) event source.
                  type: object
                  properties:
                    ConsumerGroupId:
                      allOf:
                      - $ref: '#/components/schemas/URI'
                      - description: The identifier for the Kafka consumer group to join. The consumer group ID must be unique among all your Kafka event sources. After creating a Kafka event source mapping with the consumer group ID specified, you cannot update this value. For more information, see <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html#services-msk-consumer-group-id">Customizable consumer group ID</a>.
                SelfManagedKafkaEventSourceConfig:
                  description: Specific configuration settings for a self-managed Apache Kafka event source.
                  type: object
                  properties:
                    ConsumerGroupId:
                      allOf:
                      - $ref: '#/components/schemas/URI'
                      - description: The identifier for the Kafka consumer group to join. The consumer group ID must be unique among all your Kafka event sources. After creating a Kafka event source mapping with the consumer group ID specified, you cannot update this value. For more information, see <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html#services-msk-consumer-group-id">Customizable consumer group ID</a>.
                ScalingConfig:
                  description: (Amazon SQS only) The scaling configuration for the event source. To remove the configuration, pass an empty value.
                  type: object
                  properties:
                    MaximumConcurrency:
                      allOf:
                      - $ref: '#/components/schemas/MaximumConcurrency'
                      - description: Limits the number of concurrent instances that the Amazon SQS event source can invoke.
                DocumentDBEventSourceConfig:
                  description: ' Specific configuration settings for a DocumentDB event source. '
                  type: object
                  properties:
                    DatabaseName:
                      allOf:
                      - $ref: '#/components/schemas/DatabaseName'
                      - description: ' The name of the database to consume within the DocumentDB cluster. '
                    CollectionName:
                      allOf:
                      - $ref: '#/components/schemas/CollectionName'
                      - description: ' The name of the collection to consume within the database. If you do not specify a collection, Lambda consumes all collections. '
                    FullDocument:
                      allOf:
                      - $ref: '#/components/schemas/FullDocument'
                      - description: ' Determines what DocumentDB sends to your event stream during document update operations. If set to UpdateLookup, DocumentDB sends a delta describing the changes, along with a copy of the entire document. Otherwise, DocumentDB sends only a partial document that contains the changes. '
      tags:
      - Event Source Mappings
    get:
      operationId: ListEventSourceMappings
      description: Lists event source mappings. Specify an <code>EventSourceArn</code> to show only event source mappings for a single event source.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventSourceMappingsResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '483':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
      parameters:
      - name: EventSourceArn
        in: query
        required: false
        description: <p>The Amazon Resource Name (ARN) of the event source.</p> <ul> <li> <p> <b>Amazon Kinesis</b> â€“ The ARN of the data stream or a stream consumer.</p> </li> <li> <p> <b>Amazon DynamoDB Streams</b> â€“ The ARN of the stream.</p> </li> <li> <p> <b>Amazon Simple Queue Service</b> â€“ The ARN of the queue.</p> </li> <li> <p> <b>Amazon Managed Streaming for Apache Kafka</b> â€“ The ARN of the cluster.</p> </li> <li> <p> <b>Amazon MQ</b> â€“ The ARN of the broker.</p> </li> <li> <p> <b>Amazon DocumentDB</b> â€“ The ARN of the DocumentDB change stream.</p> </li> </ul>
        schema:
          type: string
          pattern: arn:(aws[a-zA-Z0-9-]*):([a-zA-Z0-9\-])+:([a-z]{2}(-gov)?-[a-z]+-\d{1})?:(\d{12})?:(.*)
      - name: FunctionName
        in: query
        required: false
        description: <p>The name of the Lambda function.</p> <p class="title"> <b>Name formats</b> </p> <ul> <li> <p> <b>Function name</b> â€“ <code>MyFunction</code>.</p> </li> <li> <p> <b>Function ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:MyFunction</code>.</p> </li> <li> <p> <b>Version or Alias ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:MyFunction:PROD</code>.</p> </li> <li> <p> <b>Partial ARN</b> â€“ <code>123456789012:function:MyFunction</code>.</p> </li> </ul> <p>The length constraint applies only to the full ARN. If you specify only the function name, it's limited to 64 characters in length.</p>
        schema:
          type: string
          pattern: (arn:(aws[a-zA-Z-]*)?:lambda:)?([a-z]{2}(-gov)?-[a-z]+-\d{1}:)?(\d{12}:)?(function:)?([a-zA-Z0-9-_]+)(:(\$LATEST|[a-zA-Z0-9-_]+))?
          minLength: 1
          maxLength: 140
      - name: Marker
        in: query
        required: false
        description: A pagination token returned by a previous call.
        schema:
          type: string
      - name: MaxItems
        in: query
        required: false
        description: The maximum number of event source mappings to return. Note that ListEventSourceMappings returns a maximum of 100 items in each response, even if you set the number higher.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      tags:
      - Event Source Mappings
  /2015-03-31/event-source-mappings/{UUID}:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
