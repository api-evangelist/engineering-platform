              schema:
                $ref: '#/components/schemas/ResourceInUseException'
      parameters:
      - name: UUID
        in: path
        required: true
        description: The identifier of the event source mapping.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                FunctionName:
                  description: <p>The name of the Lambda function.</p> <p class="title"> <b>Name formats</b> </p> <ul> <li> <p> <b>Function name</b> â€“ <code>MyFunction</code>.</p> </li> <li> <p> <b>Function ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:MyFunction</code>.</p> </li> <li> <p> <b>Version or Alias ARN</b> â€“ <code>arn:aws:lambda:us-west-2:123456789012:function:MyFunction:PROD</code>.</p> </li> <li> <p> <b>Partial ARN</b> â€“ <code>123456789012:function:MyFunction</code>.</p> </li> </ul> <p>The length constraint applies only to the full ARN. If you specify only the function name, it's limited to 64 characters in length.</p>
                  type: string
                  pattern: (arn:(aws[a-zA-Z-]*)?:lambda:)?([a-z]{2}(-gov)?-[a-z]+-\d{1}:)?(\d{12}:)?(function:)?([a-zA-Z0-9-_]+)(:(\$LATEST|[a-zA-Z0-9-_]+))?
                  minLength: 1
                  maxLength: 140
                Enabled:
                  description: '<p>When true, the event source mapping is active. When false, Lambda pauses polling and invocation.</p> <p>Default: True</p>'
                  type: boolean
                BatchSize:
                  description: <p>The maximum number of records in each batch that Lambda pulls from your stream or queue and sends to your function. Lambda passes all of the records in the batch to the function in a single call, up to the payload limit for synchronous invocation (6 MB).</p> <ul> <li> <p> <b>Amazon Kinesis</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Amazon DynamoDB Streams</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Amazon Simple Queue Service</b> â€“ Default 10. For standard queues the max is 10,000. For FIFO queues the max is 10.</p> </li> <li> <p> <b>Amazon Managed Streaming for Apache Kafka</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Self-managed Apache Kafka</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>Amazon MQ (ActiveMQ and RabbitMQ)</b> â€“ Default 100. Max 10,000.</p> </li> <li> <p> <b>DocumentDB</b> â€“ Default 100. Max 10,000.</p> </li> </ul>
                  type: integer
                  minimum: 1
                  maximum: 10000
                FilterCriteria:
                  description: ' An object that contains the filters for an event source. '
                  type: object
                  properties:
                    Filters:
                      allOf:
                      - $ref: '#/components/schemas/FilterList'
                      - description: ' A list of filters. '
                MaximumBatchingWindowInSeconds:
                  description: '<p>The maximum amount of time, in seconds, that Lambda spends gathering records before invoking the function. You can configure <code>MaximumBatchingWindowInSeconds</code> to any value from 0 seconds to 300 seconds in increments of seconds.</p> <p>For streams and Amazon SQS event sources, the default batching window is 0 seconds. For Amazon MSK, Self-managed Apache Kafka, Amazon MQ, and DocumentDB event sources, the default batching window is 500 ms. Note that because you can only change <code>MaximumBatchingWindowInSeconds</code> in increments of seconds, you cannot revert back to the 500 ms default batching window after you have changed it. To restore the default batching window, you must create a new event source mapping.</p> <p>Related setting: For streams and Amazon SQS event sources, when you set <code>BatchSize</code> to a value greater than 10, you must set <code>MaximumBatchingWindowInSeconds</code> to at least 1.</p>'
                  type: integer
                  minimum: 0
                  maximum: 300
                DestinationConfig:
                  description: A configuration object that specifies the destination of an event after Lambda processes it.
                  type: object
                  properties:
                    OnSuccess:
                      allOf:
                      - $ref: '#/components/schemas/OnSuccess'
                      - description: The destination configuration for successful invocations.
                    OnFailure:
                      allOf:
                      - $ref: '#/components/schemas/OnFailure'
                      - description: The destination configuration for failed invocations.
                MaximumRecordAgeInSeconds:
                  description: (Kinesis and DynamoDB Streams only) Discard records older than the specified age. The default value is infinite (-1).
                  type: integer
                  minimum: -1
                  maximum: 604800
                BisectBatchOnFunctionError:
                  description: (Kinesis and DynamoDB Streams only) If the function returns an error, split the batch in two and retry.
                  type: boolean
                MaximumRetryAttempts:
                  description: (Kinesis and DynamoDB Streams only) Discard records after the specified number of retries. The default value is infinite (-1). When set to infinite (-1), failed records are retried until the record expires.
                  type: integer
                  minimum: -1
                  maximum: 10000
                ParallelizationFactor:
                  description: (Kinesis and DynamoDB Streams only) The number of batches to process from each shard concurrently.
                  type: integer
                  minimum: 1
                  maximum: 10
                SourceAccessConfigurations:
                  description: An array of authentication protocols or VPC components required to secure your event source.
                  type: array
                  items:
                    $ref: '#/components/schemas/SourceAccessConfiguration'
                  minItems: 0
                  maxItems: 22
                TumblingWindowInSeconds:
                  description: (Kinesis and DynamoDB Streams only) The duration in seconds of a processing window for DynamoDB and Kinesis Streams event sources. A value of 0 seconds indicates no tumbling window.
                  type: integer
                  minimum: 0
                  maximum: 900
                FunctionResponseTypes:
                  description: (Kinesis, DynamoDB Streams, and Amazon SQS) A list of current response type enums applied to the event source mapping.
                  type: array
                  items:
                    $ref: '#/components/schemas/FunctionResponseType'
                  minItems: 0
                  maxItems: 1
                ScalingConfig:
                  description: (Amazon SQS only) The scaling configuration for the event source. To remove the configuration, pass an empty value.
                  type: object
                  properties:
                    MaximumConcurrency:
                      allOf:
                      - $ref: '#/components/schemas/MaximumConcurrency'
                      - description: Limits the number of concurrent instances that the Amazon SQS event source can invoke.
                DocumentDBEventSourceConfig:
                  description: ' Specific configuration settings for a DocumentDB event source. '
                  type: object
                  properties:
                    DatabaseName:
                      allOf:
                      - $ref: '#/components/schemas/DatabaseName'
                      - description: ' The name of the database to consume within the DocumentDB cluster. '
                    CollectionName:
                      allOf:
                      - $ref: '#/components/schemas/CollectionName'
                      - description: ' The name of the collection to consume within the database. If you do not specify a collection, Lambda consumes all collections. '
                    FullDocument:
                      allOf:
                      - $ref: '#/components/schemas/FullDocument'
                      - description: ' Determines what DocumentDB sends to your event stream during document update operations. If set to UpdateLookup, DocumentDB sends a delta describing the changes, along with a copy of the entire document. Otherwise, DocumentDB sends only a partial document that contains the changes. '
      tags:
      - Event Source Mappings
components:
  schemas:
    EventSourceMappingConfiguration:
      type: object
      properties:
        UUID:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The identifier of the event source mapping.
        StartingPosition:
          allOf:
          - $ref: '#/components/schemas/EventSourcePosition'
          - description: The position in a stream from which to start reading. Required for Amazon Kinesis, Amazon DynamoDB, and Amazon MSK stream sources. <code>AT_TIMESTAMP</code> is supported only for Amazon Kinesis streams and Amazon DocumentDB.
        StartingPositionTimestamp:
          allOf:
          - $ref: '#/components/schemas/Date'
          - description: With <code>StartingPosition</code> set to <code>AT_TIMESTAMP</code>, the time from which to start reading.
        BatchSize:
          allOf:
          - $ref: '#/components/schemas/BatchSize'
          - description: '<p>The maximum number of records in each batch that Lambda pulls from your stream or queue and sends to your function. Lambda passes all of the records in the batch to the function in a single call, up to the payload limit for synchronous invocation (6 MB).</p> <p>Default value: Varies by service. For Amazon SQS, the default is 10. For all other services, the default is 100.</p> <p>Related setting: When you set <code>BatchSize</code> to a value greater than 10, you must set <code>MaximumBatchingWindowInSeconds</code> to at least 1.</p>'
        MaximumBatchingWindowInSeconds:
          allOf:
          - $ref: '#/components/schemas/MaximumBatchingWindowInSeconds'
          - description: '<p>The maximum amount of time, in seconds, that Lambda spends gathering records before invoking the function. You can configure <code>MaximumBatchingWindowInSeconds</code> to any value from 0 seconds to 300 seconds in increments of seconds.</p> <p>For streams and Amazon SQS event sources, the default batching window is 0 seconds. For Amazon MSK, Self-managed Apache Kafka, Amazon MQ, and DocumentDB event sources, the default batching window is 500 ms. Note that because you can only change <code>MaximumBatchingWindowInSeconds</code> in increments of seconds, you cannot revert back to the 500 ms default batching window after you have changed it. To restore the default batching window, you must create a new event source mapping.</p> <p>Related setting: For streams and Amazon SQS event sources, when you set <code>BatchSize</code> to a value greater than 10, you must set <code>MaximumBatchingWindowInSeconds</code> to at least 1.</p>'
        ParallelizationFactor:
          allOf:
          - $ref: '#/components/schemas/ParallelizationFactor'
          - description: (Kinesis and DynamoDB Streams only) The number of batches to process concurrently from each shard. The default value is 1.
        EventSourceArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The Amazon Resource Name (ARN) of the event source.
        FilterCriteria:
          allOf:
          - $ref: '#/components/schemas/FilterCriteria'
          - description: An object that defines the filter criteria that determine whether Lambda should process an event. For more information, see <a href="https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html">Lambda event filtering</a>.
        FunctionArn:
          allOf:
          - $ref: '#/components/schemas/FunctionArn'
          - description: The ARN of the Lambda function.
        LastModified:
          allOf:
          - $ref: '#/components/schemas/Date'
          - description: The date that the event source mapping was last updated or that its state changed.
        LastProcessingResult:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The result of the last Lambda invocation of your function.
        State:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'The state of the event source mapping. It can be one of the following: <code>Creating</code>, <code>Enabling</code>, <code>Enabled</code>, <code>Disabling</code>, <code>Disabled</code>, <code>Updating</code>, or <code>Deleting</code>.'
        StateTransitionReason:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Indicates whether a user or Lambda made the last change to the event source mapping.
        DestinationConfig:
          allOf:
          - $ref: '#/components/schemas/DestinationConfig'
          - description: (Kinesis and DynamoDB Streams only) An Amazon SQS queue or Amazon SNS topic destination for discarded records.
        Topics:
          allOf:
          - $ref: '#/components/schemas/Topics'
          - description: The name of the Kafka topic.
        Queues:
          allOf:
          - $ref: '#/components/schemas/Queues'
          - description: ' (Amazon MQ) The name of the Amazon MQ broker destination queue to consume.'
        SourceAccessConfigurations:
          allOf:
          - $ref: '#/components/schemas/SourceAccessConfigurations'
          - description: An array of the authentication protocol, VPC components, or virtual host to secure and define your event source.
        SelfManagedEventSource:
          allOf:
          - $ref: '#/components/schemas/SelfManagedEventSource'
          - description: The self-managed Apache Kafka cluster for your event source.
        MaximumRecordAgeInSeconds:
          allOf:
          - $ref: '#/components/schemas/MaximumRecordAgeInSeconds'
          - description: <p>(Kinesis and DynamoDB Streams only) Discard records older than the specified age. The default value is -1, which sets the maximum age to infinite. When the value is set to infinite, Lambda never discards old records.</p> <note> <p>The minimum value that can be set is 60 seconds.</p> </note>
        BisectBatchOnFunctionError:
          allOf:
          - $ref: '#/components/schemas/BisectBatchOnFunctionError'
          - description: (Kinesis and DynamoDB Streams only) If the function returns an error, split the batch in two and retry. The default value is false.
        MaximumRetryAttempts:
          allOf:
          - $ref: '#/components/schemas/MaximumRetryAttemptsEventSourceMapping'
          - description: (Kinesis and DynamoDB Streams only) Discard records after the specified number of retries. The default value is -1, which sets the maximum number of retries to infinite. When MaximumRetryAttempts is infinite, Lambda retries failed records until the record expires in the event source.
        TumblingWindowInSeconds:
          allOf:
          - $ref: '#/components/schemas/TumblingWindowInSeconds'
          - description: (Kinesis and DynamoDB Streams only) The duration in seconds of a processing window for DynamoDB and Kinesis Streams event sources. A value of 0 seconds indicates no tumbling window.
        FunctionResponseTypes:
          allOf:
          - $ref: '#/components/schemas/FunctionResponseTypeList'
          - description: (Kinesis, DynamoDB Streams, and Amazon SQS) A list of current response type enums applied to the event source mapping.
        AmazonManagedKafkaEventSourceConfig:
          allOf:
          - $ref: '#/components/schemas/AmazonManagedKafkaEventSourceConfig'
          - description: Specific configuration settings for an Amazon Managed Streaming for Apache Kafka (Amazon MSK) event source.
        SelfManagedKafkaEventSourceConfig:
          allOf:
          - $ref: '#/components/schemas/SelfManagedKafkaEventSourceConfig'
          - description: Specific configuration settings for a self-managed Apache Kafka event source.
        ScalingConfig:
          allOf:
          - $ref: '#/components/schemas/ScalingConfig'
          - description: (Amazon SQS only) The scaling configuration for the event source. For more information, see <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html#events-sqs-max-concurrency">Configuring maximum concurrency for Amazon SQS event sources</a>.
        DocumentDBEventSourceConfig:
          allOf:
          - $ref: '#/components/schemas/DocumentDBEventSourceConfig'
          - description: Specific configuration settings for a DocumentDB event source.
      description: A mapping between an Amazon Web Services resource and a Lambda function. For details, see <a>CreateEventSourceMapping</a>.
    MaximumRecordAgeInSeconds:
      type: integer
      minimum: -1
      maximum: 604800
    FunctionArn:
      type: string
      pattern: arn:(aws[a-zA-Z-]*)?:lambda:[a-z]{2}(-gov)?-[a-z]+-\d{1}:\d{12}:function:[a-zA-Z0-9-_]+(:(\$LATEST|[a-zA-Z0-9-_]+))?
    FunctionResponseType:
      type: string
      enum:
      - ReportBatchItemFailures
    ScalingConfig:
      type: object
      properties:
        MaximumConcurrency:
          allOf:
          - $ref: '#/components/schemas/MaximumConcurrency'
          - description: Limits the number of concurrent instances that the Amazon SQS event source can invoke.
      description: (Amazon SQS only) The scaling configuration for the event source. To remove the configuration, pass an empty value.
    SourceAccessConfigurations:
      type: array
      items:
        $ref: '#/components/schemas/SourceAccessConfiguration'
      minItems: 0
      maxItems: 22
    EventSourcePosition:
      type: string
      enum:
      - TRIM_HORIZON
      - LATEST
      - AT_TIMESTAMP
    Date:
      type: string
      format: date-time
    ServiceException: {}
    AmazonManagedKafkaEventSourceConfig:
      type: object
      properties:
        ConsumerGroupId:
          allOf:
          - $ref: '#/components/schemas/URI'
          - description: The identifier for the Kafka consumer group to join. The consumer group ID must be unique among all your Kafka event sources. After creating a Kafka event source mapping with the consumer group ID specified, you cannot update this value. For more information, see <a href="https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html#services-msk-consumer-group-id">Customizable consumer group ID</a>.
      description: Specific configuration settings for an Amazon Managed Streaming for Apache Kafka (Amazon MSK) event source.
    TumblingWindowInSeconds:
      type: integer
      minimum: 0
      maximum: 900
    SelfManagedEventSource:
      type: object
      properties:
        Endpoints:
          allOf:
          - $ref: '#/components/schemas/Endpoints'
          - description: 'The list of bootstrap servers for your Kafka brokers in the following format: <code>"KAFKA_BOOTSTRAP_SERVERS": ["abc.xyz.com:xxxx","abc2.xyz.com:xxxx"]</code>.'
      description: The self-managed Apache Kafka cluster for your event source.
    DestinationConfig:
      type: object
      properties:
        OnSuccess:
          allOf:
          - $ref: '#/components/schemas/OnSuccess'
          - description: The destination configuration for successful invocations.
        OnFailure:
          allOf:
          - $ref: '#/components/schemas/OnFailure'
          - description: The destination configuration for failed invocations.
      description: A configuration object that specifies the destination of an event after Lambda processes it.
    TooManyRequestsException: {}
    ListEventSourceMappingsResponse:
      type: object
      properties:
        NextMarker:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A pagination token that's returned when the response doesn't contain all event source mappings.
        EventSourceMappings:
          allOf:
          - $ref: '#/components/schemas/EventSourceMappingsList'
          - description: A list of event source mappings.
    MaximumRetryAttemptsEventSourceMapping:
      type: integer
      minimum: -1
      maximum: 10000
    FilterList:
      type: array
      items:
        $ref: '#/components/schemas/Filter'
    EventSourceMappingsList:
      type: array
      items:
        $ref: '#/components/schemas/EventSourceMappingConfiguration'
    FullDocument:
      type: string
      enum:
      - UpdateLookup
      - Default
    Pattern:
      type: string
      pattern: .*
      minLength: 0
      maxLength: 4096
    ResourceNotFoundException: {}
    InvalidParameterValueException: {}
    Endpoints:
      type: object
      minProperties: 1
      maxProperties: 2
      additionalProperties:
        $ref: '#/components/schemas/EndpointLists'
    BatchSize:
      type: integer
      minimum: 1
      maximum: 10000
    Queue:
      type: string
      pattern: '[\s\S]*'
      minLength: 1
      maxLength: 1000
    MaximumBatchingWindowInSeconds:
      type: integer
      minimum: 0
      maximum: 300
    OnSuccess:
      type: object
      properties:
        Destination:
          allOf:
          - $ref: '#/components/schemas/DestinationArn'
          - description: The Amazon Resource Name (ARN) of the destination resource.
      description: A destination for events that were processed successfully.
    Topics:
      type: array
      items:
        $ref: '#/components/schemas/Topic'
      minItems: 1
      maxItems: 1
    DestinationArn:
      type: string
      pattern: ^$|arn:(aws[a-zA-Z0-9-]*):([a-zA-Z0-9\-])+:([a-z]{2}(-gov)?-[a-z]+-\d{1})?:(\d{12})?:(.*)
      minLength: 0
      maxLength: 350
    OnFailure:
      type: object
      properties:
