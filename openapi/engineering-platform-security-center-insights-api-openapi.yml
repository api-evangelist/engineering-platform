tags:
- name: Security Center Insights
paths:
  /accounts/{account_id}/intel/attack-surface-report/{issue_id}/dismiss:
    put:
      operationId: archive-security-center-insight
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/security-center_identifier'
      - in: path
        name: issue_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                dismiss:
                  default: true
                  type: boolean
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/security-center_api-response-common-failure'
          description: Client Error
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/security-center_api-response-single'
          description: OK
      security:
      - api_email: []
        api_key: []
      - api_token: []
      summary: APIs.io Engineering Platform Archive Security Center Insight
      tags:
      - Security Center Insights
  /accounts/{account_id}/intel/attack-surface-report/issue-types:
    get:
