components:
  schemas:
    security-center_count:
      description: Total number of results
      example: 1
      type: integer
    security-center_issueTypes:
      example:
      - compliance_violation
      - email_security
      items:
        $ref: '#/components/schemas/security-center_issueType'
      type: array
    security-center_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    security-center_valueCountsResponse:
      allOf:
      - $ref: '#/components/schemas/security-center_api-response-common'
      - properties:
          result:
            anyOf:
            - items:
                properties:
                  count:
                    example: 1
                    type: integer
                  value:
                    type: string
                type: object
              type: array
    security-center_products:
      example:
      - access
      - dns
      items:
        type: string
      type: array
    security-center_subjects:
      items:
        $ref: '#/components/schemas/security-center_subject'
      type: array
    security-center_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/security-center_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/security-center_messages'
          example: []
        result:
          enum:
          - null
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    security-center_dismissed:
      example: false
      type: boolean
    security-center_issueType:
      enum:
      - compliance_violation
      - email_security
      - exposed_infrastructure
      - insecure_configuration
      - weak_authentication
      type: string
    security-center_perPage:
      description: Number of results per page of results
      example: 25
      maximum: 1000
      minimum: 1
      type: integer
    security-center_issueClasses:
      example:
      - a_record_dangling
      - always_use_https_not_enabled
      items:
        $ref: '#/components/schemas/security-center_issueClass'
      type: array
    security-center_issueClass:
      example: always_use_https_not_enabled
      type: string
    security-center_subject:
      example: example.com
      type: string
    security-center_severityQueryParam:
      example:
      - low
      - moderate
      items:
        enum:
        - low
        - moderate
        - critical
        type: string
      type: array
    security-center_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    security-center_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/security-center_messages'
        messages:
          $ref: '#/components/schemas/security-center_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    security-center_issue:
      properties:
        dismissed:
          example: false
          type: boolean
        id:
          type: string
        issue_class:
          $ref: '#/components/schemas/security-center_issueClass'
        issue_type:
          $ref: '#/components/schemas/security-center_issueType'
        payload:
          type: object
        resolve_link:
          type: string
        resolve_text:
          type: string
        severity:
          enum:
          - Low
          - Moderate
          - Critical
          type: string
        since:
          format: date-time
          type: string
        subject:
          $ref: '#/components/schemas/security-center_subject'
        timestamp:
          format: date-time
          type: string
      type: object
    security-center_page:
      description: Current page within paginated list of results
      example: 1
      type: integer
    security-center_api-response-single:
      allOf:
      - $ref: '#/components/schemas/security-center_api-response-common'
      type: object
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
