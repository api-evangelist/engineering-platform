openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Security Center Insights API
  version: 4.0.0
tags:
- name: Security Center Insights
paths:
  /accounts/{account_id}/intel/attack-surface-report/{issue_id}/dismiss:
    put:
      operationId: archive-security-center-insight
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/security-center_identifier'
      - in: path
        name: issue_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                dismiss:
                  default: true
                  type: boolean
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/security-center_api-response-common-failure'
          description: Client Error
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/security-center_api-response-single'
          description: OK
      security:
      - api_email: []
        api_key: []
      - api_token: []
      summary: APIs.io Engineering Platform Archive Security Center Insight
      tags:
      - Security Center Insights
  /accounts/{account_id}/intel/attack-surface-report/issue-types:
    get:
      operationId: get-security-center-issue-types
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/security-center_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/security-center_api-response-common-failure'
          description: Client Error
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/security-center_api-response-common'
                - properties:
                    result:
                      anyOf:
                      - items:
                          type: string
                        type: array
          description: OK
      security:
      - api_email: []
        api_key: []
      - api_token: []
      summary: APIs.io Engineering Platform Get Security Center Issues Types
      tags:
      - Security Center Insights
  /accounts/{account_id}/intel/attack-surface-report/issues:
    get:
      operationId: get-security-center-issues
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/security-center_identifier'
      - in: query
        name: dismissed
        schema:
          $ref: '#/components/schemas/security-center_dismissed'
      - in: query
        name: issue_class
        schema:
          $ref: '#/components/schemas/security-center_issueClasses'
      - in: query
        name: issue_type
        schema:
          $ref: '#/components/schemas/security-center_issueTypes'
      - in: query
        name: product
        schema:
          $ref: '#/components/schemas/security-center_products'
      - in: query
        name: severity
        schema:
          $ref: '#/components/schemas/security-center_severityQueryParam'
      - in: query
        name: subject
        schema:
          $ref: '#/components/schemas/security-center_subjects'
      - in: query
        name: issue_class~neq
        schema:
          $ref: '#/components/schemas/security-center_issueClasses'
      - in: query
        name: issue_type~neq
        schema:
          $ref: '#/components/schemas/security-center_issueTypes'
      - in: query
        name: product~neq
        schema:
          $ref: '#/components/schemas/security-center_products'
      - in: query
        name: severity~neq
        schema:
          $ref: '#/components/schemas/security-center_severityQueryParam'
      - in: query
        name: subject~neq
        schema:
          $ref: '#/components/schemas/security-center_subjects'
      - in: query
        name: page
        schema:
          allOf:
          - $ref: '#/components/schemas/security-center_page'
          default: 1
      - in: query
        name: per_page
        schema:
          allOf:
          - $ref: '#/components/schemas/security-center_perPage'
          default: 25
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/security-center_api-response-common-failure'
          description: Client Error
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/security-center_api-response-common'
                - properties:
                    result:
                      anyOf:
                      - properties:
                          count:
                            $ref: '#/components/schemas/security-center_count'
                          issues:
                            items:
                              $ref: '#/components/schemas/security-center_issue'
                            type: array
                          page:
                            $ref: '#/components/schemas/security-center_page'
                          per_page:
                            $ref: '#/components/schemas/security-center_perPage'
                        type: object
          description: OK
      security:
      - api_email: []
        api_key: []
      - api_token: []
      summary: APIs.io Engineering Platform Get Security Center Issues
      tags:
      - Security Center Insights
