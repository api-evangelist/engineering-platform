components:
  schemas:
    email-security_MessageDeliveryMode:
      enum:
      - DIRECT
      - BCC
      - JOURNAL
      - REVIEW_SUBMISSION
      - DMARC_UNVERIFIED
      - DMARC_FAILURE_REPORT
      - DMARC_AGGREGATE_REPORT
      - THREAT_INTEL_SUBMISSION
      - SIMULATION_SUBMISSION
      - API
      - RETRO_SCAN
      type: string
    email-security_MessageHeader:
      properties:
        name:
          type: string
        value:
          type: string
      required:
      - name
      - value
      type: object
    email-security_Message:
      properties:
        code:
          format: int32
          minimum: 1000
          type: integer
        message:
          type: string
      required:
      - code
      - message
      type: object
    email-security_ThreatCategory:
      properties:
        description:
          nullable: true
          type: string
        id:
          format: int64
          type: integer
        name:
          nullable: true
          type: string
      required:
      - id
      type: object
    email-security_MailsearchMessage:
      allOf:
      - properties:
          action_log: {}
          alert_id:
            nullable: true
            type: string
          client_recipients:
            items:
              type: string
            type: array
          delivery_mode:
            allOf:
            - $ref: '#/components/schemas/email-security_MessageDeliveryMode'
            - nullable: true
              type: string
          detection_reasons:
            items:
              type: string
            type: array
          edf_hash:
            nullable: true
            type: string
          final_disposition:
            allOf:
            - $ref: '#/components/schemas/email-security_DispositionLabel'
            - nullable: true
              type: string
          from:
            nullable: true
            type: string
          from_name:
            nullable: true
            type: string
          is_phish_submission:
            type: boolean
          is_quarantined:
            type: boolean
          message_id:
            type: string
          postfix_id:
            $ref: '#/components/schemas/email-security_PostfixId'
          sent_date:
            nullable: true
            type: string
          subject:
            nullable: true
            type: string
