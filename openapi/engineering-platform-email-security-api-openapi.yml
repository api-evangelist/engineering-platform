security:
- hmac: []
tags:
- name: Email Security
paths:
  /accounts/{account_id}/email-security/investigate:
    get:
      description: This endpoint returns information for each email that matches the search parameter(s).
      operationId: email_security_investigate
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/email-security_AccountId'
      - description: 'The beginning of the search date range.

          Defaults to `now - 30 days`.'
        example: '2022-07-25T14:30:00Z'
        in: query
        name: start
        schema:
          format: date-time
          type: string
      - description: 'The end of the search date range.

          Defaults to `now`.'
        example: '2022-06-25T14:30:00Z'
        in: query
        name: end
        schema:
          format: date-time
          type: string
      - description: 'Space delimited query term(s).

          The search is case-insensitive.


          The content of the following email metadata fields are searched:

          * alert_id

          * CC

          * From (envelope_from)

          * From Name

          * final_disposition

          * md5 hash (of any attachment)

          * sha1 hash (of any attachment)

          * sha256 hash (of any attachment)

          * name (of any attachment)

          * Reason

          * Received DateTime (yyyy-mm-ddThh:mm:ss)

          * Sent DateTime (yyyy-mm-ddThh:mm:ss)

          * ReplyTo

          * To (envelope_to)

          * To Name

          * Message-ID

          * smtp_helo_server_ip

          * smtp_previous_hop_ip

          * x_originating_ip

          * Subject'
        example: bob jones
        in: query
        name: query
        schema:
          type: string
      - description: If `false`, the search includes non-detections.
        in: query
        name: detections_only
        schema:
          default: true
          type: boolean
      - description: Controls whether the message action log in included in the response.
        in: query
        name: action_log
        schema:
          default: true
          type: boolean
      - description: Filter messages by the provided disposition.
        in: query
        name: final_disposition
        schema:
          allOf:
          - enum:
            - MALICIOUS
            - SUSPICIOUS
            - SPOOF
            - SPAM
            - BULK
            type: string
      - in: query
        name: metric
        schema:
          type: string
      - description: Filter messages by actions applied to them
        in: query
        name: message_action
        schema:
          allOf:
          - enum:
            - PREVIEW
            - QUARANTINE_RELEASED
            - MOVED
            type: string
      - example: me@example.com
        in: query
        name: recipient
        schema:
          type: string
      - example: noreply@example.com
        in: query
        name: sender
        schema:
          type: string
      - example: 4Njp3P0STMz2c02Q-2022-12-30T02:44:49
        in: query
        name: alert_id
        schema:
          type: string
      - description: Filter by the sender domain
        example: example.com
        in: query
        name: domain
        schema:
          type: string
      - example: <4VAZPrAdg7IGNxdt1DWRNu0gvOeL_iZiwP4BQfo4DaE.Yw-woXuugQbeFhBpzwFQtqq_v2v1HOKznoMBqbciQpE@example.com>
        in: query
        name: message_id
        schema:
          type: string
      - description: Page number of paginated results.
        in: query
        name: page
        schema:
          default: 1
          format: int32
          minimum: 1
          type: integer
      - description: Number of results to display.
        in: query
        name: per_page
        schema:
          default: 20
          format: int32
          minimum: 1
          type: integer
      responses:
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_ApiResponseCommon'
                - properties:
                    result:
                      items:
                        $ref: '#/components/schemas/email-security_MailsearchMessage'
                      type: array
                    result_info:
                      $ref: '#/components/schemas/email-security_ResultInfo'
                  required:
                  - result
                  - result_info
                  type: object
          description: Search results for the provided query
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Search email messages
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
  /accounts/{account_id}/email-security/investigate/{postfix_id}:
    get:
      operationId: email_security_get_message
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/email-security_AccountId'
      - in: path
        name: postfix_id
        required: true
        schema:
          description: Message identifier
          example: 4Njp3P0STMz2c02Q
          title: postfix_id
          type: string
      responses:
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_ApiResponseCommon'
                - properties:
                    result:
                      allOf:
                      - properties:
                          action_log: {}
                          alert_id:
                            nullable: true
                            type: string
                          client_recipients:
                            items:
                              type: string
                            type: array
                          delivery_mode:
                            allOf:
                            - $ref: '#/components/schemas/email-security_MessageDeliveryMode'
                            - nullable: true
                              type: string
                          detection_reasons:
                            items:
                              type: string
                            type: array
                          edf_hash:
                            nullable: true
                            type: string
                          final_disposition:
                            allOf:
                            - $ref: '#/components/schemas/email-security_DispositionLabel'
                            - nullable: true
                              type: string
                          from:
                            nullable: true
                            type: string
                          from_name:
                            nullable: true
                            type: string
                          is_phish_submission:
                            type: boolean
                          is_quarantined:
                            type: boolean
                          message_id:
                            type: string
                          postfix_id:
                            $ref: '#/components/schemas/email-security_PostfixId'
                          sent_date:
                            nullable: true
                            type: string
                          subject:
                            nullable: true
                            type: string
                          threat_categories:
                            items:
                              type: string
                            nullable: true
                            type: array
                          to:
                            items:
                              type: string
                            nullable: true
                            type: array
                          to_name:
                            items:
                              type: string
                            nullable: true
                            type: array
                          ts:
                            type: string
                          validation:
                            allOf:
                            - properties:
                                comment:
                                  nullable: true
                                  type: string
                                dkim:
                                  allOf:
                                  - $ref: '#/components/schemas/email-security_ValidationStatus'
                                  - nullable: true
                                    type: string
                                dmarc:
                                  allOf:
                                  - $ref: '#/components/schemas/email-security_ValidationStatus'
                                  - nullable: true
                                    type: string
                                spf:
                                  allOf:
                                  - $ref: '#/components/schemas/email-security_ValidationStatus'
                                  - nullable: true
                                    type: string
                              type: object
                            - nullable: true
                              type: object
                        required:
                        - ts
                        - message_id
                        - client_recipients
                        - postfix_id
                        - detection_reasons
                        - action_log
                        - is_quarantined
                        - is_phish_submission
                        type: object
                      - properties:
                          id:
                            type: string
                        required:
                        - id
                        type: object
                      example:
                        action_log: []
                        alert_id: 4Njp3P0STMz2c02Q-2022-12-30T02:44:49
                        client_recipients:
                        - email@example.com
                        delivery_mode: DIRECT
                        detection_reasons:
                        - 'Selector is a source of spam/uce : Smtp-Helo-Server-Ip=<b>127.0.0[dot]186</b>'
                        edf_hash: null
                        final_disposition: MALICIOUS
                        from: d1994@example.com
                        from_name: Sender Name
                        id: 47JJcT1w6GztQV7-email@example.com
                        is_phish_submission: false
                        is_quarantined: false
                        message_id: <4VAZPrAdg7IGNxdt1DWRNu0gvOeL_iZiwP4BQfo4DaE.Yw-woXuugQbeFhBpzwFQtqq_v2v1HOKznoMBqbciQpE@example.com>
                        postfix_id: 47JJcT1w6GztQV7
                        sent_date: 2019-11-21 00:22:01
                        subject: listen, I highly recommend u to read that email, just to ensure not a thing will take place
                        threat_categories:
                        - IPReputation
                        - ASNReputation
                        to:
                        - email@example.com
                        to_name:
                        - Recipient Name
                        ts: 2019-11-20 23:22:01
                        validation:
                          comment: null
                          dkim: pass
                          dmarc: none
                          spf: fail
                  required:
                  - result
                  type: object
          description: Email message details
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get message details
      tags:
      - Email Security
  /accounts/{account_id}/email-security/investigate/{postfix_id}/detections:
    get:
      description: 'For emails that have a detection, this endpoint returns detection details

        such as threat categories, sender information, and links.'
      operationId: email_security_get_message_detections
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/email-security_AccountId'
      - in: path
        name: postfix_id
        required: true
        schema:
          description: Message identifier
          example: 4Njp3P0STMz2c02Q
          title: postfix_id
          type: string
      responses:
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_ApiResponseCommon'
                - properties:
                    result:
                      example:
                        action: QUARANTINED
                        attachments: []
                        final_disposition: MALICIOUS
                        headers:
                        - name: From
                          value: Sender Name <d1994@example.com>
                        - name: Subject
                          value: listen, I highly recommend u to read that email, just to ensure not a thing will take place
                        links:
                        - href: https://example.com
                          text: Click here!
                        sender_info:
                          as_name: AS0
                          as_number: 0
                          geo: US/-/-
                          ip: 127.0.0.1
                          pld: example.com
                        threat_categories:
                        - description: null
                          id: 1234
                          name: IP Reputation
                        validation:
                          comment: null
                          dkim: pass
                          dmarc: none
                          spf: fail
                      properties:
                        action:
                          type: string
                        attachments:
                          items:
                            $ref: '#/components/schemas/email-security_Attachment'
                          type: array
                        final_disposition:
                          allOf:
                          - $ref: '#/components/schemas/email-security_DispositionLabel'
                          - nullable: true
                            type: string
                        headers:
                          items:
                            $ref: '#/components/schemas/email-security_MessageHeader'
                          type: array
                        links:
                          items:
                            $ref: '#/components/schemas/email-security_Link'
                          type: array
                        sender_info:
                          properties:
                            as_name:
                              description: Name of the autonomous system
                              nullable: true
                              type: string
                            as_number:
                              description: Number of the autonomous system
                              format: int64
                              nullable: true
                              type: integer
                            geo:
                              nullable: true
                              type: string
                            ip:
                              nullable: true
                              type: string
                            pld:
                              nullable: true
                              type: string
                          type: object
                        threat_categories:
                          items:
                            $ref: '#/components/schemas/email-security_ThreatCategory'
                          type: array
                        validation:
                          properties:
                            comment:
                              nullable: true
                              type: string
                            dkim:
                              allOf:
                              - $ref: '#/components/schemas/email-security_ValidationStatus'
                              - nullable: true
                                type: string
                            dmarc:
                              allOf:
                              - $ref: '#/components/schemas/email-security_ValidationStatus'
                              - nullable: true
                                type: string
                            spf:
                              allOf:
                              - $ref: '#/components/schemas/email-security_ValidationStatus'
                              - nullable: true
                                type: string
                          type: object
                      required:
                      - validation
                      - headers
                      - threat_categories
                      - sender_info
                      - links
                      - action
                      - attachments
                      type: object
                  required:
                  - result
                  type: object
          description: Email detection details
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get message detection details
      tags:
      - Email Security
  /accounts/{account_id}/email-security/investigate/{postfix_id}/preview:
    get:
      description: 'For emails that have a detection, this endpoint returns a preview of the

        message body as a base64 encoded PNG image.'
      operationId: email_security_get_message_preview
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/email-security_AccountId'
      - in: path
        name: postfix_id
        required: true
        schema:
          description: Message identifier
          example: 4Njp3P0STMz2c02Q
          title: postfix_id
          type: string
      responses:
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_ApiResponseCommon'
                - properties:
                    result:
                      example:
                        screenshot: 
                      properties:
                        screenshot:
                          description: Base64 encoded PNG image
                          type: string
                      required:
                      - screenshot
                      type: object
                  required:
                  - result
                  type: object
          description: Email preview
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get email preview
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
  /accounts/{account_id}/email-security/investigate/{postfix_id}/raw:
    get:
      description: 'For emails that have a detection, this endpoint returns the raw email

        as an EML file.'
      operationId: email_security_get_message_raw
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/email-security_AccountId'
      - in: path
        name: postfix_id
        required: true
        schema:
          description: Message identifier
          example: 4Njp3P0STMz2c02Q
          title: postfix_id
          type: string
      responses:
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_ApiResponseCommon'
                - properties:
                    result:
                      example:
                        raw: 'MIME-Version: 1.0

                          Content-Type: text/plain; charset="utf-8"


                          From: sender@example.com

                          To: recipient@example.com

                          Subject: Test Email


                          This is a test email.'
                      properties:
                        raw:
                          description: UTF-8 encoded eml file
                          type: string
                      required:
                      - raw
                      type: object
                  required:
                  - result
                  type: object
          description: Raw email content
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get raw email content
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
  /accounts/{account_id}/email-security/investigate/{postfix_id}/trace:
    get:
      operationId: email_security_get_message_trace
      parameters:
      - in: path
        name: account_id
        required: true
