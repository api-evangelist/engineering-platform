                              items:
                                $ref: '#/components/schemas/email-security_TraceLine'
                              nullable: true
                              type: array
                          type: object
                        outbound:
                          properties:
                            lines:
                              items:
                                $ref: '#/components/schemas/email-security_TraceLine'
                              nullable: true
                              type: array
                          type: object
                      required:
                      - inbound
                      - outbound
                      type: object
                  required:
                  - result
                  type: object
          description: Email trace
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get email trace
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
  /accounts/{account_id}/email-security/phishguard/reports:
    get:
      operationId: email_security_get_phishguard_reports
      parameters:
      - in: path
        name: account_id
        required: true
