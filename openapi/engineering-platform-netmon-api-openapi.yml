openapi: 3.2.0
info:
  title: VSOnline Netmon API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: Netmon
paths:
  /internal/Netmon/correlation:
    get:
      tags:
      - Netmon
      parameters:
      - name: macAddress
        in: query
        schema:
          type: string
      - name: correlationKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
                format: byte
            application/json:
              schema:
                type: string
                format: byte
            text/json:
              schema:
                type: string
                format: byte
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get internal netmon correlation
      x-summary-source: derived
      operationId: getInternalNetmonCorrelation
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
