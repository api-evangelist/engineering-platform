      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common'
          description: Failure to get Workers for Platforms namespace.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_namespace-single-response'
          description: Get a Workers for Platforms namespace.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get dispatch namespace
      tags:
      - Workers for Platforms
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.script.read
  /accounts/{account_id}/workers/dispatch/namespaces/{dispatch_namespace}/scripts/{script_name}:
    delete:
      description: Delete a worker from a Workers for Platforms namespace. This call has no response body on a successful delete.
      operationId: namespace-worker-script-delete-worker
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - in: path
        name: dispatch_namespace
        required: true
        schema:
          $ref: '#/components/schemas/workers_dispatch_namespace_name'
      - in: path
        name: script_name
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      - description: If set to true, delete will not be stopped by associated service binding, durable object, or other binding. Any of these associated bindings/durable objects will be deleted along with the script.
        in: query
        name: force
        schema:
          type: boolean
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json: {}
          description: Delete Worker response failure
        '200':
          content:
            application/json: {}
          description: Delete Worker response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete Worker
      tags:
      - Workers for Platforms
      x-api-token-group:
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.script.delete
