                    result:
                      $ref: '#/components/schemas/workers_bindings'
          description: Fetch script bindings (Workers for Platforms)
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get Script Bindings
      tags:
      - Workers for Platforms
      x-cfPermissionsRequired:
        enum:
