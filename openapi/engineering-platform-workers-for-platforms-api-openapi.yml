      - in: path
        name: dispatch_namespace
        required: true
        schema:
          $ref: '#/components/schemas/workers_dispatch_namespace_name'
      - in: path
        name: script_name
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common'
          description: Worker Details Failure (Workers for Platforms)
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_namespace-script-response-single'
          description: Worker Details Response (Workers for Platforms)
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Worker Details
      tags:
      - Workers for Platforms
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.script.read
    put:
      description: 'Upload a worker module to a Workers for Platforms namespace. You can find more about the multipart metadata on our docs: https://developers.cloudflare.com/workers/configuration/multipart-upload-metadata/.'
      operationId: namespace-worker-script-upload-worker-module
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - in: path
        name: dispatch_namespace
        required: true
        schema:
          $ref: '#/components/schemas/workers_dispatch_namespace_name'
      - in: path
        name: script_name
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      requestBody:
        $ref: '#/components/requestBodies/workers_script_upload'
      responses:
        4XX:
          $ref: '#/components/responses/workers_4XX'
        '200':
          $ref: '#/components/responses/workers_200'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Upload Worker Module
      tags:
      - Workers for Platforms
      x-api-token-group:
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.script.create
  /accounts/{account_id}/workers/dispatch/namespaces/{dispatch_namespace}/scripts/{script_name}/bindings:
    get:
      description: Fetch script bindings from a script uploaded to a Workers for Platforms namespace.
      operationId: namespace-worker-get-script-bindings
