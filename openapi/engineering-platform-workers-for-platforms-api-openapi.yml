          description: Failure to delete Workers for Platforms namespace.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_namespace-delete-response'
          description: Delete a Workers for Platforms namespace.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete dispatch namespace
      tags:
      - Workers for Platforms
      x-api-token-group:
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.script.delete
    get:
      description: Get a Workers for Platforms namespace.
      operationId: namespace-worker-get-namespace
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - in: path
        name: dispatch_namespace
        required: true
        schema:
