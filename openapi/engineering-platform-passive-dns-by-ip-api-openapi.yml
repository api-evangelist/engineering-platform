openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Passive DNS by IP API
  version: 4.0.0
tags:
- name: Passive DNS by IP
paths:
  /accounts/{account_id}/intel/dns:
    get:
      operationId: passive-dns-by-ip-get-passive-dns-by-ip
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/intel_identifier'
      - in: query
        name: start_end_params
        schema:
          $ref: '#/components/schemas/intel_start_end_params'
      - in: query
        name: ipv4
        schema:
          type: string
      - in: query
        name: page
        schema:
          description: Requested page within paginated list of results.
          example: 1
          type: number
      - in: query
        name: per_page
        schema:
          description: Maximum number of results requested.
          example: 20
          type: number
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/intel_components-schemas-single_response'
                - $ref: '#/components/schemas/intel_api-response-common-failure'
          description: Get Passive DNS by IP response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/intel_components-schemas-single_response'
          description: Get Passive DNS by IP response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get Passive DNS by IP
      tags:
      - Passive DNS by IP
components:
  schemas:
    intel_passive-dns-by-ip:
      properties:
        count:
          description: Total results returned based on your search parameters.
          example: 1
          type: number
        page:
          description: Current page within paginated list of results.
          example: 1
          type: number
        per_page:
          description: Number of results per page of results.
          example: 20
          type: number
        reverse_records:
          description: Reverse DNS look-ups observed during the time period.
          items:
            properties:
              first_seen:
                description: First seen date of the DNS record during the time period.
                example: '2021-04-01'
                format: date
                type: string
              hostname:
                description: Hostname that the IP was observed resolving to.
              last_seen:
                description: Last seen date of the DNS record during the time period.
                example: '2021-04-30'
                format: date
                type: string
            type: object
          type: array
    intel_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      type: string
    intel_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    intel_api-response-single:
      allOf:
      - $ref: '#/components/schemas/intel_schemas-api-response-common'
      type: object
    intel_components-schemas-single_response:
      allOf:
      - $ref: '#/components/schemas/intel_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/intel_passive-dns-by-ip'
    intel_schemas-api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/intel_messages'
        messages:
          $ref: '#/components/schemas/intel_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    intel_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/intel_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/intel_messages'
          example: []
        result:
          enum:
          - null
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    intel_start_end_params:
      properties:
        end:
          description: Defaults to the current date.
          example: '2021-04-30'
          format: date
          type: string
        start:
          description: Defaults to 30 days before the end parameter value.
          example: '2021-04-01'
          format: date
          type: string
      type: object
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
