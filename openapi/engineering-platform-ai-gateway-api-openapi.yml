paths:
  /accounts/{account_id}/ai-gateway/gateways:
    get:
      operationId: aig-config-list-gateway
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 3ebbcb006d4d46d7bb6a8c7f14676cb0
          type: string
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: per_page
        schema:
          default: 20
          maximum: 100
          minimum: 5
          type: integer
      - description: Order By Column Name
        in: query
        name: order_by
        schema:
          description: Order By Column Name
          type: string
      - description: Order By Direction
        in: query
        name: order_by_direction
        schema:
          default: asc
          description: Order By Direction
          enum:
          - asc
          - desc
          type: string
      - in: query
        name: id
        schema:
          description: gateway id
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    items:
                      properties:
                        cache_invalidate_on_update:
                          type: boolean
                        cache_ttl:
                          minimum: 0
                          nullable: true
                          type: integer
                        collect_logs:
                          type: boolean
                        created_at:
                          format: date-time
                          type: string
                        id:
                          description: gateway id
                          example: my-gateway
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
                          type: string
                        modified_at:
                          format: date-time
                          type: string
                        rate_limiting_interval:
                          minimum: 0
                          nullable: true
                          type: integer
                        rate_limiting_limit:
                          minimum: 0
                          nullable: true
                          type: integer
                        rate_limiting_technique:
                          enum:
                          - fixed
                          - sliding
                          type: string
                      required:
                      - id
                      - rate_limiting_interval
                      - rate_limiting_limit
                      - rate_limiting_technique
                      - collect_logs
                      - cache_ttl
                      - cache_invalidate_on_update
                      - created_at
                      - modified_at
                      type: object
                    type: array
                  success:
                    type: boolean
                required:
                - success
                - result
                type: object
          description: Returns a list of Gateways
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List Gateways
      tags:
      - AI Gateway
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
    post:
      operationId: aig-config-create-gateway
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 3ebbcb006d4d46d7bb6a8c7f14676cb0
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cache_invalidate_on_update:
                  type: boolean
                cache_ttl:
                  minimum: 0
                  nullable: true
                  type: integer
                collect_logs:
                  type: boolean
                id:
                  description: gateway id
                  example: my-gateway
                  maxLength: 64
                  minLength: 1
                  pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
                  type: string
                rate_limiting_interval:
                  minimum: 0
                  nullable: true
                  type: integer
                rate_limiting_limit:
                  minimum: 0
                  nullable: true
                  type: integer
                rate_limiting_technique:
                  enum:
                  - fixed
                  - sliding
                  type: string
              required:
              - id
              - rate_limiting_interval
              - rate_limiting_limit
              - rate_limiting_technique
              - collect_logs
              - cache_ttl
              - cache_invalidate_on_update
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      cache_invalidate_on_update:
                        type: boolean
                      cache_ttl:
                        minimum: 0
                        nullable: true
                        type: integer
                      collect_logs:
                        type: boolean
                      created_at:
                        format: date-time
                        type: string
                      id:
                        description: gateway id
                        example: my-gateway
                        maxLength: 64
                        minLength: 1
                        pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
                        type: string
                      modified_at:
                        format: date-time
                        type: string
                      rate_limiting_interval:
                        minimum: 0
                        nullable: true
                        type: integer
                      rate_limiting_limit:
                        minimum: 0
                        nullable: true
                        type: integer
                      rate_limiting_technique:
                        enum:
                        - fixed
                        - sliding
                        type: string
                    required:
                    - id
                    - rate_limiting_interval
                    - rate_limiting_limit
                    - rate_limiting_technique
                    - collect_logs
                    - cache_ttl
                    - cache_invalidate_on_update
                    - created_at
                    - modified_at
