              schema:
                properties:
                  errors:
                    items:
                      properties:
                        code:
                          example: 7001
                          type: number
                        message:
                          example: Input Validation Error
                          type: string
                        path:
                          items:
                            example: body
                            type: string
                          type: array
                      required:
                      - code
                      - message
                      - path
                      type: object
                    type: array
                  success:
                    type: boolean
                required:
