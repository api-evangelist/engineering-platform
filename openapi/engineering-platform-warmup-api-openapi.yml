openapi: 3.2.0
info:
  title: VSOnline Warmup API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: Warmup
paths:
  /warmup:
    get:
      tags:
      - Warmup
      responses:
        '200':
          description: Success
        '503':
          description: Server Error
      summary: Get warmup
      x-summary-source: derived
      operationId: getWarmup
      x-operation-id-source: derived
components:
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
