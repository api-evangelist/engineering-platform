tags:
- name: Radar Annotations
paths:
  /radar/annotations:
    get:
      operationId: radar-get-annotations
      parameters:
      - description: Limit the number of objects in the response.
        in: query
        name: limit
        schema:
          description: Limit the number of objects in the response.
          example: 5
          type: integer
      - description: Number of objects to skip before grabbing results.
        in: query
        name: offset
        schema:
          description: Number of objects to skip before grabbing results.
          type: integer
      - description: Shorthand date ranges for the last X days - use when you don't need specific start and end dates.
        in: query
        name: dateRange
        schema:
          description: Shorthand date ranges for the last X days - use when you don't need specific start and end dates.
          example: 7d
          pattern: ^((([1-9]|[1-9][0-9]|[1-2][0-9][0-9]|3[0-5][0-9]|36[0-4])[d](control)?)|(([1-9]|[1-4][0-9]|5[0-2])[w](control)?))$
          type: string
      - description: Start of the date range (inclusive).
        in: query
        name: dateStart
        schema:
          description: Start of the date range (inclusive).
          example: '2023-09-01T11:41:33.782Z'
          format: date-time
          type: string
      - description: End of the date range (inclusive).
        in: query
        name: dateEnd
        schema:
          description: End of the date range (inclusive).
          example: '2023-09-01T11:41:33.782Z'
          format: date-time
          type: string
      - description: Single ASN as integer.
        in: query
        name: asn
        schema:
          description: Single ASN as integer.
          example: '174'
          type: integer
      - description: Location Alpha2 code.
        in: query
        name: location
        schema:
          description: Location Alpha2 code.
          example: US
          type: string
      - description: Format results are returned in.
        in: query
        name: format
        schema:
          description: Format results are returned in.
          enum:
          - JSON
          - CSV
          example: json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      annotations:
                        items:
                          properties:
                            asns:
                              items:
                                example: 189
                                type: integer
                              type: array
                            asnsDetails:
                              items:
                                properties:
                                  asn:
                                    example: '189'
                                    type: string
                                  locations:
                                    properties:
                                      code:
                                        example: US
                                        type: string
                                      name:
                                        example: United States
                                        type: string
                                    required:
                                    - code
                                    - name
                                    type: object
                                  name:
                                    example: LUMEN-LEGACY-L3-PARTITION
                                    type: string
                                required:
                                - asn
                                - name
                                type: object
                              type: array
                            dataSource:
                              example: ALL
                              type: string
                            description:
                              example: example
                              type: string
                            endDate:
                              example: '2022-09-08T10:00:28Z'
                              type: string
                            eventType:
                              example: OUTAGE
                              type: string
                            id:
                              example: '550'
                              type: string
                            linkedUrl:
                              example: http://example.com
                              type: string
                            locations:
                              items:
                                example: US
                                type: string
                              type: array
                            locationsDetails:
                              items:
                                properties:
                                  code:
                                    example: US
                                    type: string
                                  name:
                                    example: United States
                                    type: string
                                required:
                                - code
                                - name
                                type: object
                              type: array
                            outage:
                              properties:
                                outageCause:
                                  example: CABLE_CUT
                                  type: string
                                outageType:
                                  example: NATIONWIDE
                                  type: string
                              required:
                              - outageCause
                              - outageType
                              type: object
                            scope:
                              example: Colima, Michoacán, México
                              type: string
                            startDate:
                              example: '2022-09-06T10:00:28Z'
                              type: string
                          required:
                          - id
                          - dataSource
                          - startDate
                          - asns
                          - asnsDetails
                          - locations
                          - locationsDetails
                          - eventType
                          - outage
                          type: object
                        type: array
                    required:
                    - annotations
                    type: object
                  success:
                    example: true
                    type: boolean
                required:
                - result
                - success
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Get latest annotations.
      tags:
      - Radar Annotations
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.user.read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
