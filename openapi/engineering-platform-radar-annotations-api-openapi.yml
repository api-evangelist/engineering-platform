                                        type: string
                                      name:
                                        example: United States
                                        type: string
                                    required:
                                    - code
                                    - name
                                    type: object
                                  name:
                                    example: LUMEN-LEGACY-L3-PARTITION
                                    type: string
                                required:
                                - asn
                                - name
                                type: object
                              type: array
                            dataSource:
                              example: ALL
                              type: string
                            description:
                              example: example
                              type: string
                            endDate:
                              example: '2022-09-08T10:00:28Z'
                              type: string
                            eventType:
                              example: OUTAGE
                              type: string
                            id:
                              example: '550'
                              type: string
                            linkedUrl:
                              example: http://example.com
                              type: string
                            locations:
                              items:
                                example: US
                                type: string
                              type: array
                            locationsDetails:
                              items:
                                properties:
                                  code:
                                    example: US
                                    type: string
                                  name:
                                    example: United States
                                    type: string
                                required:
                                - code
                                - name
                                type: object
                              type: array
                            outage:
                              properties:
                                outageCause:
                                  example: CABLE_CUT
                                  type: string
                                outageType:
                                  example: NATIONWIDE
                                  type: string
                              required:
                              - outageCause
                              - outageType
                              type: object
                            scope:
                              example: Colima, Michoacán, México
                              type: string
                            startDate:
                              example: '2022-09-06T10:00:28Z'
                              type: string
                          required:
                          - id
                          - dataSource
                          - startDate
                          - asns
                          - asnsDetails
                          - locations
                          - locationsDetails
                          - eventType
                          - outage
                          type: object
                        type: array
                    required:
                    - annotations
                    type: object
                  success:
                    example: true
                    type: boolean
                required:
