      - description: Shorthand date ranges for the last X days - use when you don't need specific start and end dates.
        in: query
        name: dateRange
        schema:
          description: Shorthand date ranges for the last X days - use when you don't need specific start and end dates.
          example: 7d
          pattern: ^((([1-9]|[1-9][0-9]|[1-2][0-9][0-9]|3[0-5][0-9]|36[0-4])[d](control)?)|(([1-9]|[1-4][0-9]|5[0-2])[w](control)?))$
          type: string
      - description: Start of the date range (inclusive).
        in: query
        name: dateStart
        schema:
          description: Start of the date range (inclusive).
          example: '2023-09-01T11:41:33.782Z'
          format: date-time
          type: string
      - description: End of the date range (inclusive).
        in: query
        name: dateEnd
        schema:
          description: End of the date range (inclusive).
          example: '2023-09-01T11:41:33.782Z'
          format: date-time
          type: string
      - description: Single ASN as integer.
        in: query
        name: asn
        schema:
          description: Single ASN as integer.
          example: '174'
          type: integer
      - description: Location Alpha2 code.
        in: query
        name: location
        schema:
          description: Location Alpha2 code.
          example: US
          type: string
      - description: Format results are returned in.
        in: query
        name: format
        schema:
          description: Format results are returned in.
          enum:
          - JSON
          - CSV
          example: json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      annotations:
                        items:
                          properties:
                            asns:
                              items:
                                example: 189
                                type: integer
                              type: array
                            asnsDetails:
                              items:
                                properties:
                                  asn:
                                    example: '189'
                                    type: string
                                  locations:
                                    properties:
                                      code:
