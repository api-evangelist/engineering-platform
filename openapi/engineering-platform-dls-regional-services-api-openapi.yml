security:
- hmac: []
tags:
- name: DLS Regional Services
paths:
  /accounts/{account_id}/addressing/regional_hostnames/regions:
    get:
      description: List all Regional Services regions available for use by this account.
      operationId: dls-account-regional-hostnames-account-list-regions
      parameters:
      - $ref: '#/components/parameters/dls_account_id'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/dls_api-response-common-failure'
          description: Failure to list regions
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/dls_api-response-collection'
                - properties:
                    result:
                      items:
                        properties:
                          key:
                            $ref: '#/components/schemas/dls_region_key'
                          label:
                            description: Human-readable text label for the region
                            example: Canada
                            type: string
                        type: object
                      type: array
          description: List regions response
      security:
      - api_email: []
        api_key: []
      - api_token: []
      summary: APIs.io Engineering Platform List Regions
      tags:
      - DLS Regional Services
      x-api-token-group:
      - DNS Read
components:
  schemas:
    dls_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/dls_messages'
        messages:
          $ref: '#/components/schemas/dls_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    dls_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      type: string
    dls_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/dls_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/dls_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    dls_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    dls_api-response-collection:
      allOf:
      - $ref: '#/components/schemas/dls_api-response-common'
      - properties:
          result:
            items: {}
            nullable: true
            type: array
          result_info:
            $ref: '#/components/schemas/dls_result_info'
      type: object
    dls_region_key:
      description: Identifying key for the region
      example: ca
      type: string
    dls_result_info:
      properties:
        count:
          description: Total number of results for the requested service
          example: 1
          type: number
        page:
          description: Current page within paginated list of results
          example: 1
          type: number
        per_page:
          description: Number of results per page of results
          example: 20
          type: number
        total_count:
          description: Total results available without any search parameters
          example: 2000
          type: number
      type: object
  parameters:
    dls_account_id:
      in: path
      name: account_id
      required: true
      schema:
        $ref: '#/components/schemas/dls_identifier'
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/apigateway/
