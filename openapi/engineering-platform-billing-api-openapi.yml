openapi: 3.2.0
info:
  title: Engineering Platform Billing API
  x-refined-note:
  - x-github-plan differs across the merged source definitions and was not carried
  - x-github-release differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Billing across 3 of this provider''s published API definitions: engineering-platform-openapi.json, github-openapi-original.yml, postman-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://online.visualstudio.com
- url: '{protocol}://{hostname}/api/v3'
  variables:
    hostname:
      description: Self-hosted Enterprise Server hostname
      default: HOSTNAME
    protocol:
      description: Self-hosted Enterprise Server protocol
      default: http
- url: https://api.getpostman.com
- url: https://api.eu.postman.com
tags:
- name: Billing
paths:
  /api/v1/Billing/ensure_plan:
    put:
      tags:
      - Billing
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/EnsurePlanBody'
          application/json:
            schema:
              $ref: '#/components/schemas/EnsurePlanBody'
          text/json:
            schema:
              $ref: '#/components/schemas/EnsurePlanBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/EnsurePlanBody'
        required: true
      responses:
        '204':
          description: No Content
        '201':
          description: Created
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server Error
      security:
      - Bearer: []
      summary: Replace api billing ensure plan
      x-summary-source: derived
      operationId: putApiV1BillingEnsurePlan
      x-operation-id-source: derived
    servers:
    - url: https://online.visualstudio.com
  /api/v1/Billing:
    get:
      tags:
      - Billing
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScopedSecretResultBody'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScopedSecretResultBody'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScopedSecretResultBody'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
      summary: Get api billing
      x-summary-source: derived
      operationId: getApiV1Billing
      x-operation-id-source: derived
    servers:
    - url: https://online.visualstudio.com
  /api/v1/GenevaActions/Billing/{environmentId}:
    get:
      tags:
      - Billing
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: startTime
        in: query
        schema:
          type: string
      - name: endTime
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BillSummary'
            application/json:
              schema:
                $ref: '#/components/schemas/BillSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/BillSummary'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
      summary: Get api geneva actions billing by environment id
      x-summary-source: derived
      operationId: getApiV1GenevaActionsBillingByEnvironmentId
      x-operation-id-source: derived
    servers:
    - url: https://online.visualstudio.com
  /api/v1/GenevaActions/Billing/resend:
    post:
      tags:
      - Billing
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ReplayBillRequestBody'
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayBillRequestBody'
          text/json:
            schema:
              $ref: '#/components/schemas/ReplayBillRequestBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ReplayBillRequestBody'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BillSummary'
            application/json:
              schema:
                $ref: '#/components/schemas/BillSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/BillSummary'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
      summary: Create api geneva actions billing resend
      x-summary-source: derived
      operationId: postApiV1GenevaActionsBillingResend
      x-operation-id-source: derived
    servers:
    - url: https://online.visualstudio.com
  /api/v1/GenevaActions/Billing/{environmentId}/state-changes:
    post:
      tags:
      - Billing
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentStateChangeBody'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentStateChangeBody'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentStateChangeBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentStateChangeBody'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/EnvironmentStateChange'
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateChange'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateChange'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
      summary: Create api geneva actions billing by environment id state changes
      x-summary-source: derived
      operationId: postApiV1GenevaActionsBillingByEnvironmentIdStateChanges
      x-operation-id-source: derived
    get:
      tags:
      - Billing
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/EnvironmentStateChange'
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateChange'
            text/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateChange'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
      summary: Get api geneva actions billing by environment id state changes
      x-summary-source: derived
      operationId: getApiV1GenevaActionsBillingByEnvironmentIdStateChanges
      x-operation-id-source: derived
    servers:
    - url: https://online.visualstudio.com
  /enterprises/{enterprise}/settings/billing/advanced-security:
    get:
      summary: APIs.io Engineering Platform Get GitHub Advanced Security active committers for…
      description: 'Gets the GitHub Advanced Security active committers for an enterprise per repository.


        Each distinct user login across all repositories is counted as a single Advanced Security seat, so the `total_advanced_security_committers` is not the sum of active_users for each repository.


        The total number of repositories with committer information is tracked by the `total_count` field.'
      tags:
      - Billing
      operationId: billing/get-github-advanced-security-billing-ghe
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.9/rest/enterprise-admin/billing#get-github-advanced-security-active-committers-for-an-enterprise
      parameters:
      - $ref: '#/components/parameters/enterprise'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/advanced-security-active-committers'
              examples:
                default:
                  $ref: '#/components/examples/advanced-security-active-committers'
        '403':
          $ref: '#/components/responses/code_scanning_forbidden_read'
      x-github:
        githubCloudOnly: true
        enabledForGitHubApps: false
        category: enterprise-admin
        subcategory: billing
    servers:
    - url: '{protocol}://{hostname}/api/v3'
      variables:
        hostname:
          description: Self-hosted Enterprise Server hostname
          default: HOSTNAME
        protocol:
          description: Self-hosted Enterprise Server protocol
          default: http
  /orgs/{org}/settings/billing/advanced-security:
    get:
      summary: APIs.io Engineering Platform Get GitHub Advanced Security active committers for…
      description: 'Gets the GitHub Advanced Security active committers for an organization per repository.


        Each distinct user login across all repositories is counted as a single Advanced Security seat, so the `total_advanced_security_committers` is not the sum of advanced_security_committers for each repository.


        If this organization defers to an enterprise for billing, the `total_advanced_security_committers` returned from the organization API may include some users that are in more than one organization, so they will only consume a single Advanced Security seat at the enterprise level.


        The total number of repositories with committer information is tracked by the `total_count` field.'
      tags:
      - Billing
      operationId: billing/get-github-advanced-security-billing-org
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.9/rest/billing/billing#get-github-advanced-security-active-committers-for-an-organization
      parameters:
      - $ref: '#/components/parameters/org'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/advanced-security-active-committers'
              examples:
                default:
                  $ref: '#/components/examples/advanced-security-active-committers'
        '403':
          $ref: '#/components/responses/code_scanning_forbidden_read'
      x-github:
        githubCloudOnly: true
        enabledForGitHubApps: true
        category: billing
        subcategory: billing
    servers:
    - url: '{protocol}://{hostname}/api/v3'
      variables:
        hostname:
          description: Self-hosted Enterprise Server hostname
          default: HOSTNAME
        protocol:
          description: Self-hosted Enterprise Server protocol
          default: http
  /accounts:
    get:
      summary: APIs.io Engineering Platform Get accounts
      description: Gets Postman billing account details for the given team.
      operationId: getAccounts
      tags:
      - Billing
      responses:
        '200':
          $ref: '#/components/responses/getAccounts'
        '400':
          $ref: '#/components/responses/invoicesNoTeam400Error'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
      security:
      - PostmanApiKey: []
      - scimApiKey: []
    servers:
    - url: https://api.getpostman.com
    - url: https://api.eu.postman.com
  /accounts/{accountId}/invoices:
    get:
      summary: APIs.io Engineering Platform List account invoices
      description: Gets all invoices for a Postman billing account filtered by the status of the invoice.
      operationId: getAccountInvoices
      tags:
      - Billing
      responses:
        '200':
          $ref: '#/components/responses/getAccountInvoices'
        '400':
          $ref: '#/components/responses/invoiceMissingStatus400Error'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/invoicesForbidden403Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
      parameters:
      - $ref: '#/components/parameters/billingAccountId'
      - $ref: '#/components/parameters/billingAccountStatus'
      security:
      - PostmanApiKey: []
      - scimApiKey: []
    servers:
    - url: https://api.getpostman.com
    - url: https://api.eu.postman.com
components:
  schemas:
    EnsurePlanBody:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        location:
          $ref: '#/components/schemas/AzureLocation'
      additionalProperties: false
    BillSummary:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        sessionToken:
          type:
          - string
          - 'null'
        partitionKey:
          type:
          - string
          - 'null'
        environmentId:
          type:
          - string
          - 'null'
        billGenerationTime:
          type: string
          format: date-time
        plan:
          $ref: '#/components/schemas/VsoPlanInfo'
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        usage:
          type:
          - object
          - 'null'
          additionalProperties:
            type: number
            format: double
          deprecated: true
        usageDetail:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EnvironmentUsage'
        location:
          $ref: '#/components/schemas/AzureLocation'
      additionalProperties: false
    StorageUsageDetail:
      type: object
      properties:
        usage:
          type: number
          format: double
        size:
          type: integer
          format: int32
        sizeInKB:
          type: integer
          format: int64
        sku:
          type:
          - string
          - 'null'
      additionalProperties: false
    ComputeUsageDetail:
      type: object
      properties:
        usage:
          type: number
          format: double
        sku:
          type:
          - string
          - 'null'
      additionalProperties: false
    EnvironmentBillingInfo:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        userId:
          type:
          - string
          - 'null'
        sku:
          $ref: '#/components/schemas/Sku'
      additionalProperties: false
    CloudEnvironmentState:
      enum:
      - 0 (None)
      - 1 (Created)
      - 2 (Queued)
      - 3 (Provisioning)
      - 4 (Available)
      - 5 (Awaiting)
      - 6 (Unavailable)
      - 7 (Deleted)
      - 8 (Moved)
      - 9 (Shutdown)
      - 10 (Archived)
      - 11 (Starting)
      - 12 (ShuttingDown)
      - 13 (Failed)
      - 14 (Exporting)
      - 15 (Updating)
      - 16 (Rebuilding)
      type: integer
      format: int32
    SecretFilterType:
      enum:
      - 0 (None)
      - 1 (GitRepo)
      - 2 (CodespaceName)
      type: integer
      format: int32
    Sku:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        tier:
          type:
          - string
          - 'null'
      additionalProperties: false
    SecretFilterBody:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SecretFilterType'
        value:
          maxLength: 200
          minLength: 1
          type:
          - string
          - 'null'
      additionalProperties: false
    ScopedSecretResultBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastModified:
          type: string
          format: date-time
        scope:
          $ref: '#/components/schemas/SecretScope'
        secretName:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/SecretType'
        notes:
          type:
          - string
          - 'null'
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SecretFilterBody'
      additionalProperties: false
    AzureLocation:
      enum:
      - 0 (None)
      - 101 (EastAsia)
      - 102 (SouthEastAsia)
      - 201 (AustraliaCentral)
      - 202 (AustraliaCentral2)
      - 203 (AustraliaEast)
      - 205 (AustraliaSouthEast)
      - 301 (BrazilSouth)
      - 401 (CanadaCentral)
      - 402 (CanadaEast)
      - 501 (NorthEurope)
      - 502 (WestEurope)
      - 601 (FranceCentral)
      - 602 (FranceSouth)
      - 701 (CentralIndia)
      - 702 (SouthIndia)
      - 703 (WestIndia)
      - 801 (JapanEast)
      - 802 (JapanWest)
      - 901 (KoreaCentral)
      - 902 (KoreaSouth)
      - 1001 (SouthAfricaNorth)
      - 1002 (SouthAfricaWest)
      - 1201 (UaeCentral)
      - 1202 (UaeNorth)
      - 1401 (UkSouth)
      - 1402 (UkWest)
      - 1501 (CentralUs)
      - 1502 (EastUs)
      - 1503 (EastUs2)
      - 1504 (NorthCentralUs)
      - 1505 (SouthCentralUs)
      - 1506 (WestCentralUs)
      - 1507 (WestUs)
      - 1508 (WestUs2)
      - 1509 (WestUs3)
      - 1601 (CentralUsEuap)
      - 1602 (EastUs2Euap)
      - 1701 (SwitzerlandNorth)
      - 1702 (SwitzerlandWest)
      - 1801 (GermanyNorth)
      - 1802 (GermanyWestCentral)
      - 1901 (NorwayWest)
      - 1902 (NorwayEast)
      type: integer
      format: int32
    SecretType:
      enum:
      - 0 (None)
      - 1 (EnvironmentVariable)
      - 2 (ContainerRegistry)
      - 3 (HostSetupEnvironmentVariable)
      type: integer
      format: int32
    EnvironmentStateChange:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        sessionToken:
          type:
          - string
          - 'null'
        partitionKey:
          type:
          - string
          - 'null'
        time:
          type: string
          format: date-time
        environment:
          $ref: '#/components/schemas/EnvironmentBillingInfo'
        oldValue:
          $ref: '#/components/schemas/CloudEnvironmentState'
        newValue:
          $ref: '#/components/schemas/CloudEnvironmentState'
      additionalProperties: false
    EnvironmentUsage:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        endState:
          $ref: '#/components/schemas/CloudEnvironmentState'
        resourceUsage:
          $ref: '#/components/schemas/ResourceUsageDetail'
        sku:
          $ref: '#/components/schemas/Sku'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ResourceUsageDetail:
      type: object
      properties:
        compute:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ComputeUsageDetail'
        storage:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StorageUsageDetail'
      additionalProperties: false
    ReplayBillRequestBody:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      additionalProperties: false
    VsoPlanInfo:
      type: object
      properties:
        subscription:
          type:
          - string
          - 'null'
        resourceGroup:
          type:
          - string
          - 'null'
        providerNamespace:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        location:
          $ref: '#/components/schemas/AzureLocation'
        resourceId:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
    SecretScope:
      enum:
      - 0 (None)
      - 1 (Plan)
      - 2 (User)
      type: integer
      format: int32
    CreateEnvironmentStateChangeBody:
      type: object
      properties:
        time:
          type:
          - string
          - 'null'
          format: date-time
        oldValue:
          $ref: '#/components/schemas/CloudEnvironmentState'
        newValue:
          $ref: '#/components/schemas/CloudEnvironmentState'
      additionalProperties: false
    basic-error:
      title: Basic Error
      description: Basic Error
      type: object
      properties:
        message:
          type: string
        documentation_url:
          type: string
        url:
          type: string
        status:
          type: string
    advanced-security-active-committers-repository:
      type: object
      properties:
        name:
          type: string
          example: octocat/Hello-World
        advanced_security_committers:
          type: integer
          example: 25
        advanced_security_committers_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/advanced-security-active-committers-user'
      required:
      - name
      - advanced_security_committers
      - advanced_security_committers_breakdown
    advanced-security-active-committers-user:
      type: object
      properties:
        user_login:
          type: string
        last_pushed_date:
          type: string
          example: '2021-11-03'
      required:
      - user_login
      - last_pushed_date
    advanced-security-active-committers:
      type: object
      properties:
        total_advanced_security_committers:
          type: integer
          example: 25
        total_count:
          type: integer
          example: 2
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/advanced-security-active-committers-repository'
      required:
      - repositories
    invoiceData:
      title: Account Invoice
      type: object
      description: Information about the invoice.
      properties:
        id:
          type: string
          description: The invoice's ID.
          example: inv_7UDSYBJPGQU93N7M
        status:
          type: string
          description: The invoice's status.
          example: PAID
        issuedAt:
          type: string
          format: date
          description: The date on which the invoice was issued.
          example: '2023-10-12'
        totalAmount:
          type: object
          description: Information about the invoice's total billed amount.
          properties:
            value:
              type: integer
              description: The amount billed.
              example: 440
            currency:
              type: string
              description: The currency of the billed amount. Currently only supports the `USD` value.
              example: USD
        links:
          type: object
