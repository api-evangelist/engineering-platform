openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Access Tags API
  version: 4.0.0
tags:
- name: Access Tags
paths:
  /accounts/{account_id}/access/tags:
    get:
      description: List tags
      operationId: access-tags-list-tags
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: List tags response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_tags_components-schemas-response_collection'
          description: List tags response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List tags
      tags:
      - Access Tags
      x-api-token-group:
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
    post:
      description: Create a tag
      operationId: access-tags-create-tag
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_tags_components-schemas-name'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Create a tag response failure
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_tags_components-schemas-single_response'
          description: Create a tag response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create a tag
      tags:
      - Access Tags
      x-api-token-group:
      - 'Access: Apps and Policies Write'
  /accounts/{account_id}/access/tags/{tag_name}:
    delete:
      description: Delete a tag
      operationId: access-tags-delete-a-tag
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - in: path
        name: tag_name
        required: true
        schema:
          $ref: '#/components/schemas/access_tags_components-schemas-name'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Delete a tag response failure
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_name_response'
          description: Delete a tag response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete a tag
      tags:
      - Access Tags
      x-api-token-group:
      - 'Access: Apps and Policies Write'
    get:
      description: Get a tag
      operationId: access-tags-get-a-tag
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - in: path
        name: tag_name
        required: true
        schema:
          $ref: '#/components/schemas/access_tags_components-schemas-name'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Get a tag response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_tags_components-schemas-single_response'
          description: Get a tag response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get a tag
      tags:
      - Access Tags
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
    put:
      description: Update a tag
      operationId: access-tags-update-a-tag
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - in: path
        name: tag_name
        required: true
        schema:
          $ref: '#/components/schemas/access_tags_components-schemas-name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_tag_without_app_count'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Update a tag response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_tags_components-schemas-single_response'
          description: Update a tag response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update a tag
      tags:
      - Access Tags
      x-api-token-group:
      - 'Access: Apps and Policies Write'
components:
  schemas:
    access_result_info:
      properties:
        count:
          description: Total number of results for the requested service
          example: 1
          type: number
        page:
          description: Current page within paginated list of results
          example: 1
          type: number
        per_page:
          description: Number of results per page of results
          example: 20
          type: number
        total_count:
          description: Total results available without any search parameters
          example: 2000
          type: number
      type: object
    access_tags_components-schemas-name:
      description: The name of the tag
      example: engineers
      type: string
    access_tags_components-schemas-response_collection:
      allOf:
      - $ref: '#/components/schemas/access_api-response-collection'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/access_tag'
            type: array
        type: object
    access_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/access_messages'
        messages:
          $ref: '#/components/schemas/access_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    access_timestamp:
      example: '2014-01-01T05:20:00.12345Z'
      format: date-time
      type: string
    access_api-response-collection:
      allOf:
      - $ref: '#/components/schemas/access_api-response-common'
      - properties:
          result_info:
            $ref: '#/components/schemas/access_result_info'
      type: object
    access_name_response:
      allOf:
      - $ref: '#/components/schemas/access_api-response-single'
      - properties:
          result:
            properties:
              name:
                $ref: '#/components/schemas/access_tags_components-schemas-name'
            type: object
        type: object
    access_tag_without_app_count:
      description: A tag
      properties:
        created_at:
          $ref: '#/components/schemas/access_timestamp'
        name:
          $ref: '#/components/schemas/access_tags_components-schemas-name'
        updated_at:
          $ref: '#/components/schemas/access_timestamp'
      required:
      - name
      type: object
    access_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    access_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/access_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/access_messages'
          example: []
        result:
          enum:
          - null
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    access_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    access_tags_components-schemas-single_response:
      allOf:
      - $ref: '#/components/schemas/access_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/access_tag'
        type: object
    access_api-response-single:
      allOf:
      - $ref: '#/components/schemas/access_api-response-common'
      type: object
    access_tag:
      description: A tag
      properties:
        app_count:
          description: The number of applications that have this tag
          example: 1
          type: integer
        created_at:
          $ref: '#/components/schemas/access_timestamp'
        name:
          $ref: '#/components/schemas/access_tags_components-schemas-name'
        updated_at:
          $ref: '#/components/schemas/access_timestamp'
      required:
      - name
      type: object
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
