          minLength: 20
          maxLength: 2048
      - name: ServiceNamespaces
        in: query
        required: true
        description: '<p>The service namespace for the Amazon Web Services services whose policies you want to list.</p> <p>To learn the service namespace for a service, see <a href="https://docs.aws.amazon.com/service-authorization/latest/reference/reference_policies_actions-resources-contextkeys.html">Actions, resources, and condition keys for Amazon Web Services services</a> in the <i>IAM User Guide</i>. Choose the name of the service to view details for that service. In the first paragraph, find the service prefix. For example, <code>(service prefix: a4b)</code>. For more information about service namespaces, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html#genref-aws-service-namespaces">Amazon Web Services service namespaces</a> in theÂ <i>Amazon Web Services General Reference</i>.</p>'
        schema:
          type: array
          items:
            $ref: '#/components/schemas/serviceNamespaceType'
          minItems: 1
          maxItems: 200
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - ListPoliciesGrantingServiceAccess
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - 2010-05-08
      tags:
      - '#Action=ListPoliciesGrantingServiceAccess'
