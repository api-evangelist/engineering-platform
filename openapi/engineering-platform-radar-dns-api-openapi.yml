                              - endTime
                              type: object
                            type: array
                        required:
                        - dateRange
                        type: object
                      top_0:
                        items:
                          properties:
                            clientCountryAlpha2:
                              example: PT
                              type: string
                            clientCountryName:
                              example: Portugal
                              type: string
