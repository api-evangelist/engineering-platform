openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Pages Project API
  version: 4.0.0
tags:
- name: Pages Project
paths:
  /accounts/{account_id}/pages/projects:
    get:
      description: Fetch a list of all user projects.
      operationId: pages-project-get-projects
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_projects-response'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Get projects response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_projects-response'
          description: Get projects response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get projects
      tags:
      - Pages Project
    post:
      description: Create a new project.
      operationId: pages-project-create-project
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pages_project-object'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_project-response'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Create project response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_project-response'
          description: Create project response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create project
      tags:
      - Pages Project
  /accounts/{account_id}/pages/projects/{project_name}:
    delete:
      description: Delete a project by name.
      operationId: pages-project-delete-project
      parameters:
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - example:
                    errors: []
                    messages: []
                    result: null
                    success: true
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Delete project response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_api-response-common'
                - properties:
                    result:
                      type:
                      - object
                      - 'null'
                  type: object
          description: Delete project response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete project
      tags:
      - Pages Project
    get:
      description: Fetch a project by name.
      operationId: pages-project-get-project
      parameters:
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_project-response'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Get project response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_project-response'
          description: Get project response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get project
      tags:
      - Pages Project
    patch:
      description: Set new attributes for an existing project. Modify environment variables. To delete an environment variable, set the key to null.
      operationId: pages-project-update-project
      parameters:
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pages_project-patch'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_project-response'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Update project response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_project-response'
          description: Update project response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update project
      tags:
      - Pages Project
components:
  schemas:
    pages_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      type: string
    pages_stage:
      description: The status of the deployment.
      properties:
        ended_on:
          description: When the stage ended.
          example: 2021-03-09 00:58:59.045655
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        name:
          description: The current build stage.
          example: deploy
          pattern: queued|initialize|clone_repo|build|deploy
          type: string
        started_on:
          description: When the stage started.
          example: '2021-03-09T00:55:03.923456Z'
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        status:
          description: State of the current stage.
          example: success
          pattern: success|idle|active|failure|canceled
          readOnly: true
          type: string
      readOnly: true
      type: object
    pages_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    pages_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/pages_messages'
        messages:
          $ref: '#/components/schemas/pages_messages'
        success:
          description: Whether the API call was successful
          enum:
          - false
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    pages_build_config:
      description: Configs for the project build process.
      properties:
        build_caching:
          description: Enable build caching for the project.
          example: true
          type:
          - boolean
          - 'null'
        build_command:
          description: Command used to build project.
          example: npm run build
          type:
          - string
          - 'null'
        destination_dir:
          description: Output directory of the build.
          example: build
          type:
          - string
          - 'null'
        root_dir:
          description: Directory to run the command.
          example: /
          type:
          - string
          - 'null'
        web_analytics_tag:
          description: The classifying tag for analytics.
          example: cee1c73f6e4743d0b5e6bb1a0bcaabcc
          type:
          - string
          - 'null'
        web_analytics_token:
          description: The auth token for analytics.
          example: 021e1057c18547eca7b79f2516f06o7x
          type:
          - string
          - 'null'
      type: object
    pages_deployment_configs:
      description: Configs for deployments in a project.
      properties:
        preview:
          anyOf:
          - $ref: '#/components/schemas/pages_deployment_configs_values'
          description: Configs for preview deploys.
          type: object
        production:
          anyOf:
          - $ref: '#/components/schemas/pages_deployment_configs_values'
          description: Configs for production deploys.
          type: object
      type: object
    pages_project-object:
      properties:
        build_config:
          $ref: '#/components/schemas/pages_build_config'
        canonical_deployment:
          allOf:
          - $ref: '#/components/schemas/pages_deployments'
          - description: Most recent deployment to the repo.
            readOnly: true
            type:
            - object
            - 'null'
        created_on:
          description: When the project was created.
          example: '2017-01-01T00:00:00Z'
          format: date-time
          readOnly: true
          type: string
        deployment_configs:
          $ref: '#/components/schemas/pages_deployment_configs'
        domains:
          description: A list of associated custom domains for the project.
          example:
          - customdomain.com
          - customdomain.org
          items:
            type: string
          readOnly: true
          type: array
        id:
          description: Id of the project.
          example: 7b162ea7-7367-4d67-bcde-1160995d5
          readOnly: true
          type: string
        latest_deployment:
          allOf:
          - $ref: '#/components/schemas/pages_deployments'
          - description: Most recent deployment to the repo.
            readOnly: true
            type:
            - object
            - 'null'
        name:
          description: Name of the project.
          example: NextJS Blog
          type: string
        production_branch:
          description: Production branch of the project. Used to identify production deployments.
          example: main
          type: string
        source:
          $ref: '#/components/schemas/pages_source'
        subdomain:
          description: The Cloudflare subdomain associated with the project.
          example: helloworld.pages.dev
          readOnly: true
          type: string
      type: object
    pages_projects-response:
      allOf:
      - $ref: '#/components/schemas/pages_api-response-common'
      - $ref: '#/components/schemas/pages_api-response-pagination'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/pages_deployments'
            type: array
    pages_project-patch:
      allOf:
      - $ref: '#/components/schemas/pages_project-object'
      - example:
          deployment_configs:
            production:
              compatibility_date: '2022-01-01'
              compatibility_flags:
              - url_standard
              env_vars:
                BUILD_VERSION:
                  value: '3.3'
                delete_this_env_var: null
                secret_var:
                  type: secret_text
                  value: A_CMS_API_TOKEN
        type: object
    pages_api-response-pagination:
      properties:
        result_info:
          properties:
            count:
              description: The number of items on the current page.
              example: 1
              type: integer
            page:
              description: The page currently being requested.
              example: 1
              type: integer
            per_page:
              description: The number of items per page being returned.
              example: 100
              type: integer
            total_count:
              description: The total count of items.
              example: 1
              type: integer
            total_pages:
              description: The total count of pages.
              example: 1
              type: integer
          required:
          - page
          - per_page
          - count
          - total_count
          type: object
      type: object
    pages_project_name:
      description: Name of the project.
      example: this-is-my-project-01
      pattern: ^[a-z0-9][a-z0-9-]*$
      type: string
    pages_deployments:
      properties:
        aliases:
          description: A list of alias URLs pointing to this deployment.
          example:
          - https://branchname.projectname.pages.dev
          items:
            type: string
          readOnly: true
          type:
          - array
          - 'null'
        build_config:
          $ref: '#/components/schemas/pages_build_config'
        created_on:
          description: When the deployment was created.
          example: '2021-03-09T00:55:03.923456Z'
          format: date-time
          readOnly: true
          type: string
        deployment_trigger:
          description: Info about what caused the deployment.
          properties:
            metadata:
              description: Additional info about the trigger.
              properties:
                branch:
                  description: Where the trigger happened.
                  example: main
                  readOnly: true
                  type: string
                commit_hash:
                  description: Hash of the deployment trigger commit.
                  example: ad9ccd918a81025731e10e40267e11273a263421
                  readOnly: true
                  type: string
                commit_message:
                  description: Message of the deployment trigger commit.
                  example: Update index.html
                  readOnly: true
                  type: string
              type: object
            type:
              description: What caused the deployment.
              example: ad_hoc
              pattern: push|ad_hoc
              readOnly: true
              type: string
          readOnly: true
          type: object
        env_vars:
          additionalProperties:
            description: Environment variable.
            properties:
              type:
                description: The type of environment variable.
                type: string
              value:
                description: Environment variable value.
                type: string
            required:
            - value
            type:
            - object
            - 'null'
          description: A dict of env variables to build this deploy.
          example:
            BUILD_VERSION:
              value: '3.3'
            ENV:
              value: STAGING
          readOnly: true
          type: object
        environment:
          description: Type of deploy.
          example: preview
          pattern: preview|production
          readOnly: true
          type: string
        id:
          description: Id of the deployment.
          example: f64788e9-fccd-4d4a-a28a-cb84f88f6
          readOnly: true
          type: string
        is_skipped:
          description: If the deployment has been skipped.
          example: true
          readOnly: true
          type: boolean
        latest_stage:
          $ref: '#/components/schemas/pages_stage'
        modified_on:
          description: When the deployment was last modified.
          example: 2021-03-09 00:58:59.045655
          format: date-time
          readOnly: true
          type: string
        project_id:
          description: Id of the project.
          example: 7b162ea7-7367-4d67-bcde-1160995d5
          readOnly: true
          type: string
        project_name:
          description: Name of the project.
          example: ninjakittens
          readOnly: true
          type: string
        short_id:
          description: Short Id (8 character) of the deployment.
          example: f64788e9
          readOnly: true
          type: string
        source:
          $ref: '#/components/schemas/pages_source'
        stages:
          description: List of past stages.
          example:
          - ended_on: '2021-06-03T15:39:03.134378Z'
            name: queued
            started_on: '2021-06-03T15:38:15.608194Z'
            status: active
          - ended_on: null
            name: initialize
            started_on: null
            status: idle
          - ended_on: null
            name: clone_repo
            started_on: null
            status: idle
          - ended_on: null
            name: build
            started_on: null
            status: idle
          - ended_on: null
            name: deploy
            started_on: null
            status: idle
          items:
            $ref: '#/components/schemas/pages_stage'
          readOnly: true
          type: array
        url:
          description: The live URL to view this deployment.
          example: https://f64788e9.ninjakittens.pages.dev
          readOnly: true
          type: string
      type: object
    pages_deployment_configs_values:
      properties:
        ai_bindings:
          additionalProperties:
            description: AI binding.
            properties:
              project_id:
                type: string
            type:
            - object
            - 'null'
          description: Constellation bindings used for Pages Functions.
          example:
            AI_BINDING:
              project_id: some-project-id
          type:
          - object
          - 'null'
        analytics_engine_datasets:
          additionalProperties:
            description: Analytics Engine binding.
            properties:
              dataset:
                description: Name of the dataset.
                example: api_analytics
                type: string
            type:
            - object
            - 'null'
          description: Analytics Engine bindings used for Pages Functions.
          example:
            ANALYTICS_ENGINE_BINDING:
              dataset: api_analytics
          type:
          - object
          - 'null'
        browsers:
          additionalProperties:
            description: Browser binding.
            type:
            - object
            - 'null'
          description: Browser bindings used for Pages Functions.
          example:
            BROWSER: {}
          type:
          - object
          - 'null'
        compatibility_date:
          description: Compatibility date used for Pages Functions.
          example: '2022-01-01'
          type: string
        compatibility_flags:
          description: Compatibility flags used for Pages Functions.
          example:
          - url_standard
          items:
            type: string
          type: array
        d1_databases:
          additionalProperties:
            description: D1 binding.
            properties:
              id:
                description: UUID of the D1 database.
                example: 445e2955-951a-43f8-a35b-a4d0c8138f63
                type: string
            type:
            - object
            - 'null'
          description: D1 databases used for Pages Functions.
          example:
            D1_BINDING:
              id: 445e2955-951a-43f8-a35b-a4d0c8138f63
          type:
          - object
          - 'null'
        durable_object_namespaces:
          additionalProperties:
            description: Durabble Object binding.
            properties:
              namespace_id:
                description: ID of the Durabble Object namespace.
                example: 5eb63bbbe01eeed093cb22bb8f5acdc3
                type: string
            type:
            - object
            - 'null'
          description: Durabble Object namespaces used for Pages Functions.
          example:
            DO_BINDING:
              namespace_id: 5eb63bbbe01eeed093cb22bb8f5acdc3
          type:
          - object
          - 'null'
        env_vars:
          additionalProperties:
            description: Environment variable.
            example:
              type: plain_text
              value: hello world
            properties:
              type:
                description: The type of environment variable.
                enum:
                - plain_text
                - secret_text
                type: string
              value:
                description: Environment variable value.
                type: string
            required:
            - value
            type:
            - object
            - 'null'
          description: Environment variables for build configs.
          type:
          - object
          - 'null'
        hyperdrive_bindings:
          additionalProperties:
            description: Hyperdrive binding.
            properties:
              id:
                example: a76a99bc342644deb02c38d66082262a
                type: string
            type:
            - object
            - 'null'
          description: Hyperdrive bindings used for Pages Functions.
          example:
            HYPERDRIVE:
              id: a76a99bc342644deb02c38d66082262a
          type:
          - object
          - 'null'
        kv_namespaces:
          additionalProperties:
            description: KV namespace binding.
            properties:
              namespace_id:
                description: ID of the KV namespace.
                example: 5eb63bbbe01eeed093cb22bb8f5acdc3
                type: string
            type:
            - object
            - 'null'
          description: KV namespaces used for Pages Functions.
          example:
            KV_BINDING:
              namespace_id: 5eb63bbbe01eeed093cb22bb8f5acdc3
          type:
          - object
          - 'null'
        mtls_certificates:
          additionalProperties:
            description: mTLS binding.
            properties:
              certificate_id:
                example: d7cdd17c-916f-4cb7-aabe-585eb382ec4e
                type: string
            type:
            - object
            - 'null'
          description: mTLS bindings used for Pages Functions.
          example:
            MTLS:
              certificate_id: d7cdd17c-916f-4cb7-aabe-585eb382ec4e
          type:
          - object
          - 'null'
        placement:
          description: Placement setting used for Pages Functions.
          example:
            mode: smart
          properties:
            mode:
              description: Placement mode.
              example: smart
              type: string
          type:
          - object
          - 'null'
        queue_producers:
          additionalProperties:
            description: Queue Producer binding.
            properties:
              name:
                description: Name of the Queue.
                example: some-queue
                type: string
            type:
            - object
            - 'null'
          description: Queue Producer bindings used for Pages Functions.
          example:
            QUEUE_PRODUCER_BINDING:
              name: some-queue
          type:
          - object
          - 'null'
        r2_buckets:
          additionalProperties:
            description: R2 binding.
            properties:
              jurisdiction:
                description: Jurisdiction of the R2 bucket.
                example: eu
                type:
                - string
                - 'null'
              name:
                description: Name of the R2 bucket.
                example: some-bucket
                type: string
            type:
            - object
            - 'null'
          description: R2 buckets used for Pages Functions.
          example:
            R2_BINDING:
              name: some-bucket
          type:
          - object
          - 'null'
        services:
          additionalProperties:
            description: Service binding.
            properties:
              entrypoint:
                description: The entrypoint to bind to.
                type:
                - string
                - 'null'
              environment:
                description: The Service environment.
                type: string
              service:
                description: The Service name.
                type: string
            type:
            - object
            - 'null'
          description: Services used for Pages Functions.
          example:
            SERVICE_BINDING:
              entrypoint: MyHandler
              environment: production
              service: example-worker
          type:
          - object
          - 'null'
        vectorize_bindings:
          additionalProperties:
            description: Vectorize binding.
            properties:
              index_name:
                example: my_index
                type: string
            type:
            - object
            - 'null'
          description: Vectorize bindings used for Pages Functions.
          example:
            VECTORIZE:
              index_name: my_index
          type:
          - object
          - 'null'
      type: object
    pages_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/pages_messages'
          example:
          - code: 7003
            message: No route for the URI.
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/pages_messages'
          example: []
        result:
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful.
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    pages_source:
      properties:
        config:
          properties:
            deployments_enabled:
              type: boolean
            owner:
              type: string
            path_excludes:
              items:
                type: string
              type: array
            path_includes:
              items:
                type: string
              type: array
            pr_comments_enabled:
              type: boolean
            preview_branch_excludes:
              items:
                type: string
              type: array
            preview_branch_includes:
              items:
                type: string
              type: array
            preview_deployment_setting:
              enum:
              - all
              - none
              - custom
              type: string
            production_branch:
              type: string
            production_deployments_enabled:
              type: boolean
            repo_name:
              type: string
          type: object
        type:
          type: string
      readOnly: true
      type: object
    pages_project-response:
      allOf:
      - $ref: '#/components/schemas/pages_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/pages_project-object'
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
