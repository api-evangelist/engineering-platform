                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_permissions_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_permissions_response'
          description: Get indicator feed metadata
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Grant permission to indicator feed
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator-feeds/permissions/remove:
    put:
      operationId: custom-indicator-feeds-remove-permission
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/custom-indicator-feeds_permissions_request'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_permissions_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_permissions_response'
          description: Get indicator feed metadata
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Revoke permission to indicator feed
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator-feeds/permissions/view:
    get:
      operationId: custom-indicator-feeds-view-permissions
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_permission_list_item_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_permission_list_item_response'
          description: Get indicator feed metadata
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List indicator feed permissions
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator_feeds/{feed_id}/download:
    get:
      operationId: custom-indicator-feeds-download-indicator-feed-data
      parameters:
      - in: path
        name: account_id
        required: true
