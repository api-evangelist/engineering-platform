tags:
- name: Custom Indicator Feeds
paths:
  /accounts/{account_id}/intel/indicator-feeds:
    get:
      operationId: custom-indicator-feeds-get-indicator-feeds
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_indicator_feed_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_indicator_feed_response'
          description: Get indicator feeds response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get indicator feeds owned by this account
      tags:
      - Custom Indicator Feeds
      x-api-token-group:
      - Intel Read
    post:
      operationId: custom-indicator-feeds-create-indicator-feeds
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/custom-indicator-feeds_create_feed'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_create_feed_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds failure response
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_create_feed_response'
          description: Create indicator feed response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create new indicator feed
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator-feeds/{feed_id}:
    get:
      operationId: custom-indicator-feeds-get-indicator-feed-metadata
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      - in: path
        name: feed_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_feed_id'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_indicator_feed_metadata_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_indicator_feed_metadata_response'
          description: Get indicator feed metadata
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get indicator feed metadata
      tags:
      - Custom Indicator Feeds
    put:
      operationId: custom-indicator-feeds-update-indicator-feed-metadata
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      - in: path
        name: feed_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_feed_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/custom-indicator-feeds_update_public_field_request'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_update_public_field_response'
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get update public field response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_update_public_field_response'
          description: Get update public field response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update indicator feed metadata
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator-feeds/{feed_id}/data:
    get:
      operationId: custom-indicator-feeds-get-indicator-feed-data
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      - in: path
        name: feed_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_feed_id'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: Get indicator feed metadata
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get indicator feed data
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator-feeds/{feed_id}/snapshot:
    put:
      operationId: custom-indicator-feeds-update-indicator-feed-data
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_identifier'
      - in: path
        name: feed_id
        required: true
        schema:
          $ref: '#/components/schemas/custom-indicator-feeds_feed_id'
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                source:
                  description: The file to upload
                  example: '@/Users/me/test.stix2'
                  type: string
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/custom-indicator-feeds_api_response_common_failure'
          description: Get indicator feeds response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-indicator-feeds_update_feed_response'
          description: Get indicator feed metadata
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update indicator feed data
      tags:
      - Custom Indicator Feeds
  /accounts/{account_id}/intel/indicator-feeds/permissions/add:
    put:
      operationId: custom-indicator-feeds-add-permission
      parameters:
      - in: path
        name: account_id
        required: true
