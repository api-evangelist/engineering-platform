openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare ASN Intelligence API
  version: 4.0.0
tags:
- name: ASN Intelligence
paths:
  /accounts/{account_id}/intel/asn/{asn}:
    get:
      operationId: asn-intelligence-get-asn-overview
      parameters:
      - in: path
        name: asn
        required: true
        schema:
          $ref: '#/components/schemas/intel_asn'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/intel_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/intel_asn_components-schemas-response'
                - $ref: '#/components/schemas/intel_api-response-common-failure'
          description: Get ASN Overview response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/intel_asn_components-schemas-response'
          description: Get ASN Overview response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get ASN Overview
      tags:
      - ASN Intelligence
  /accounts/{account_id}/intel/asn/{asn}/subnets:
    get:
      operationId: asn-intelligence-get-asn-subnets
      parameters:
      - in: path
        name: asn
        required: true
        schema:
          $ref: '#/components/schemas/intel_asn'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/intel_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    asn:
                      $ref: '#/components/schemas/intel_asn'
                    count:
                      $ref: '#/components/schemas/intel_count'
                    ip_count_total:
                      type: integer
                    page:
                      $ref: '#/components/schemas/intel_page'
                    per_page:
                      $ref: '#/components/schemas/intel_per_page'
                    subnets:
                      example:
                      - 192.0.2.0/24
                      - 2001:DB8::/32
                      items:
                        type: string
                      type: array
                  type: object
                - $ref: '#/components/schemas/intel_api-response-common-failure'
          description: Get ASN Subnets response failure
        '200':
          content:
            application/json:
              schema:
                properties:
                  asn:
                    $ref: '#/components/schemas/intel_asn'
                  count:
                    $ref: '#/components/schemas/intel_count'
                  ip_count_total:
                    type: integer
                  page:
                    $ref: '#/components/schemas/intel_page'
                  per_page:
                    $ref: '#/components/schemas/intel_per_page'
                  subnets:
                    example:
                    - 192.0.2.0/24
                    - 2001:DB8::/32
                    items:
                      type: string
                    type: array
                type: object
          description: Get ASN Subnets response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get ASN Subnets
      tags:
      - ASN Intelligence
components:
  schemas:
    intel_asn:
      type: integer
    intel_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      type: string
    intel_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    intel_per_page:
      description: Number of results per page of results.
      example: 20
      type: number
    intel_page:
      description: Current page within paginated list of results.
      example: 1
      type: number
    intel_api-response-single:
      allOf:
      - $ref: '#/components/schemas/intel_schemas-api-response-common'
      type: object
    intel_count:
      description: Total results returned based on your search parameters.
      example: 1
      type: number
    intel_schemas-api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/intel_messages'
        messages:
          $ref: '#/components/schemas/intel_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    intel_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/intel_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/intel_messages'
          example: []
        result:
          enum:
          - null
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    intel_asn_components-schemas-response:
      allOf:
      - $ref: '#/components/schemas/intel_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/intel_asn'
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
