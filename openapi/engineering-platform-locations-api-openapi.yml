openapi: 3.2.0
info:
  title: VSOnline Locations API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: Locations
paths:
  /api/v1/Locations:
    get:
      tags:
      - Locations
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationsResult'
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationsResult'
      summary: Get api locations
      x-summary-source: derived
      operationId: getApiV1Locations
      x-operation-id-source: derived
  /api/v1/Locations/{location}:
    get:
      tags:
      - Locations
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
      - name: planId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationInfoResult'
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInfoResult'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationInfoResult'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get api locations by location
      x-summary-source: derived
      operationId: getApiV1LocationsByLocation
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    LocationInfoResult:
      type: object
      properties:
        skus:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SkuInfoResult'
      additionalProperties: false
    LocationsResult:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/AzureLocation'
        available:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AzureLocation'
        hostnames:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
      additionalProperties: false
    SkuInfoResult:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        os:
          type:
          - string
          - 'null'
        availableSettings:
          $ref: '#/components/schemas/AvailableSettingsResult'
      additionalProperties: false
    AvailableSettingsResult:
      type: object
      properties:
        sku:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    AzureLocation:
      enum:
      - 0 (None)
      - 101 (EastAsia)
      - 102 (SouthEastAsia)
      - 201 (AustraliaCentral)
      - 202 (AustraliaCentral2)
      - 203 (AustraliaEast)
      - 205 (AustraliaSouthEast)
      - 301 (BrazilSouth)
      - 401 (CanadaCentral)
      - 402 (CanadaEast)
      - 501 (NorthEurope)
      - 502 (WestEurope)
      - 601 (FranceCentral)
      - 602 (FranceSouth)
      - 701 (CentralIndia)
      - 702 (SouthIndia)
      - 703 (WestIndia)
      - 801 (JapanEast)
      - 802 (JapanWest)
      - 901 (KoreaCentral)
      - 902 (KoreaSouth)
      - 1001 (SouthAfricaNorth)
      - 1002 (SouthAfricaWest)
      - 1201 (UaeCentral)
      - 1202 (UaeNorth)
      - 1401 (UkSouth)
      - 1402 (UkWest)
      - 1501 (CentralUs)
      - 1502 (EastUs)
      - 1503 (EastUs2)
      - 1504 (NorthCentralUs)
      - 1505 (SouthCentralUs)
      - 1506 (WestCentralUs)
      - 1507 (WestUs)
      - 1508 (WestUs2)
      - 1509 (WestUs3)
      - 1601 (CentralUsEuap)
      - 1602 (EastUs2Euap)
      - 1701 (SwitzerlandNorth)
      - 1702 (SwitzerlandWest)
      - 1801 (GermanyNorth)
      - 1802 (GermanyWestCentral)
      - 1901 (NorwayWest)
      - 1902 (NorwayEast)
      type: integer
      format: int32
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
