                          example: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
                          deprecated: true
                        deactivated:
                          type: boolean
                          description: If true, the mock server is not active. Mock servers deactivate when a linked collection or environment is deleted.
                          example: false
                  monitors:
                    type: array
