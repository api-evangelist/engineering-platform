                    items:
                      type: object
                      description: Information about the mock server.
                      properties:
                        id:
                          type: string
                          description: The mock server's ID.
                          example: e3d951bf-873f-49ac-a658-b2dcb91d3289
                        name:
                          type: string
                          description: The mock server's name.
                          example: Test Mock
                          deprecated: true
