openapi: 3.2.0
info:
  title: Postman Monitors API
  description: The Postman API enables you to programmatically access data stored in your Postman account.
  version: '1.0'
  termsOfService: https://www.postman.com/legal/terms/
  contact:
    name: Postman Support
    email: help@postman.com
    url: https://www.postman.com/community/
servers:
- url: https://api.getpostman.com
- url: https://api.eu.postman.com
security:
- PostmanApiKey: []
- scimApiKey: []
tags:
- name: Monitors
  description: The **Monitors** endpoints enable you to manage your monitors.
paths:
  /monitors:
    get:
      summary: APIs.io Engineering Platform Get all monitors
      description: Gets all monitors.
      operationId: getMonitors
      tags:
      - Monitors
      responses:
        '200':
          $ref: '#/components/responses/getMonitors'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
      parameters:
      - $ref: '#/components/parameters/workspaceResultsQuery'
    post:
      summary: APIs.io Engineering Platform Create a monitor
      description: 'Creates a monitor.


        **Note:**


        You cannot create monitors for collections added to an API definition.'
      operationId: createMonitor
      tags:
      - Monitors
      requestBody:
        $ref: '#/components/requestBodies/createMonitor'
      responses:
        '200':
          $ref: '#/components/responses/createMonitor'
        '400':
          $ref: '#/components/responses/monitors400CreateErrors'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/common403ErrorAndFeatureUnavailable'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
      parameters:
      - $ref: '#/components/parameters/workspaceQuery'
  /monitors/{monitorId}:
    parameters:
    - $ref: '#/components/parameters/monitorId'
    get:
      summary: APIs.io Engineering Platform Get a monitor
      description: Gets information about a monitor.
      operationId: getMonitor
      tags:
      - Monitors
      responses:
        '200':
          $ref: '#/components/responses/getMonitor'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/instanceNotFoundMonitor'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
    put:
      summary: APIs.io Engineering Platform Update a monitor
      description: Updates a monitor.
      operationId: updateMonitor
      tags:
      - Monitors
      requestBody:
        $ref: '#/components/requestBodies/updateMonitor'
      responses:
        '200':
          $ref: '#/components/responses/updateMonitor'
        '400':
          $ref: '#/components/responses/monitors400ErrorInvalidCronPattern'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/instanceNotFoundMonitor'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
    delete:
      summary: APIs.io Engineering Platform Delete a monitor
      description: Deletes a monitor.
      operationId: deleteMonitor
      tags:
      - Monitors
      responses:
        '200':
          $ref: '#/components/responses/deleteMonitor'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
  /monitors/{monitorId}/run:
    parameters:
    - $ref: '#/components/parameters/monitorId'
    - $ref: '#/components/parameters/async'
    post:
      summary: APIs.io Engineering Platform Run a monitor
      description: 'Runs a monitor and returns its run results.


        **Note:**


        If you pass the `async=true` query parameter, the response does not return the `stats`, `executions`, and `failures` responses. To get this information for an asynchronous run, call the GET `/monitors/{id}` endpoint.'
      operationId: runMonitor
      tags:
      - Monitors
      responses:
        '200':
          $ref: '#/components/responses/runMonitor'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
components:
  responses:
    getMonitor:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              monitor:
                type: object
                properties:
                  id:
                    type: string
                    description: The monitor's ID.
                    example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                  name:
                    type: string
                    description: The monitor's name.
                    example: Test Monitor
                  uid:
                    type: string
                    format: uid
                    description: The monitor's unique ID.
                    example: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                  owner:
                    type: number
                    description: The ID of monitor's owner.
                    example: 12345678
                  collectionUid:
                    type: string
                    format: uid
                    description: The unique ID of the monitor's associated collection.
                    example: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
                  environmentUid:
                    type: string
                    format: uid
                    description: The unique ID of the monitor's associated environment.
                    example: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
                  distribution:
                    type: array
                    description: A list of the monitor's [geographic regions](https://learning.postman.com/docs/monitoring-your-api/setting-up-monitor/#adding-regions).
                    items:
                      type: string
                    example: []
                  lastRun:
                    type: object
                    description: Information about the monitor's previous run.
                    properties:
                      finishedAt:
                        type: string
                        format: date-time
                        description: The date and time at which the monitor's previous run completed.
                        example: '2022-06-17T18:39:53.707Z'
                      startedAt:
                        type: string
                        format: date-time
                        description: The date and time at which the monitor's previous run started.
                        example: '2022-06-17T18:39:52.852Z'
                      stats:
                        type: object
                        description: Information about the monitor's stats.
                        properties:
                          assertions:
                            type: object
                            description: Information about the monitor's assertions.
                            properties:
                              failed:
                                type: number
                                description: The total number of test failures.
                                example: 1
                              total:
                                type: number
                                description: The total number of tests performed.
                                example: 8
                          requests:
                            type: object
                            description: Information about the monitor's requests.
                            properties:
                              total:
                                type: number
                                description: The total number of requests.
                                example: 4
                      status:
                        type: string
                        description: The monitor's status after its last run.
                        example: failed
                  notifications:
                    type: object
                    description: Information about the monitor's notification settings.
                    properties:
                      onError:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                              format: email
                              description: The email address of the user to notify on monitor error.
                              example: taylor.lee@example.com
                      onFailure:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                              format: email
                              description: The email address of the user to notify on monitor failure.
                              example: taylor.lee@example.com
                  options:
                    type: object
                    description: Information about the monitor's option settings.
                    properties:
                      followRedirects:
                        type: boolean
                        description: If true, follow redirects enabled.
                        example: true
                      requestDelay:
                        type: number
                        description: The monitor's request delay value.
                        example: 0
                      requestTimeout:
                        type: number
                        description: The monitor's request timeout value.
                        example: 3000
                      strictSSL:
                        type: boolean
                        description: If true, strict SSL enabled.
                        example: true
                  schedule:
                    type: object
                    description: Information about the monitor's schedule.
                    properties:
                      cron:
                        type: string
                        description: The monitor's cron frequency value.
                        example: 0 0 * * * *
                      nextRun:
                        type: string
                        format: date-time
                        description: The date and time of monitor's next scheduled run.
                        example: '2022-06-18T05:00:00.000Z'
                      timezone:
                        type: string
                        description: The monitor's timezone.
                        example: America/Chicago
          example:
            monitor:
              id: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              name: Test Monitor
              uid: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              owner: 12345678
              collectionUid: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
              environmentUid: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
              options:
                strictSSL: true
                followRedirects: true
                requestTimeout: 3000
                requestDelay: 0
              notifications:
                onError:
                - email: taylor.lee@example.com
                onFailure:
                - email: taylor.lee@example.com
              distribution: []
              schedule:
                cron: 0 0 0 * * *
                timezone: America/Chicago
                nextRun: '2022-06-18T05:00:00.000Z'
              lastRun:
                status: failed
                startedAt: '2022-06-17T18:39:52.852Z'
                finishedAt: '2022-06-17T18:39:53.707Z'
                stats:
                  assertions:
                    total: 8
                    failed: 1
                  requests:
                    total: 4
    monitors400CreateErrors:
      description: Bad Request
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/monitors400ErrorInvalidCronPattern'
            - $ref: '#/components/schemas/monitors400ErrorInvalidTimezone'
            - $ref: '#/components/schemas/monitors400ErrorInvalidUid'
            - $ref: '#/components/schemas/monitors400ParamMissing'
          examples:
            Invalid Cron Pattern:
              $ref: '#/components/examples/monitors400ErrorInvalidCronPattern'
            Invalid Timezone:
              $ref: '#/components/examples/monitors400ErrorInvalidTimezone'
            Invalid Collection UID:
              $ref: '#/components/examples/monitors400ErrorInvalidCollectionUid'
            Invalid Environment UID:
              $ref: '#/components/examples/monitors400ErrorInvalidEnvironmentUid'
            Missing Parameter:
              $ref: '#/components/examples/monitors400ErrorMissingParameter'
    common401Error:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri-reference
                description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
                example: https://api.postman.com/problems/unauthorized
              title:
                type: string
                description: A short summary of the problem.
                example: Unauthorized
              detail:
                type: string
                description: Information about the error.
                example: Unauthorized
              status:
                type: integer
                format: http-status-code
                description: The error's HTTP status code.
                example: 401
          example:
            type: https://api.postman.com/problems/unauthorized
            title: Unauthorized
            detail: Unauthorized
            status: 401
    monitors400ErrorInvalidCronPattern:
      description: Invalid Cron Pattern
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/monitors400ErrorInvalidCronPattern'
          example:
            value:
              error:
                name: cronPatternNotAllowedError
                message: Invalid cron pattern. Enter a valid cron pattern, such as "0 17 * * *"
                details:
                  pattern: '* * * * *'
    common500ErrorServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                    description: The error name.
                    example: serverError
                  message:
                    type: string
                    description: The error message.
                    example: An error has occurred on the server.
          example:
            error:
              name: serverError
              message: An error has occurred on the server.
    getMonitors:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              monitors:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The monitor's ID.
                      example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                    name:
                      type: string
                      description: The monitor's name.
                      example: Test Monitor
                    owner:
                      type: string
                      description: The ID of the monitor's owner.
                      example: '12345678'
                    uid:
                      type: string
                      format: uid
                      description: The monitor's unique ID.
                      example: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
          example:
            monitors:
            - id: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              name: Test Monitor
              uid: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              owner: '12345678'
            - id: 1e6b6cb7-f13d-4000-acb7-0695757174a8
              name: Postman Echo Monitor
              uid: 87654321-1e6b6cb7-f13d-4000-acb7-0695757174a8
              owner: '87654321'
    common403ErrorAndFeatureUnavailable:
      description: Forbidden
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/common403Error'
            - $ref: '#/components/schemas/featureUnavailable403Error'
          examples:
            Forbidden:
              value:
                type: https://api.postman.com/problems/forbidden
                title: Forbidden
                detail: Forbidden
                status: 403
            Feature Unavailable:
              value:
                type: https://api.postman.com/problems/forbidden
                title: Forbidden
                detail: This feature isn't available in your region.
                status: 403
    instanceNotFoundMonitor:
      description: Instance Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                    description: The error name.
                    example: instanceNotFoundError
                  message:
                    type: string
                    description: The error message.
                    example: The specified monitor does not exist.
          example:
            error:
              name: instanceNotFoundError
              message: The specified monitor does not exist.
    updateMonitor:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              monitor:
                type: object
                properties:
                  id:
                    type: string
                    description: The monitor's ID.
                    example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                  name:
                    type: string
                    description: The monitor's name.
                    example: Test Monitor
                  uid:
                    type: string
                    format: uid
                    description: The monitor's unique ID.
                    example: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
          example:
            monitor:
              id: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              name: Test Monitor
              uid: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
    featureUnavailable403Error:
      description: Feature Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/featureUnavailable403Error'
          example:
            value:
              type: https://api.postman.com/problems/forbidden
              title: Forbidden
              detail: This feature isn't available in your region.
              status: 403
    createMonitor:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              monitor:
                type: object
                properties:
                  id:
                    type: string
                    description: The monitor's ID.
                    example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                  name:
                    type: string
                    description: The monitor's name.
                    example: Test Monitor
                  uid:
                    type: string
                    format: uid
                    description: The monitor's unique ID.
                    example: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
          example:
            monitor:
              id: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              name: Test Monitor
              uid: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
    deleteMonitor:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              monitor:
                type: object
                properties:
                  id:
                    type: string
                    description: The monitor's ID.
                    example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                  uid:
                    type: string
                    format: uid
                    description: The monitor's unique ID.
                    example: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
          example:
            monitor:
              id: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
              uid: 12345678-1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
    runMonitor:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              run:
                type: object
                description: Information about the monitor run. If you pass the `async=true` query parameter, the response does not return the `stats`, `executions`, and `failures` responses. To get this information for an asynchronous run, call the GET `/monitors/{id}` endpoint.
                properties:
                  info:
                    type: object
                    description: Information about the monitor.
                    properties:
                      jobId:
                        type: string
                        description: The monitor's run job ID.
                        example: 1ecee76a-e14e-47c0-bddc-256bf690c407
                      collectionUid:
                        type: string
                        format: uid
                        description: The unique ID of the monitor's associated collection.
                        example: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
                      environmentUid:
                        type: string
                        format: uid
                        description: The unique ID of the monitor's associated environment.
                        example: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
                      monitorId:
                        type: string
                        description: The monitor's ID.
                        example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                      name:
                        type: string
                        description: The monitor's name.
                        example: Test Monitor
                      status:
                        type: string
                        description: The monitor run's status.
                        example: success
                      startedAt:
                        type: string
                        format: date-time
                        description: The date and time at which the monitor run began.
                        example: '2022-06-17T19:50:04.019Z'
                      finishedAt:
                        type: string
                        format: date-time
                        description: The date and time at which the monitor's run completed.
                        example: '2022-06-17T19:50:06.439Z'
                  stats:
                    type: object
                    description: Information about the monitor run's stats.
                    properties:
                      assertions:
                        type: object
                        description: The monitor run's assertions stats.
                        properties:
                          total:
                            type: number
                            description: The total number of tests performed.
                            example: 0
                          failed:
                            type: number
                            description: The total number of test failures.
                            example: 0
                      requests:
                        type: object
                        description: The monitor run's request stats.
                        properties:
                          total:
                            type: number
                            description: The total number of requests.
                            example: 1
                          failed:
                            type: number
                            description: The number of request failures.
                            example: 0
                  executions:
                    type: array
                    description: Information about the monitor run's executions.
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: The execution ID.
                          example: 1
                        item:
                          type: object
                          description: Information about the executed item.
                          properties:
                            name:
                              type: string
                              description: The executed item's name.
                              example: Sample POST Request
                        request:
                          type: object
                          description: Information about the monitor run's requests.
                          properties:
                            method:
                              type: string
                              description: The request method.
                              example: POST
                            url:
                              type: string
                              format: url
                              description: The request's URL.
                              example: http://echo.getpostman.com/post
                            body:
                              type: object
                              description: Information about the request body, such as Content-Length.
                              additionalProperties: true
                            headers:
                              type: object
                              description: Information about the request headers, such as Content-Type, Accept, encoding, and other information.
                              additionalProperties: true
                            timestamp:
                              type: string
                              description: The date and time of the request.
                              example: '2016-12-04T14:30:26.025Z'
                        response:
                          type: object
                          description: Information about the monitor run's response.
                          properties:
                            body:
                              type: object
                              description: Information about the request body, such as Content-Length.
                              additionalProperties: true
                            code:
                              type: number
                              description: The response's HTTP status code.
                              example: 200
                            headers:
                              type: object
                              description: Information about the response headers, such as Content-Type, Accept, encoding, and other information.
                              additionalProperties: true
                            responseSize:
                              type: number
                              description: The response size, in bytes.
                              example: 298
                            responseTime:
                              type: number
                              description: The response time, in milliseconds.
                              example: 26
                  failures:
                    type: array
                    description: If the monitor run failed, information about the run's failures.
                    items:
                      type: object
                    example: []
          examples:
            Successful Response:
              value:
                run:
                  info:
                    jobId: 1ecee76a-e14e-47c0-bddc-256bf690c407
                    monitorId: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                    name: Test Monitor
                    collectionUid: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
                    environmentUid: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
                    status: success
                    startedAt: '2022-06-17T19:50:04.019Z'
                    finishedAt: '2022-06-17T19:50:06.439Z'
                  stats:
                    assertions:
                      total: 0
                      failed: 0
                    requests:
                      total: 1
                      failed: 0
                  executions:
                  - id: 1
                    item:
                      name: Sample POST Request
                    request:
                      method: POST
                      url: http://echo.getpostman.com/post
                      headers:
                        Content-Type: application/json
                        User-Agent: PostmanRuntime/7.29.0
                        Accept: '*/*'
                        Cache-Control: no-cache
                        Postman-Token: null
                        Host: echo.getpostman.com
                        Accept-Encoding: gzip, deflate, br
                        Connection: keep-alive
                        Content-Length: '0'
                      body:
                        contentLength: 0
                      timestamp: '2022-06-17T19:50:06.186Z'
                    response:
                      code: 200
                      body:
                        contentLength: 50
                      responseTime: 49
                      responseSize: 50
                      headers:
                        Date: Fri, 17 Jun 2022 19:50:06 GMT
                        Content-Type: text/plain
                        Content-Length: '50'
                        Connection: keep-alive
                        Server: null
                  failures: []
            Run With async Parameter:
              value:
                run:
                  info:
                    jobId: 1ecee76a-e14e-47c0-bddc-256bf690c407
                    monitorId: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
                    name: Test Monitor
                    collectionUid: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
                    environmentUid: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
                    status: success
                    startedAt: '2022-06-17T19:50:04.019Z'
                    finishedAt: '2022-06-17T19:50:06.439Z'
  parameters:
    monitorId:
      name: monitorId
      in: path
      required: true
      description: The monitor's ID.
      schema:
        type: string
        example: 1e6b6cc1-c760-48e0-968f-4bfaeeae9af1
    async:
      name: async
      in: query
      description: If true, runs the monitor asynchronously from the created monitor run task. By default, the server will not respond until the task finishes (`false`).
      schema:
        type: boolean
        default: false
        example: false
    workspaceResultsQuery:
      name: workspace
      in: query
      description: Return only results found in the given workspace.
      schema:
        $ref: '#/components/schemas/workspaceId'
    workspaceQuery:
      name: workspace
      in: query
      description: The workspace's ID.
      schema:
        $ref: '#/components/schemas/workspaceId'
  schemas:
    featureUnavailable403Error:
      title: Feature Unavailable
      type: object
      properties:
        type:
          type: string
