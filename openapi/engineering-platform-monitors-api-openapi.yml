  requestBodies:
    updateMonitor:
      content:
        application/json:
          schema:
            type: object
            properties:
              monitor:
                type: object
                properties:
                  name:
                    type: string
                    description: The monitor's name.
                    example: Test Monitor
                  schedule:
                    type: object
                    description: Information about the monitor's schedule.
                    properties:
                      cron:
                        type: string
                        description: 'The monitor''s run frequency, based on the given cron pattern. For example:


                          | Frequency | Cron pattern |

                          | --------- | ------------ |

                          | Every 5 minutes | `*/5 * * * *` |

                          | Every 30 minutes | `*/30 * * * *` |

                          | Every hour | `0 */1 * * *` |

                          | Every 6 hours | `0 */6 * * *` |

                          | Every day at 5 pm | `0 17 * * *` |

                          | Every Monday at 12 pm | `0 12 * * MON` |

                          | Every weekday (Mon — Fri) at 6 am | `0 6 * * MON-FRI` |

                          '
                        example: '*/5 * * * *'
                      timezone:
                        type: string
                        description: The monitor's [timezone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
                        example: America/Chicago
          example:
            monitor:
              name: Test Monitor
              schedule:
                cron: '*/5 * * * *'
                timezone: America/Chicago
    createMonitor:
      content:
        application/json:
          schema:
            type: object
            properties:
