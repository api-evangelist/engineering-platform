tags:
- name: Queue
paths:
  /accounts/{account_id}/queues:
    get:
      description: Returns the queues owned by an account.
      operationId: queue-v2-list-queues
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      errors: {}
                  - properties:
                      messages: {}
                  - properties:
                      result_info:
                        properties:
                          count:
                            example: 1
                          page:
                            example: 1
                          per_page:
                            example: 100
                          total_count:
                            example: 1
                          total_pages:
                            example: 1
                        type: object
                  - properties:
                      result:
                        items:
                          $ref: '#/components/schemas/mq_queue'
                        type: array
                    required:
                    - queue_id
                    - queue_name
                    - created_on
                    - modified_on
                    - producers_total_count
                    - producers
                    - consumers_total_count
                    - consumers
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: List Queues response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    errors: {}
                - properties:
                    messages: {}
                - properties:
                    result_info:
                      properties:
                        count:
                          example: 1
                        page:
                          example: 1
                        per_page:
                          example: 100
                        total_count:
                          example: 1
                        total_pages:
                          example: 1
                      type: object
                - properties:
                    result:
                      items:
                        $ref: '#/components/schemas/mq_queue'
                      type: array
                  required:
                  - queue_id
                  - queue_name
                  - created_on
                  - modified_on
                  - producers_total_count
                  - producers
                  - consumers_total_count
                  - consumers
                  type: object
          description: List Queues response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform List Queues
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Queues Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.list
    post:
      description: Creates a new queue.
      operationId: queue-v2-create-queue
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json:
            schema:
              example:
                queue_name: example-queue
              properties:
                queue_name:
                  type: string
              required:
              - queue_name
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result:
                        allOf:
                        - $ref: '#/components/schemas/mq_queue_created'
                        type: object
                    required:
                    - queue_id
                    - queue_name
                    - created_on
                    - modified_on
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Create Queue response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result:
                      allOf:
                      - $ref: '#/components/schemas/mq_queue_created'
                      type: object
                  required:
                  - queue_id
                  - queue_name
                  - created_on
                  - modified_on
                  type: object
          description: Create Queue response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Create Queue
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.create
  /accounts/{account_id}/queues/{queue_id}:
    delete:
      description: Deletes a queue.
      operationId: queue-v2-delete-queue
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result: {}
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Delete Queue response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result: {}
          description: Delete Queue response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Delete Queue
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.delete
    get:
      description: Get information about a specific queue.
      operationId: queue-v2-queue-details
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result:
                        allOf:
                        - $ref: '#/components/schemas/mq_queue'
                        type: object
                    required:
                    - queue_id
                    - queue_name
                    - created_on
                    - modified_on
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Queue Details response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result:
                      allOf:
                      - $ref: '#/components/schemas/mq_queue'
                      type: object
                  required:
                  - queue_id
                  - queue_name
                  - created_on
                  - modified_on
                  type: object
          description: Queue Details response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Queue Details
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Queues Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.read
    put:
      description: Updates a queue.
      operationId: queue-v2-update-queue
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json:
            schema:
              example:
                queue_name: renamed-example-queue
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result:
                        allOf:
                        - $ref: '#/components/schemas/mq_queue_updated'
                        type: object
                    required:
                    - queue_id
                    - queue_name
                    - created_on
                    - modified_on
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Update Queue response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result:
                      allOf:
                      - $ref: '#/components/schemas/mq_queue_updated'
                      type: object
                  required:
                  - queue_id
                  - queue_name
                  - created_on
                  - modified_on
                  type: object
          description: Update Queue response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Update Queue
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.update
  /accounts/{account_id}/queues/{queue_id}/consumers:
    get:
      description: Returns the consumers for a queue.
      operationId: queue-v2-list-queue-consumers
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      errors: {}
                  - properties:
                      messages: {}
                  - properties:
                      result_info:
                        properties:
                          count:
                            example: 1
                          page:
                            example: 1
                          per_page:
                            example: 100
                          total_count:
                            example: 1
                          total_pages:
                            example: 1
                        type: object
                  - properties:
                      result:
                        items:
                          $ref: '#/components/schemas/mq_consumer'
                        type: array
                    required:
                    - queue_name
                    - created_on
                    - settings
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: List Queue Consumers response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    errors: {}
                - properties:
                    messages: {}
                - properties:
                    result_info:
                      properties:
                        count:
                          example: 1
                        page:
                          example: 1
                        per_page:
                          example: 100
                        total_count:
                          example: 1
                        total_pages:
                          example: 1
                      type: object
                - properties:
                    result:
                      items:
                        $ref: '#/components/schemas/mq_consumer'
                      type: array
                  required:
                  - queue_name
                  - created_on
                  - settings
                  type: object
          description: List Queue Consumers response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform List Queue Consumers
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Queues Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.list
    post:
      description: Creates a new consumer for a queue.
      operationId: queue-v2-create-queue-consumer
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json:
            schema:
              example:
                dead_letter_queue: example-dlq
                environment: production
                script_name: example-consumer
                settings:
                  batch_size: 10
                  max_retries: 3
                  max_wait_time_ms: 5000
                type: worker
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result:
                        allOf:
                        - $ref: '#/components/schemas/mq_consumer_created'
                        type: object
                    required:
                    - queue_name
                    - script_name
                    - settings
                    - dead_letter_queue
                    - created_on
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Create Queue Consumer response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result:
                      allOf:
                      - $ref: '#/components/schemas/mq_consumer_created'
                      type: object
                  required:
                  - queue_name
                  - script_name
                  - settings
                  - dead_letter_queue
                  - created_on
                  type: object
          description: Create Queue Consumer response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Create Queue Consumer
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.create
  /accounts/{account_id}/queues/{queue_id}/consumers/{consumer_id}:
    delete:
      description: Deletes the consumer for a queue.
      operationId: queue-v2-delete-queue-consumer
      parameters:
      - in: path
        name: consumer_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result: {}
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Delete Queue Consumer response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result: {}
          description: Delete Queue Consumer response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Delete Queue Consumer
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.delete
    put:
      description: Updates the consumer for a queue, or creates one if it does not exist.
      operationId: queue-v2-update-queue-consumer
      parameters:
      - in: path
        name: consumer_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json:
            schema:
              example:
                dead_letter_queue: updated-example-dlq
                environment: production
                script_name: example-consumer
                settings:
                  batch_size: 100
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result:
                        allOf:
                        - $ref: '#/components/schemas/mq_consumer_updated'
                        type: object
                    required:
                    - queue_name
                    - script_name
                    - settings
                    - dead_letter_queue
                    - created_on
                    type: object
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Update Queue Consumer response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result:
                      allOf:
                      - $ref: '#/components/schemas/mq_consumer_updated'
                      type: object
                  required:
                  - queue_name
                  - script_name
                  - settings
                  - dead_letter_queue
                  - created_on
                  type: object
          description: Update Queue Consumer response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Update Queue Consumer
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.update
  /accounts/{account_id}/queues/{queue_id}/messages/ack:
    post:
      description: Acknowledge + Retry messages from a Queue.
      operationId: queue-v2-messages-ack
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                acks:
                  items:
                    properties:
                      lease_id:
                        description: Lease ID for a message to acknowledge.
                        example: eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2Q0JDLUhTNTEyIn0..Q8p21d7dceR6vUfwftONdQ.JVqZgAS-Zk7MqmqccYtTHeeMElNHaOMigeWdb8LyMOg.T2_HV99CYzGaQuhTyW8RsgbnpTRZHRM6N7UoSaAKeK0
                        type: string
                    type: object
                  type: array
                retries:
                  items:
                    properties:
                      delay_seconds:
                        description: The number of seconds to delay before making the message available for another attempt.
                        example: 10
                        type: number
                      lease_id:
                        description: Lease ID for a message to retry.
                        example: eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2Q0JDLUhTNTEyIn0..Q8p21d7dceR6vUfwftONdQ.JVqZgAS-Zk7MqmqccYtTHeeMElNHaOMigeWdb8LyMOg.T2_HV99CYzGaQuhTyW8RsgbnpTRZHRM6N7UoSaAKeK0
                        type: string
                    type: object
                  type: array
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/components/schemas/mq_api-response-collection'
                  - properties:
                      result: {}
                - $ref: '#/components/schemas/mq_api-response-common-failure'
          description: Acknoweldge Queue Messages response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/mq_api-response-collection'
                - properties:
                    result:
                      properties:
                        ackCount:
                          description: The number of messages that were succesfully acknowledged.
                          example: 5
                          type: number
                        retryCount:
                          description: The number of messages that were succesfully retried.
                          example: 5
                          type: number
                        warnings:
                          items:
                            type: string
                          type: array
                      type: object
          description: Acknoweldge Queue Messages response.
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Acknowledge + Retry Queue Messages
      tags:
      - Queue
      x-api-token-group:
      - Queues Write
      - Workers Scripts Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.worker.queue.update
  /accounts/{account_id}/queues/{queue_id}/messages/pull:
    post:
      description: Pull a batch of messages from a Queue.
      operationId: queue-v2-messages-pull
      parameters:
      - in: path
        name: queue_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/mq_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                batch_size:
                  $ref: '#/components/schemas/mq_batch_size'
