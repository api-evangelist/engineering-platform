security:
- hmac: []
tags:
- name: Schema
  description: The **Schema** endpoints enable you to manage your API definitions. These endpoints also support multi-file schema.
paths:
  /apis/{apiId}/schemas:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/v10Accept'
    post:
      summary: APIs.io Engineering Platform Create a schema
      description: Creates a schema for an API.
      operationId: createApiSchema
      tags:
      - Schema
      requestBody:
        $ref: '#/components/requestBodies/createApiSchema'
      responses:
        '200':
          $ref: '#/components/responses/createApiSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema400ErrorInvalidParams'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Schema Already Exists:
                  $ref: '#/components/examples/apiSchema400ErrorInvalidParams'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema403ErrorForbidden'
                - $ref: '#/components/schemas/featureUnavailable403Error'
              examples:
                Forbidden:
                  $ref: '#/components/examples/apiSchema403ErrorForbidden'
                Feature Unavailable:
                  $ref: '#/components/examples/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/api404ErrorInstanceNotFound'
        '422':
          $ref: '#/components/responses/gitLinkedApi422Error'
        '500':
          $ref: '#/components/responses/common500Error'
  /apis/{apiId}/schemas/{schemaId}:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/apiSchemaId'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get a schema
      description: 'Gets information about API schema. You can use the `versionId` query parameter to get a schema published in an API version.


        You can use this API to do the following:


        - Get a schema''s metadata.

        - Get all the files in a schema. This only returns the first file in the schema. The endpoint response contains a link to the next set of response results.

        - Get a schema''s contents in multi-file or bundled format.


        **Note:**


        The `versionId` query parameter is a required parameter for API viewers.

        '
      operationId: getApiSchema
      tags:
      - Schema
      responses:
        '200':
          $ref: '#/components/responses/getApiSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema400ErrorNotLinked'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Schema Not Linked to API:
                  $ref: '#/components/examples/apiSchema400ErrorNotLinked'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/api403ErrorAndFeatureUnavailable'
        '404':
          $ref: '#/components/responses/api404ErrorInstanceNotFound'
        '422':
          $ref: '#/components/responses/gitLinkedApi422Error'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/apiVersionQuery'
      - $ref: '#/components/parameters/apiSchemaOutput'
  /apis/{apiId}/schemas/{schemaId}/files:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/apiSchemaId'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get schema files
      description: 'Gets the files in an API schema. You can use the `versionId` query parameter to get schema files published in an API version.


        **Note:**


        The `versionId` query parameter is a required parameter for API viewers.

        '
      operationId: getApiSchemaFiles
      tags:
      - Schema
      responses:
        '200':
          $ref: '#/components/responses/getApiSchemaFiles'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema400ErrorNotLinked'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Schema Not Linked to API:
                  $ref: '#/components/examples/apiSchema400ErrorNotLinked'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/api404ErrorInstanceNotFound'
        '422':
          $ref: '#/components/responses/gitLinkedApi422Error'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/apiVersionQuery'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
  /apis/{apiId}/schemas/{schemaId}/files/{file-path}:
    parameters:
    - $ref: '#/components/parameters/apiId'
    - $ref: '#/components/parameters/apiSchemaId'
    - $ref: '#/components/parameters/file-path'
    - $ref: '#/components/parameters/v10Accept'
    get:
      summary: APIs.io Engineering Platform Get schema file contents
      description: 'Gets an API schema file contents at the defined path. You can use the `versionId` query parameter to get schema file contents published in an API version.


        **Note:**


        The `versionId` query parameter is a required parameter for API viewers.

        '
      operationId: getApiSchemaFileContents
      tags:
      - Schema
      responses:
        '200':
          $ref: '#/components/responses/getApiSchemaFileContents'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema400ErrorNotLinked'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Schema Not Linked to API:
                  $ref: '#/components/examples/apiSchema400ErrorNotLinked'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/api404ErrorInstanceNotFound'
        '422':
          $ref: '#/components/responses/gitLinkedApi422Error'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/apiVersionQuery'
    put:
      summary: APIs.io Engineering Platform Create or update a schema file
      description: 'Creates or updates an API schema file.


        **Note:**


        - If the provided file path exists, the file is updated with the new contents.

        - If the provided file path does not exist, then a new schema file is created.

        - If the file path contains a `/` (forward slash) character, then a folder is created. For example, if the file path is the `dir/schema.json` value, then a `dir` folder is created with the `schema.json` file inside.

        - You can only update the `root` tag for protobuf specifications.

        '
      operationId: createUpdateApiSchemaFile
      tags:
      - Schema
      requestBody:
        $ref: '#/components/requestBodies/createUpdateApiSchemaFile'
      responses:
        '200':
          $ref: '#/components/responses/createUpdateApiSchemaFile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema400ErrorNotLinked'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Schema Not Linked to API:
                  $ref: '#/components/examples/apiSchema400ErrorNotLinked'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema403ErrorForbidden'
                - $ref: '#/components/schemas/featureUnavailable403Error'
              examples:
                Forbidden:
                  $ref: '#/components/examples/apiSchema403ErrorForbidden'
                Feature Unavailable:
                  $ref: '#/components/examples/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/apiSchema404ErrorNotFound'
        '422':
          $ref: '#/components/responses/gitLinkedApi422Error'
        '500':
          $ref: '#/components/responses/common500Error'
    delete:
      summary: APIs.io Engineering Platform Delete a schema file
      description: Deletes a file in an API schema. On success, this returns an HTTP `204 No Content` response.
      operationId: deleteApiSchemaFile
      tags:
      - Schema
      responses:
        '204':
          description: Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema400ErrorNotLinked'
                - $ref: '#/components/schemas/v10HeaderMissing'
              examples:
                Schema Not Linked to API:
                  $ref: '#/components/examples/apiSchema400ErrorNotLinked'
                Missing v10 Accept Header:
                  $ref: '#/components/examples/v10HeaderMissing'
        '401':
          $ref: '#/components/responses/api401ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/apiSchema403ErrorForbidden'
                - $ref: '#/components/schemas/featureUnavailable403Error'
              examples:
                Forbidden:
                  $ref: '#/components/examples/apiSchema403ErrorForbidden'
                Feature Unavailable:
                  $ref: '#/components/examples/featureUnavailable403Error'
        '404':
          $ref: '#/components/responses/api404ErrorInstanceNotFound'
        '422':
          $ref: '#/components/responses/gitLinkedApi422Error'
        '500':
          $ref: '#/components/responses/common500Error'
components:
  responses:
    createApiSchema:
      description: Created
      content:
        application/json:
          schema:
            type: object
            description: Information about the created API schema.
            properties:
              id:
                type: string
                description: The schema's ID.
                example: b4fc1bdc-6587-4f9b-95c9-f768146089b4
              type:
                type: string
                description: The schema's type.
                enum:
                - proto:2
                - proto:3
                - graphql
                - openapi:3_1
                - openapi:3
                - openapi:2
                - openapi:1
                - raml:1
                - raml:0_8
                - wsdl:2
                - wsdl:1
                - asyncapi:2
                example: openapi:3
              files:
                type: array
                description: The list of the schema's files.
                items:
                  type: object
                  title: Schema File Base Data
                  description: Information about the schema file.
                  properties:
                    id:
                      type: string
                      description: The schema file's ID.
                      example: b4fc1bdc-6587-4f9b-95c9-f768146089b4
                    name:
                      type: string
                      description: The schema file's name.
                      example: index.json
                    path:
                      type: string
                      description: The file system path to the schema file.
                      example: index.json
                    createdAt:
                      type: string
                      format: date-time
                      description: The date and time at which the file was created.
                      example: '2023-03-29T11:37:15Z'
                    root:
                      type: object
                      description: An object that contains root file information.
                      properties:
                        enabled:
                          type: boolean
                          description: If true, the file is tagged as the schema's root file.
                          example: true
                    createdBy:
                      type: string
                      description: The user ID of the user that created the file.
                      example: '12345678'
                    updatedAt:
                      type: string
                      format: date-time
                      description: The date and time at which the file was last updated.
                      example: '2023-03-29T11:37:15Z'
                    updatedBy:
                      type: string
                      description: The user ID of the user that last updated the file.
                      example: '12345678'
              createdAt:
                type: string
                format: date-time
                description: The date and time at which the schema was created.
                example: '2023-03-29T11:37:15Z'
              createdBy:
                type: string
                description: The user ID of the user that created the schema.
                example: '12345678'
              updatedAt:
                type: string
                format: date-time
                description: The date and time at which the schema was last updated.
                example: '2023-03-29T11:37:15Z'
              updatedBy:
                type: string
                description: The user ID of the user that updated the schema.
                example: '12345678'
          example:
            type: openapi:3
            files:
            - createdBy: '12345678'
              path: index.json
              updatedBy: '12345678'
              updatedAt: '2024-07-18T13:17:30.000Z'
              root:
                enabled: true
              id: b4fc1bdc-6587-4f9b-95c9-f768146089b4
              name: index.json
              createdAt: '2024-07-18T13:17:30.000Z'
            updatedAt: '2024-07-18T13:17:30.000Z'
            createdAt: '2024-07-18T13:17:30.000Z'
            createdBy: '12345678'
            updatedBy: '12345678'
            id: b4fc1bdc-6587-4f9b-95c9-f768146089b4
    featureUnavailable403Error:
      description: Feature Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/featureUnavailable403Error'
          example:
            value:
              type: https://api.postman.com/problems/forbidden
              title: Forbidden
              detail: This feature isn't available in your region.
              status: 403
    api401ErrorUnauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri-reference
                description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
                example: https://api.postman.com/problems/unauthorized
              title:
                type: string
                description: A short summary of the problem.
                example: Unauthorized
              detail:
                type: string
                description: Information about the error.
                example: An API key must be provided in the request header or query string
              status:
                type: number
                format: http-status-code
                description: The error's HTTP status code.
                example: 401
              instance:
                type: string
                description: The URI reference that identifies the specific occurrence of the problem.
                example: /collections/12ece9e1-2abf-4edc-8e34-de66e74114d2/requests/%7B%7BrequestId%7D%7D
          example:
            type: https://api.postman.com/problems/unauthorized
            title: Unauthorized
            detail: An API key must be provided in the request header or query string
            status: 401
            instance: /collections/12ece9e1-2abf-4edc-8e34-de66e74114d2/requests/%7B%7BrequestId%7D%7D
    common500Error:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri-reference
                description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
                example: https://api.postman.com/problems/internal-server-error
              title:
                type: string
                description: A short summary of the problem.
                example: Internal Server Error
              detail:
                type: string
                description: Information about the error.
                example: Internal Server Error
          example:
            type: https://api.postman.com/problems/internal-server-error
            title: Internal Server Error
            detail: Internal Server Error
    gitLinkedApi422Error:
      description: Git-Linked API Errror
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The error type.
                example: actionNotAllowedError
              title:
                type: string
                description: A short summary of the problem.
                example: Action not allowed
              detail:
                type: string
                description: Details about the error.
                example: This action is not allowed for Git linked APIs
          example:
            type: actionNotAllowedError
            title: Action not allowed
            detail: This action is not allowed for Git linked APIs
    createUpdateApiSchemaFile:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            title: Schema File Base Data
            description: Information about the schema file.
            properties:
              createdBy:
                type: string
                description: The user ID of the user that created the file.
                example: '12345678'
              createdAt:
                type: string
                format: date-time
                description: The date and time at which the file was created.
                example: '2024-07-18T13:48:28.000Z'
              root:
                type: object
                description: Information about the schema's root file.
                properties:
                  enabled:
                    type: boolean
                    description: If true, the file is the schema's the root file.
                    example: true
              name:
                type: string
                description: The schema file's name.
                example: index.json
              path:
                type: string
                description: The file system path to the schema file.
                example: index.json
              updatedBy:
                type: string
                description: The user ID of the user that last updated the file.
                example: '12345678'
              id:
                type: string
                description: The schema file's ID.
                example: 2fdc8ea1-d02e-4e50-989e-6fa28f42b995
              updatedAt:
                type: string
                format: date-time
                description: The date and time at which the file was last updated.
                example: '2024-07-18T13:48:28.000Z'
          example:
            createdBy: '12345678'
            createdAt: '2024-07-18T13:47:39.000Z'
            root:
              enabled: true
            name: index.json
            path: index.json
            updatedBy: '12345678'
            id: 2fdc8ea1-d02e-4e50-989e-6fa28f42b995
            updatedAt: '2024-07-18T13:48:28.000Z'
    getApiSchema:
      description: Successful Response
      content:
        application/json:
          schema:
            anyOf:
            - type: object
              title: Get Schema
              description: Information about the schema.
              properties:
                id:
                  type: string
                  description: The schema's ID.
                  example: ae2b9ab2-28f2-401d-912f-eca09a78e98b
                type:
                  type: string
                  description: The schema's type.
                  example: openapi:3
                files:
                  type: object
                  description: Information about the schema's files. The response is paginated and limited to one page.
                  properties:
                    data:
                      type: array
                      description: A list of the schema files.
                      items:
                        title: Schema File Base Data
                        description: Information about the schema file.
                        type: object
                        properties:
                          id:
                            type: string
                            description: The schema file's ID.
                            example: cf98c187-17c1-455f-afbf-d4be51f12770
                          name:
                            type: string
                            description: The schema file's name.
                            example: s1.json
                          path:
                            type: string
                            description: The file system path to the schema file.
                            example: dir/s1.json
                          createdAt:
                            type: string
                            format: date-time
                            description: The date and time at which the file was created.
                            example: '2023-03-16T18:38:56.000Z'
                          createdBy:
                            type: string
                            description: The user ID of the user that created the file.
                            example: '5000842'
                          updatedAt:
                            type: string
                            format: date-time
                            description: The date and time at which the file was last updated.
                            example: '2023-03-16T19:11:24.000Z'
                          updatedBy:
                            type: string
                            description: The user ID of the user that last updated the file.
                            example: '5000842'
                    meta:
                      type: object
                      properties:
                        nextPath:
                          type: string
                          description: The URL path to the next file.
                          example: /apis/1fdbff7c-036b-4f8a-91bc-17bf3ae74fd2/schemas/cf98c187-17c1-455f-afbf-d4be51f12770/files?cursor=eyJzY2hlbWUiOiJwYXRoX2FzYyIsImRpcmVjdGlvblR5cGUiOiJuZXh0IiwicGl2b3QiOiJwYXRoIiwidmFsdWUiOiJkaXIvczEuanNvbiJ9
                createdAt:
                  type: string
                  format: date-time
                  description: The date and time at which the schema was created.
                  example: '2022-03-29T11:37:15Z'
                createdBy:
                  type: string
                  description: The user ID of the user that created the schema.
                  example: '12345678'
                updatedAt:
                  type: string
                  format: date-time
                  description: The date and time at which the schema was last updated.
                  example: '2022-03-29T11:37:15Z'
                updatedBy:
                  type: string
                  description: The user ID of the user that last updated the schema.
                  example: '12345678'
            - type: object
              title: Get Bundled Schema
              description: Information about the schema.
              properties:
                id:
                  type: string
                  description: The schema's ID.
                  example: ae2b9ab2-28f2-401d-912f-eca09a78e98b
                type:
                  type: string
                  description: The schema's type.
                  example: openapi:3
                createdBy:
                  type: string
                  description: The user ID of the user that created the schema.
                  example: '12345678'
