  requestBodies:
    createUpdateApiSchemaFile:
      content:
        application/json:
          schema:
            type: object
            description: Information about schema file.
            properties:
              name:
                type: string
                description: The schema file's name.
                example: index.json
              root:
                type: object
                description: Information about the schema's root file.
                properties:
                  enabled:
                    type: boolean
                    description: If true, tag the file as the root file. You can only update the root tag for protobuf specifications.
                    example: true
              content:
                type: string
                description: The schema file's stringified contents.
                example: "{\n  \"openapi\": \"3.1.0\",\n  \"info\": {\n    \"version\": \"1.0.0\",\n    \"title\": \"Sample API\",\n    \"description\": \"Buy or rent spacecrafts\"\n  },\n  \"paths\": {\n    \"/spacecrafts/{spacecraftId}\": {\n      \"parameters\": [\n        {\n          \"name\": \"spacecraftId\",\n          \"description\": \"The unique identifier of the spacecraft\",\n          \"in\": \"path\",\n          \"required\": true,\n          \"schema\": {\n            \"$ref\": \"#/components/schemas/SpacecraftId\"\n          }\n        }\n      ],\n      \"get\": {\n        \"summary\": \"Read a spacecraft\",\n        \"responses\": {\n          \"200\": {\n            \"description\": \"The spacecraft corresponding to the provided `spacecraftId`\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/Spacecraft\"\n                }\n              }\n            }\n          },\n          \"404\": {\n            \"description\": \"No spacecraft found for the provided `spacecraftId`\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/Error\"\n                }\n              }\n            }\n          },\n          \"500\": {\n            \"description\": \"Unexpected error\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/Error\"\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"SpacecraftId\": {\n        \"description\": \"The unique identifier of a spacecraft\",\n        \"type\": \"string\"\n      },\n      \"Spacecraft\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"id\",\n          \"name\",\n          \"type\"\n        ],\n        \"properties\": {\n          \"id\": {\n            \"$ref\": \"#/components/schemas/SpacecraftId\"\n          },\n          \"name\": {\n            \"type\": \"string\"\n          },\n          \"type\": {\n            \"type\": \"string\",\n            \"enum\": [\n              \"capsule\",\n              \"probe\",\n              \"satellite\",\n              \"spaceplane\",\n              \"station\"\n            ]\n          },\n          \"description\": {\n            \"type\": \"string\"\n          }\n        }\n      },\n      \"Error\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"message\"\n        ],\n        \"properties\": {\n          \"message\": {\n            \"description\": \"A human readable error message\",\n            \"type\": \"string\"\n          }\n        }\n      }\n    },\n    \"securitySchemes\": {\n      \"ApiKey\": {\n        \"type\": \"apiKey\",\n        \"in\": \"header\",\n        \"name\": \"X-Api-Key\"\n      }\n    }\n  },\n  \"security\": [\n    {\n      \"ApiKey\": [\n\n      ]\n    }\n  ]\n}"
          examples:
            JSON Schema:
              $ref: '#/components/examples/updateJsonSchema'
            YAML Schema:
              $ref: '#/components/examples/updateYamlSchema'
            GraphQL Schema:
              $ref: '#/components/examples/updateGraphQlSchema'
            Update root Tag:
              value:
                root:
                  enabled: true
    createApiSchema:
      description: The request body to create an API schema.
      content:
        application/json:
          schema:
            description: Information about the API schema.
            title: Create API Schema
            type: object
            required:
            - type
            - files
            properties:
              type:
                type: string
                description: The schema's type.
                enum:
                - proto:2
                - proto:3
                - graphql
                - openapi:3_1
                - openapi:3
                - openapi:2
                - openapi:1
                - raml:1
                - raml:0_8
                - wsdl:2
                - wsdl:1
                - asyncapi:2
                example: openapi:3
              files:
                type: array
                description: The list of files that are part of the schema.
                items:
                  type: object
                  properties:
                    path:
                      type: string
                      description: The schema's file path.
                      example: index.json
                    root:
                      type: object
                      description: Information about the schema's root file.
                      properties:
                        enabled:
                          type: boolean
                          default: true
                          description: If true, tag the file as the root file. You can only update the root tag for protobuf specifications.
                          example: true
                    content:
                      type: string
                      description: The schema file's stringified contents.
          examples:
            Create JSON Schema:
              $ref: '#/components/examples/createJsonSchema'
            Create YAML Schema:
              $ref: '#/components/examples/createYamlSchema'
            Create GraphQL Schema:
              $ref: '#/components/examples/createGraphQlSchema'
            Create Schema with Proto:
              $ref: '#/components/examples/createProtoSchema'
  securitySchemes:
    PostmanApiKey:
      type: apiKey
      in: header
      name: x-api-key
    scimApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: A valid [SCIM API key](https://learning.postman.com/docs/administration/scim-provisioning/scim-provisioning-overview/#generating-scim-api-key) for calls to SCIM endpoints.
