          content: "type Query {\n  allPosts: [Post]\n  allUsers: [User]\n  postById(id: Int!): Post\n  userById(id: Int!): User\n}\n\ntype Mutation {\n  createPost(input: CreatePostInput!): CreatePostPayload\n  createUser(input: CreateUserInput!): CreateUserPayload\n}\n\ntype Post {\n  id: Int!\n  title: String\n  body: String\n  createdDate: Datetime\n  authorId: Int!\n  userByAuthorId: User\n}\n\ntype User {\n  id: Int!\n  username: String\n  createdDate: Datetime\n  postsByAuthorId: [Post]\n}\n\ntype CreatePostPayload {\n  clientMutationId: String\n  post: Post\n  userByAuthorId: User\n}\n\ninput CreatePostInput {\n  clientMutationId: String\n  post: PostInput!\n}\n\ninput PostInput {\n  id: Int\n  title: String\n  body: String\n  createdDate: Datetime\n  authorId: Int!\n}\n\ntype CreateUserPayload {\n  clientMutationId: String\n  user: User\n}\n\ninput CreateUserInput {\n  clientMutationId: String\n  user: UserInput!\n}\n\ninput UserInput {\n  id: Int\n  username: String\n  createdDate: Datetime\n}\n\nscalar Datetime\n"
    updateGraphQlSchema:
      value:
        content: "type Query {\n  allPosts: [Post]\n  allUsers: [User]\n  postById(id: Int!): Post\n  userById(id: Int!): User\n}\n\ntype Mutation {\n  createPost(input: CreatePostInput!): CreatePostPayload\n  createUser(input: CreateUserInput!): CreateUserPayload\n}\n\ntype Post {\n  id: Int!\n  title: String\n  body: String\n  createdDate: Datetime\n  authorId: Int!\n  userByAuthorId: User\n}\n\ntype User {\n  id: Int!\n  username: String\n  createdDate: Datetime\n  postsByAuthorId: [Post]\n}\n\ntype CreatePostPayload {\n  clientMutationId: String\n  post: Post\n  userByAuthorId: User\n}\n\ninput CreatePostInput {\n  clientMutationId: String\n  post: PostInput!\n}\n\ninput PostInput {\n  id: Int\n  title: String\n  body: String\n  createdDate: Datetime\n  authorId: Int!\n}\n\ntype CreateUserPayload {\n  clientMutationId: String\n  user: User\n}\n\ninput CreateUserInput {\n  clientMutationId: String\n  user: UserInput!\n}\n\ninput UserInput {\n  id: Int\n  username: String\n  createdDate: Datetime\n}\n\nscalar Datetime\n"
    api403ErrorForbidden:
