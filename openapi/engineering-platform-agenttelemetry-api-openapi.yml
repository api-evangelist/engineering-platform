openapi: 3.2.0
info:
  title: VSOnline Agent Telemetry API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: AgentTelemetry
paths:
  /api/v1/AgentTelemetry:
    post:
      tags:
      - AgentTelemetry
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Create api agent telemetry
      x-summary-source: derived
      operationId: postApiV1AgentTelemetry
      x-operation-id-source: derived
  /api/v1/AgentTelemetry/standalone:
    post:
      tags:
      - AgentTelemetry
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryData'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Create api agent telemetry standalone
      x-summary-source: derived
      operationId: postApiV1AgentTelemetryStandalone
      x-operation-id-source: derived
components:
  schemas:
    TelemetryData:
      type: object
      properties:
        time:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        level:
          type:
          - string
          - 'null'
        optionalValues:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
