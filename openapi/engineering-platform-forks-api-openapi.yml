  requestBodies:
    mergeEnvironmentFork:
      content:
        application/json:
          schema:
            required:
            - source
            type: object
            properties:
              source:
                type: string
                format: uid
                description: The source environment's unique ID to merge data from.
                example: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
              deleteSource:
                type: boolean
                default: false
                description: If true, the forked environment will be deleted.
                example: false
          example:
            source: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
            deleteSource: false
    pullEnvironment:
      content:
        application/json:
          schema:
            type: object
            properties:
              source:
                type: string
                format: uid
                description: The source environment's unique ID to pull data from.
                example: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
          example:
            source: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
    forkEnvironment:
      content:
        application/json:
          schema:
            type: object
            required:
            - forkName
            properties:
              forkName:
                type: string
                description: The forked environment's label.
                example: My fork
          examples:
            fork:
              value:
                forkName: My fork
    createCollectionFork:
      content:
        application/json:
          schema:
            type: object
            required:
            - label
            properties:
              label:
                type: string
                description: The fork's label.
                example: Test Fork
          example:
            label: Test Fork
    mergeCollectionFork:
      content:
        application/json:
          schema:
            required:
            - source
            - destination
            type: object
            properties:
              destination:
                type: string
                format: uid
                description: The destination (parent) collection's unique ID.
                example: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
              source:
                type: string
                format: uid
                description: The source collection's unique ID.
                example: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
              strategy:
                type: string
                description: 'The fork''s merge strategy:

                  - `deleteSource` — Merge the changes into the parent collection. After the merge process is complete, Postman deletes the fork. You must have Editor access to both the parent and forked collections.

                  - `updateSourceWithDestination` — Merge the changes into the parent collection. Any differences in the parent collection are also made to the fork.

                  '
                enum:
                - deleteSource
                - updateSourceWithDestination
                default: updateSourceWithDestination
                example: deleteSource
          example:
            strategy: deleteSource
            source: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
            destination: 12345678-09547fef-a9a5-4e00-998b-aa563e8db69a
