security:
- hmac: []
tags:
- name: Devices
paths:
  /accounts/{account_id}/devices:
    get:
      description: Fetches a list of enrolled devices.
      operationId: devices-list-devices
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_devices_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: List devices response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_devices_response'
          description: List devices response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List devices
      tags:
      - Devices
      x-api-token-group:
      - Teams Read
      - Teams Write
  /accounts/{account_id}/devices/{device_id}:
    get:
      description: Fetches details for a single device.
      operationId: devices-device-details
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_device_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get device details response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_response'
          description: Get device details response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get device details
      tags:
      - Devices
      x-api-token-group:
      - Teams Read
      - Teams Write
  /accounts/{account_id}/devices/{device_id}/override_codes:
    get:
      description: Fetches a one-time use admin override code for a device. This relies on the **Admin Override** setting being enabled in your device configuration.
      operationId: devices-list-admin-override-code-for-device
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_override_codes_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get an admin override code for a device response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_override_codes_response'
          description: Get an admin override code for a device response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get an admin override code for a device
      tags:
      - Devices
      x-api-token-group:
      - Teams Read
      - Teams Write
  /accounts/{account_id}/devices/policies:
    get:
      description: Fetches a list of the device settings profiles for an account.
      operationId: devices-list-device-settings-policies
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_device_settings_response_collection'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: List device settings profiles response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response_collection'
          description: List device settings profiles response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List device settings profiles
      tags:
      - Devices
      x-api-token-group:
      - Teams Read
      - Teams Write
  /accounts/{account_id}/devices/policy:
    get:
      description: Fetches the default device settings profile for an account.
      operationId: devices-get-default-device-settings-policy
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_default_device_settings_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get the default device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_default_device_settings_response'
          description: Get the default device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get the default device settings profile
      tags:
      - Devices
      x-api-token-group:
      - Teams Read
      - Teams Write
    patch:
      description: Updates the default device settings profile for an account.
      operationId: devices-update-default-device-settings-policy
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                allow_mode_switch:
                  $ref: '#/components/schemas/teams-devices_allow_mode_switch'
                allow_updates:
                  $ref: '#/components/schemas/teams-devices_allow_updates'
                allowed_to_leave:
                  $ref: '#/components/schemas/teams-devices_allowed_to_leave'
                auto_connect:
                  $ref: '#/components/schemas/teams-devices_auto_connect'
                captive_portal:
                  $ref: '#/components/schemas/teams-devices_captive_portal'
                disable_auto_fallback:
                  $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
                exclude_office_ips:
                  $ref: '#/components/schemas/teams-devices_exclude_office_ips'
                service_mode_v2:
                  $ref: '#/components/schemas/teams-devices_service_mode_v2'
                support_url:
                  $ref: '#/components/schemas/teams-devices_support_url'
                switch_locked:
                  $ref: '#/components/schemas/teams-devices_switch_locked'
                tunnel_protocol:
                  $ref: '#/components/schemas/teams-devices_tunnel_protocol'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_default_device_settings_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Update the default device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_default_device_settings_response'
          description: Update the default device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update the default device settings profile
      tags:
      - Devices
      x-api-token-group:
      - Teams Write
    post:
      description: Creates a device settings profile to be applied to certain devices matching the criteria.
      operationId: devices-create-device-settings-policy
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                allow_mode_switch:
                  $ref: '#/components/schemas/teams-devices_allow_mode_switch'
                allow_updates:
                  $ref: '#/components/schemas/teams-devices_allow_updates'
                allowed_to_leave:
                  $ref: '#/components/schemas/teams-devices_allowed_to_leave'
                auto_connect:
                  $ref: '#/components/schemas/teams-devices_auto_connect'
                captive_portal:
                  $ref: '#/components/schemas/teams-devices_captive_portal'
                description:
                  $ref: '#/components/schemas/teams-devices_schemas-description'
                disable_auto_fallback:
                  $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
                enabled:
                  description: Whether the policy will be applied to matching devices.
                  example: true
                  type: boolean
                exclude_office_ips:
                  $ref: '#/components/schemas/teams-devices_exclude_office_ips'
                lan_allow_minutes:
                  $ref: '#/components/schemas/teams-devices_lan_allow_minutes'
                lan_allow_subnet_size:
                  $ref: '#/components/schemas/teams-devices_lan_allow_subnet_size'
                match:
                  $ref: '#/components/schemas/teams-devices_schemas-match'
                name:
                  description: The name of the device settings profile.
                  example: Allow Developers
                  maxLength: 100
                  type: string
                precedence:
                  $ref: '#/components/schemas/teams-devices_precedence'
                service_mode_v2:
                  $ref: '#/components/schemas/teams-devices_service_mode_v2'
                support_url:
                  $ref: '#/components/schemas/teams-devices_support_url'
                switch_locked:
                  $ref: '#/components/schemas/teams-devices_switch_locked'
                tunnel_protocol:
                  $ref: '#/components/schemas/teams-devices_tunnel_protocol'
              required:
              - name
              - precedence
              - match
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_device_settings_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Create a device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response'
          description: Create a device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create a device settings profile
      tags:
      - Devices
      x-api-token-group:
      - Teams Write
  /accounts/{account_id}/devices/policy/{policy_id}:
    delete:
      description: Deletes a device settings profile and fetches a list of the remaining profiles for an account.
      operationId: devices-delete-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_device_settings_response_collection'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Delete a device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response_collection'
          description: Delete a device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete a device settings profile
      tags:
      - Devices
    get:
      description: Fetches a device settings profile by ID.
      operationId: devices-get-device-settings-policy-by-id
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_device_settings_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get device settings profile by ID response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response'
          description: Get device settings profile by ID response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get device settings profile by ID
      tags:
      - Devices
    patch:
      description: Updates a configured device settings profile.
      operationId: devices-update-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                allow_mode_switch:
                  $ref: '#/components/schemas/teams-devices_allow_mode_switch'
                allow_updates:
                  $ref: '#/components/schemas/teams-devices_allow_updates'
                allowed_to_leave:
                  $ref: '#/components/schemas/teams-devices_allowed_to_leave'
                auto_connect:
                  $ref: '#/components/schemas/teams-devices_auto_connect'
                captive_portal:
                  $ref: '#/components/schemas/teams-devices_captive_portal'
                description:
                  $ref: '#/components/schemas/teams-devices_schemas-description'
                disable_auto_fallback:
                  $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
                enabled:
                  description: Whether the policy will be applied to matching devices.
                  example: true
                  type: boolean
                exclude_office_ips:
                  $ref: '#/components/schemas/teams-devices_exclude_office_ips'
                match:
                  $ref: '#/components/schemas/teams-devices_schemas-match'
                name:
                  description: The name of the device settings profile.
                  example: Allow Developers
                  maxLength: 100
                  type: string
                precedence:
                  $ref: '#/components/schemas/teams-devices_precedence'
                service_mode_v2:
                  $ref: '#/components/schemas/teams-devices_service_mode_v2'
                support_url:
                  $ref: '#/components/schemas/teams-devices_support_url'
                switch_locked:
                  $ref: '#/components/schemas/teams-devices_switch_locked'
                tunnel_protocol:
                  $ref: '#/components/schemas/teams-devices_tunnel_protocol'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_device_settings_response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Update a device settings profile Policy response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response'
          description: Update a device settings profile Policy response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update a device settings profile
      tags:
      - Devices
  /accounts/{account_id}/devices/policy/{policy_id}/exclude:
    get:
      description: Fetches the list of routes excluded from the WARP client's tunnel for a specific device settings profile.
      operationId: devices-get-split-tunnel-exclude-list-for-a-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get the Split Tunnel exclude list for a device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
          description: Get the Split Tunnel exclude list for a device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get the Split Tunnel exclude list for a device settings profile
      tags:
      - Devices
    put:
      description: Sets the list of routes excluded from the WARP client's tunnel for a specific device settings profile.
      operationId: devices-set-split-tunnel-exclude-list-for-a-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/teams-devices_split_tunnel'
              type: array
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Set the Split Tunnel exclude list for a device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
          description: Set the Split Tunnel exclude list for a device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Set the Split Tunnel exclude list for a device settings profile
      tags:
      - Devices
  /accounts/{account_id}/devices/policy/{policy_id}/fallback_domains:
    get:
      description: Fetches the list of domains to bypass Gateway DNS resolution from a specified device settings profile. These domains will use the specified local DNS resolver instead.
      operationId: devices-get-local-domain-fallback-list-for-a-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get the Local Domain Fallback list for a device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
          description: Get the Local Domain Fallback list for a device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get the Local Domain Fallback list for a device settings profile
      tags:
      - Devices
    put:
      description: Sets the list of domains to bypass Gateway DNS resolution. These domains will use the specified local DNS resolver instead. This will only apply to the specified device settings profile.
      operationId: devices-set-local-domain-fallback-list-for-a-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/teams-devices_fallback_domain'
              type: array
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Set the Local Domain Fallback list for a device settings profile response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
          description: Set the Local Domain Fallback list for a device settings profile response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Set the Local Domain Fallback list for a device settings profile
      tags:
      - Devices
  /accounts/{account_id}/devices/policy/{policy_id}/include:
    get:
      description: Fetches the list of routes included in the WARP client's tunnel for a specific device settings profile.
      operationId: devices-get-split-tunnel-include-list-for-a-device-settings-policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
