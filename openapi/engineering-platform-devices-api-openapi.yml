components:
  schemas:
    teams-devices_schemas-match:
      description: The wirefilter expression to match devices.
      example: user.identity == "test@cloudflare.com"
      maxLength: 500
      type: string
    teams-devices_unrevoke_devices_request:
      description: A list of device ids to unrevoke.
      items:
        $ref: '#/components/schemas/teams-devices_schemas-uuid'
      maxLength: 200
      type: array
    teams-devices_manufacturer:
      description: The device manufacturer name.
      example: My phone corp
      type: string
    teams-devices_result_info:
      properties:
        count:
          description: Total number of results for the requested service
          example: 1
          type: number
        page:
          description: Current page within paginated list of results
          example: 1
          type: number
        per_page:
          description: Number of results per page of results
          example: 20
          type: number
        total_count:
          description: Total results available without any search parameters
          example: 2000
          type: number
      type: object
    teams-devices_mac_address:
      description: The device mac address.
      example: 00-00-5E-00-53-00
      type: string
    teams-devices_fallback_domains:
      items:
        $ref: '#/components/schemas/teams-devices_fallback_domain'
      type: array
    teams-devices_model:
      description: The device model name.
      example: MyPhone(pro-X)
      type: string
    teams-devices_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/teams-devices_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/teams-devices_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    teams-devices_default:
      description: Whether the policy is the default policy for an account.
      example: false
      type: boolean
    teams-devices_schemas-description:
      description: A description of the policy.
      example: Policy for test teams.
      maxLength: 500
      type: string
    teams-devices_exclude_office_ips:
      description: Whether to add Microsoft IPs to Split Tunnel exclusions.
      example: true
      type: boolean
    teams-devices_allow_mode_switch:
      description: Whether to allow the user to switch WARP between modes.
      example: true
      type: boolean
    teams-devices_serial_number:
      description: The device serial number.
      example: EXAMPLEHMD6R
      type: string
    teams-devices_split_tunnel_include_response_collection:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-collection'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/teams-devices_split_tunnel_include'
            type: array
    teams-devices_precedence:
      description: The precedence of the policy. Lower values indicate higher precedence. Policies will be evaluated in ascending order of this field.
      example: 100
      type: number
    teams-devices_auto_connect:
      description: The amount of time in minutes to reconnect after having been disabled.
      example: 0
      type: number
    teams-devices_captive_portal:
      description: Turn on the captive portal after the specified amount of time.
      example: 180
      type: number
    teams-devices_override_codes_response:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-collection'
      - properties:
          result:
            properties:
              disable_for_time:
                $ref: '#/components/schemas/teams-devices_disable_for_time'
            type: object
    teams-devices_revoked_at:
      description: When the device was revoked.
      example: '2017-06-14T00:00:00Z'
      format: date-time
      type: string
    teams-devices_email:
      description: The contact email address of the user.
      example: user@example.com
      maxLength: 90
      type: string
    teams-devices_split_tunnel_response_collection:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-collection'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/teams-devices_split_tunnel'
            type: array
    teams-devices_disable_for_time:
      properties:
        '1':
          description: Override code that is valid for 1 hour.
          example: '9106681'
        '3':
          description: Override code that is valid for 3 hours.
          example: '5356247'
        '6':
          description: Override code that is valid for 6 hours.
          example: '9478972'
        '12':
          description: Override code that is valid for 12 hour2.
          example: '3424359'
        '24':
          description: Override code that is valid for 24 hour.2.
          example: '2887634'
      type: object
    teams-devices_switch_locked:
      description: Whether to allow the user to turn off the WARP switch and disconnect the client.
      example: true
      type: boolean
    teams-devices_updated:
      description: When the device was updated.
      example: '2017-06-14T00:00:00Z'
      format: date-time
      type: string
    teams-devices_fallback_domain_response_collection:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-collection'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/teams-devices_fallback_domain'
            type: array
    teams-devices_ip:
      description: IPv4 or IPv6 address.
      example: 1.1.1.1
      type: string
    teams-devices_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/teams-devices_messages'
        messages:
          $ref: '#/components/schemas/teams-devices_messages'
        result:
          anyOf:
          - type: object
          - items: {}
            type: array
          - type: string
        success:
          description: Whether the API call was successful.
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    teams-devices_split_tunnel:
      properties:
        address:
          description: The address in CIDR format to exclude from the tunnel. If `address` is present, `host` must not be present.
          example: 192.0.2.0/24
          type: string
        description:
          description: A description of the Split Tunnel item, displayed in the client UI.
          example: Exclude testing domains from the tunnel
          maxLength: 100
          type: string
        host:
          description: The domain name to exclude from the tunnel. If `host` is present, `address` must not be present.
          example: '*.example.com'
          type: string
      required:
      - address
      - description
      type: object
    teams-devices_api-response-collection:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-common'
      - properties:
          result:
            items: {}
            nullable: true
            type: array
          result_info:
            $ref: '#/components/schemas/teams-devices_result_info'
      type: object
    teams-devices_default_device_settings_policy:
      properties:
        allow_mode_switch:
          $ref: '#/components/schemas/teams-devices_allow_mode_switch'
        allow_updates:
          $ref: '#/components/schemas/teams-devices_allow_updates'
        allowed_to_leave:
          $ref: '#/components/schemas/teams-devices_allowed_to_leave'
        auto_connect:
          $ref: '#/components/schemas/teams-devices_auto_connect'
        captive_portal:
          $ref: '#/components/schemas/teams-devices_captive_portal'
        default:
          description: Whether the policy will be applied to matching devices.
          example: true
          type: boolean
        disable_auto_fallback:
          $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
        enabled:
          description: Whether the policy will be applied to matching devices.
          example: true
          type: boolean
        exclude:
          $ref: '#/components/schemas/teams-devices_exclude'
        exclude_office_ips:
          $ref: '#/components/schemas/teams-devices_exclude_office_ips'
        fallback_domains:
          $ref: '#/components/schemas/teams-devices_fallback_domains'
        gateway_unique_id:
          $ref: '#/components/schemas/teams-devices_gateway_unique_id'
        include:
          $ref: '#/components/schemas/teams-devices_include'
        service_mode_v2:
          $ref: '#/components/schemas/teams-devices_service_mode_v2'
        support_url:
          $ref: '#/components/schemas/teams-devices_support_url'
        switch_locked:
