      minimum: 0
    ProvisionedConcurrencyStatusEnum:
      type: string
      enum:
      - IN_PROGRESS
      - READY
      - FAILED
    Timestamp:
      type: string
    ServiceException: {}
    String:
      type: string
    TooManyRequestsException: {}
    PositiveInteger:
      type: integer
      minimum: 1
    FunctionArn:
      type: string
      pattern: arn:(aws[a-zA-Z-]*)?:lambda:[a-z]{2}(-gov)?-[a-z]+-\d{1}:\d{12}:function:[a-zA-Z0-9-_]+(:(\$LATEST|[a-zA-Z0-9-_]+))?
    ListProvisionedConcurrencyConfigsResponse:
