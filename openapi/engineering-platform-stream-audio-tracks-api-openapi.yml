tags:
- name: Stream Audio Tracks
paths:
  /accounts/{account_id}/stream/{identifier}/audio:
    get:
      description: Lists additional audio tracks on a video. Note this API will not return information for audio attached to the video upload.
      operationId: list-audio-tracks
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Lists additional audio tracks on a video response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_listAudioTrackResponse'
          description: Lists additional audio tracks on a video
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform List additional audio tracks on a video
      tags:
      - Stream Audio Tracks
  /accounts/{account_id}/stream/{identifier}/audio/{audio_identifier}:
    delete:
      description: Deletes additional audio tracks on a video. Deleting a default audio track is not allowed. You must assign another audio track as default prior to deletion.
      operationId: delete-audio-tracks
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: audio_identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_audio_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_deleted_response'
          description: Deletes additional audio tracks on a video response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_deleted_response'
          description: Deletes additional audio tracks on a video
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Delete additional audio tracks on a video
      tags:
      - Stream Audio Tracks
    patch:
      description: Edits additional audio tracks on a video. Editing the default status of an audio track to `true` will mark all other audio tracks on the video default status to `false`.
      operationId: edit-audio-tracks
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: audio_identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_audio_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stream_editAudioTrack'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Edits additional audio tracks on a video response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_addAudioTrackResponse'
          description: Edits additional audio tracks on a video
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Edit additional audio tracks on a video
      tags:
      - Stream Audio Tracks
  /accounts/{account_id}/stream/{identifier}/audio/copy:
    post:
      description: Adds an additional audio track to a video using the provided audio track URL.
      operationId: add-audio-track
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stream_copyAudioTrack'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Add audio tracks to a video response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_addAudioTrackResponse'
          description: Add audio tracks to a video
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Add audio tracks to a video
      tags:
      - Stream Audio Tracks
components:
  schemas:
    stream_listAudioTrackResponse:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/stream_additionalAudio'
            type: array
    stream_copyAudioTrack:
      properties:
        label:
          $ref: '#/components/schemas/stream_audio_label'
        url:
          description: An audio track URL. The server must be publicly routable and support `HTTP HEAD` requests and `HTTP GET` range requests. The server should respond to `HTTP HEAD` requests with a `content-range` header that includes the size of the file.
          example: https://www.examplestorage.com/audio_file.mp3
          format: uri
          type: string
      required:
      - label
      type: object
    stream_audio_label:
      description: A string to uniquely identify the track amongst other audio track labels for the specified video.
      example: director commentary
      type: string
    stream_editAudioTrack:
      properties:
        default:
          $ref: '#/components/schemas/stream_audio_default'
        label:
          $ref: '#/components/schemas/stream_audio_label'
      type: object
    stream_audio_identifier:
      description: The unique identifier for an additional audio track.
      example: ea95132c15732412d22c1476fa83f27a
      maxLength: 32
      type: string
    stream_account_identifier:
      description: The account identifier tag.
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    stream_audio_default:
      default: false
      description: Denotes whether the audio track will be played by default in a player.
      type: boolean
    stream_deleted_response:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-single'
      - properties:
          result:
            example: ok
            type: string
    stream_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/stream_messages'
        messages:
          $ref: '#/components/schemas/stream_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    stream_addAudioTrackResponse:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/stream_additionalAudio'
    stream_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/stream_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/stream_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    stream_audio_state:
      description: Specifies the processing status of the video.
      enum:
      - queued
      - ready
      - error
      type: string
    stream_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    stream_additionalAudio:
      properties:
        default:
          $ref: '#/components/schemas/stream_audio_default'
        label:
          $ref: '#/components/schemas/stream_audio_label'
        status:
          $ref: '#/components/schemas/stream_audio_state'
        uid:
          $ref: '#/components/schemas/stream_identifier'
    stream_api-response-single:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      type: object
    stream_identifier:
      description: A Cloudflare-generated unique identifier for a media item.
      example: ea95132c15732412d22c1476fa83f27a
      maxLength: 32
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/apigateway/
x-hasEquivalentPaths: true
