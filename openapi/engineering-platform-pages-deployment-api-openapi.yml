security:
- hmac: []
tags:
- name: Pages Deployment
paths:
  /accounts/{account_id}/pages/projects/{project_name}/deployments:
    get:
      description: Fetch a list of project deployments.
      operationId: pages-deployment-get-deployments
      parameters:
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      - in: query
        name: env
        schema:
          description: What type of deployments to fetch.
          enum:
          - production
          - preview
          example: preview
          type: string
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_deployment-list-response'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Get deployments response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_deployment-list-response'
          description: Get deployments response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get deployments
      tags:
      - Pages Deployment
    post:
      description: Start a new deployment from production. The repository and account must have already been authorized on the Cloudflare Pages dashboard.
      operationId: pages-deployment-create-deployment
      parameters:
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                branch:
                  description: The branch to build the new deployment from. The `HEAD` of the branch will be used. If omitted, the production branch will be used by default.
                  example: staging
                  type: string
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_deployment-new-deployment'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Create deployment response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_deployment-new-deployment'
          description: Create deployment response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create deployment
      tags:
      - Pages Deployment
  /accounts/{account_id}/pages/projects/{project_name}/deployments/{deployment_id}:
    delete:
      description: Delete a deployment.
      operationId: pages-deployment-delete-deployment
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - example:
                    errors: []
                    messages: []
                    result: null
                    success: true
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Delete deployment response failure.
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_api-response-common'
                - properties:
                    result:
                      nullable: true
                      type: object
                  type: object
          description: Delete deployment response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete deployment
      tags:
      - Pages Deployment
    get:
      description: Fetch information about a deployment.
      operationId: pages-deployment-get-deployment-info
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_deployment-response-details'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Get deployment info response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_deployment-response-details'
          description: Get deployment info response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get deployment info
      tags:
      - Pages Deployment
  /accounts/{account_id}/pages/projects/{project_name}/deployments/{deployment_id}/history/logs:
    get:
      description: Fetch deployment logs for a project.
      operationId: pages-deployment-get-deployment-logs
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_deployment-response-logs'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Get deployment logs response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_deployment-response-logs'
          description: Get deployment logs response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get deployment logs
      tags:
      - Pages Deployment
  /accounts/{account_id}/pages/projects/{project_name}/deployments/{deployment_id}/retry:
    post:
      description: Retry a previous deployment.
      operationId: pages-deployment-retry-deployment
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_deployment-new-deployment'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Retry deployment response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_deployment-new-deployment'
          description: Retry deployment response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Retry deployment
      tags:
      - Pages Deployment
  /accounts/{account_id}/pages/projects/{project_name}/deployments/{deployment_id}/rollback:
    post:
      description: Rollback the production deployment to a previous deployment. You can only rollback to succesful builds on production.
      operationId: pages-deployment-rollback-deployment
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      - in: path
        name: project_name
        required: true
        schema:
          $ref: '#/components/schemas/pages_project_name'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/pages_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pages_deployment-response-details'
                - $ref: '#/components/schemas/pages_api-response-common-failure'
          description: Rollback deployment response failure.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pages_deployment-response-details'
          description: Rollback deployment response.
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Rollback deployment
      tags:
      - Pages Deployment
components:
  schemas:
    pages_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/pages_messages'
          example:
          - code: 7003
            message: No route for the URI.
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/pages_messages'
          example: []
        result:
          nullable: true
          type: object
        success:
          description: Whether the API call was successful.
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    pages_deployment-response-details:
      allOf:
      - $ref: '#/components/schemas/pages_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/pages_deployments'
    pages_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/pages_messages'
        messages:
          $ref: '#/components/schemas/pages_messages'
        success:
          description: Whether the API call was successful
          enum:
          - false
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    pages_deployment-response-logs:
      allOf:
      - $ref: '#/components/schemas/pages_api-response-common'
      - properties:
          result:
            example:
              data:
              - line: Cloning repository...
                ts: '2021-04-20T19:35:29.0749819Z'
              - line: From https://github.com/cloudflare/example
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: ' * branch            209c5bb11d89533f426b2f8469bcae12fdccf71b -> FETCH_HEAD'
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: ''
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: HEAD is now at 209c5bb Update index.html
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: ''
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: ''
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: 'Success: Finished cloning repository files'
                ts: '2021-04-20T19:35:30.0749819Z'
              - line: Installing dependencies
                ts: '2021-04-20T19:35:59.0749819Z'
              - line: Python version set to 2.7
