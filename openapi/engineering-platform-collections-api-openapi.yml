                uid: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
              item:
              - name: Test F
                id: ff460862-473c-41b8-8be4-a493041c3351
                protocolProfileBehavior:
                  disableBodyPruning: true
                request:
                  method: POST
                  header: []
                  url:
                    raw: ''
                response: []
                uid: 12345678-ff460862-473c-41b8-8be4-a493041c3351
