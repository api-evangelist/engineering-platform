openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Workers AI Finetune API
  version: 4.0.0
tags:
- name: Workers AI Finetune
paths:
  /accounts/{account_id}/ai/finetunes:
    get:
      operationId: workers-ai-list-finetunes
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      created_at:
                        format: date-time
                        type: string
                      description:
                        type: string
                      id:
                        format: uuid
                        type: string
                      model:
                        type: string
                      modified_at:
                        format: date-time
                        type: string
                      name:
                        type: string
                    required:
                    - id
                    - model
                    - name
                    - created_at
                    - modified_at
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - result
                type: object
          description: Returns all finetunes
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List Finetunes
      tags:
      - Workers AI Finetune
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
    post:
      operationId: workers-ai-create-finetune
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                model:
                  type: string
                name:
                  type: string
                public:
                  type: boolean
              required:
              - model
              - name
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      created_at:
                        format: date-time
                        type: string
                      description:
                        type: string
                      id:
                        format: uuid
                        type: string
                      model:
                        type: string
                      modified_at:
                        format: date-time
                        type: string
                      name:
                        type: string
                      public:
                        type: boolean
                    required:
                    - id
                    - created_at
                    - modified_at
                    - public
                    - name
                    - model
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - result
                type: object
          description: Returns the created finetune
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    type: string
                  success:
                    type: boolean
                required:
                - errors
                - success
                type: object
          description: Finetune creation failed
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create a new Finetune
      tags:
      - Workers AI Finetune
      x-api-token-group:
      - Workers AI Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/ai/finetunes/{finetune_id}/finetune-assets:
    post:
      operationId: workers-ai-upload-finetune-asset
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      - in: path
        name: finetune_id
        required: true
        schema:
          example: bc451aef-f723-4b26-a6b2-901afd2e7a8a
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
                file_name:
                  type: string
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      bucket_name:
                        type: string
                      created_at:
                        format: date-time
                        type: string
                      file_name:
                        type: string
                      finetune_id:
                        example: bc451aef-f723-4b26-a6b2-901afd2e7a8a
                        type: string
                      id:
                        format: uuid
                        type: string
                      modified_at:
                        format: date-time
                        type: string
                    required:
                    - id
                    - finetune_id
                    - file_name
                    - bucket_name
                    - created_at
                    - modified_at
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - result
                type: object
          description: Returns the created finetune asset
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    type: string
                  success:
                    type: boolean
                required:
                - errors
                - success
                type: object
          description: Finetune creation failed
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Upload a Finetune Asset
      tags:
      - Workers AI Finetune
      x-api-token-group:
      - Workers AI Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/ai/finetunes/public:
    get:
      operationId: workers-ai-list-public-finetunes
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      - description: Pagination Limit
        in: query
        name: limit
        schema:
          description: Pagination Limit
          type: number
      - description: Pagination Offset
        in: query
        name: offset
        schema:
          description: Pagination Offset
          type: number
      - description: Order By Column Name
        in: query
        name: orderBy
        schema:
          description: Order By Column Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    items:
                      properties:
                        created_at:
                          format: date-time
                          type: string
                        description:
                          type: string
                        id:
                          format: uuid
                          type: string
                        model:
                          type: string
                        modified_at:
                          format: date-time
                          type: string
                        name:
                          type: string
                        public:
                          type: boolean
                      required:
                      - id
                      - model
                      - name
                      - public
                      - created_at
                      - modified_at
                      type: object
                    type: array
                  success:
                    type: boolean
                required:
                - success
                - result
                type: object
          description: Returns all public finetunes
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List Public Finetunes
      tags:
      - Workers AI Finetune
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
components:
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
