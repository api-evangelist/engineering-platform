      content:
        application/json:
          schema:
            type: object
            properties:
              schemas:
                type: array
                description: The [SCIM schema URI](https://www.iana.org/assignments/scim/scim.xhtml).
                items:
                  type: string
                  example: urn:ietf:params:scim:api:messages:2.0:PatchOp
              Operations:
                type: array
                description: Information about the group update operation.
                items:
                  type: object
                  properties:
                    op:
                      type: string
                      description: The operation to perform.
                      enum:
                      - replace
                      - remove
                      - add
                      example: replace
                    path:
                      type: string
                      description: The operation's path. Include this value when you update a group's members.
                      example: members
                    value:
                      type: object
                      description: The performed operation's value.
                      properties:
                        id:
                          type: string
                          description: The group's ID.
                          example: 561631fq14ed41872a8eea4c8aa2b38cda9749812cc55c00
                        displayName:
                          type: string
                          description: The group's name.
                          example: Test-API
          example:
            schemas:
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
            Operations:
            - op: replace
              value:
                id: 561631fq14ed41872a8eea4c8aa2b38cda9749812cc55c00
                displayName: Test-API
    updateScimUser:
      content:
        application/json:
          schema:
            type: object
            properties:
              schemas:
                type: array
                description: The [SCIM schema URI](https://www.iana.org/assignments/scim/scim.xhtml).
                items:
                  type: string
                  example: urn:ietf:params:scim:schemas:core:2.0:User
              name:
                type: object
                description: Information about the user's name.
                properties:
                  givenName:
                    type: string
                    description: The user's first name.
                    example: Taylor
                  familyName:
                    type: string
                    description: The user's last name.
                    example: Lee
          example:
            schemas:
            - urn:ietf:params:scim:schemas:core:2.0:User
            name:
              givenName: Taylor
              familyName: Lee
    updateScimUserState:
      content:
        application/json:
          schema:
            type: object
            properties:
              schemas:
                type: array
                description: The [SCIM schema URI](https://www.iana.org/assignments/scim/scim.xhtml).
                items:
                  type: string
                  example: urn:ietf:params:scim:api:messages:2.0:PatchOp
              Operations:
                type: array
                description: Information about the user update operation.
                items:
                  type: object
                  properties:
                    op:
                      type: string
                      description: The operation to perform.
                      enum:
                      - replace
                      example: replace
                    value:
                      type: object
                      description: The performed operation's value.
                      properties:
                        active:
                          type: boolean
                          description: 'Sets the user''s `active` state:

                            - `true` — Activates the user. This lets them authenticate in to your Postman team.

                            - `false` — Removes the user from your Postman team and deactivates the account. This blocks the user from authenticating in to Postman.

                            '
                          example: true
          example:
            schemas:
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
            Operations:
            - op: replace
              value:
                active: true
