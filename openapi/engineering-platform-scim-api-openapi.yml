            properties:
              schemas:
                type: array
                description: The [SCIM schema URI](https://www.iana.org/assignments/scim/scim.xhtml).
                items:
                  type: string
                  example: urn:ietf:params:scim:schemas:core:2.0:Group
              displayName:
                type: string
                description: The group's display name.
                example: Test-API
              members:
                type: array
                items:
                  type: object
                  description: An object containing the SCIM users to assign to the group.
                  properties:
                    value:
                      type: string
                      description: The user's SCIM ID.
                      example: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
                    display:
                      type: string
                      description: The user's display name.
                      example: Taylor Lee
          example:
            schemas:
            - urn:ietf:params:scim:schemas:core:2.0:Group
            displayName: Test-API
            members:
            - value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
              displayName: Taylor Lee
    createScimUser:
      content:
        application/json:
          schema:
            type: object
            properties:
              schemas:
                type: array
                description: The [SCIM schema URI](https://www.iana.org/assignments/scim/scim.xhtml).
                items:
                  type: string
                  example: urn:ietf:params:scim:schemas:core:2.0:User
              userName:
                type: string
                description: The user's username.
                example: taylor.lee@example.com
              active:
                type: boolean
                description: If true, activates the user. This lets them authenticate in to your Postman team.
                example: true
              externalId:
                type: string
                description: The user's external ID.
                example: '12345678'
              groups:
                type: array
                description: A list of groups to assign the user to.
                items:
                  type: string
                  example: Test Group
              locale:
                type: string
                description: The user's [IETF language tag](https://datatracker.ietf.org/doc/html/rfc5646).
                example: en-US
              name:
                type: object
                description: Information about the user's name.
                properties:
                  givenName:
                    type: string
                    description: The user's first name.
                    example: Taylor
                  familyName:
                    type: string
                    description: The user's last name.
                    example: Lee
          example:
            schemas:
            - urn:ietf:params:scim:schemas:core:2.0:User
            userName: taylor.lee@example.com
            name:
              givenName: Taylor
              familyName: Lee
            displayName: Taylor Lee
            locale: en-US
            groups:
            - Test Group
            active: true
