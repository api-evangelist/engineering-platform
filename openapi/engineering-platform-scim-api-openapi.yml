      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            description: Information about Postman's SCIM API configurations and supported operations.
            properties:
              schemas:
                type: array
                description: The [SCIM schema URI](https://www.iana.org/assignments/scim/scim.xhtml).
