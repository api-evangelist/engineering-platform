tags:
- name: Stream Videos
paths:
  /accounts/{account_id}/stream:
    get:
      description: Lists up to 1000 videos from a single request. For a specific range, refer to the optional parameters.
      operationId: stream-videos-list-videos
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/stream_media_state'
      - in: query
        name: creator
        schema:
          $ref: '#/components/schemas/stream_creator'
      - in: query
        name: type
        schema:
          $ref: '#/components/schemas/stream_type'
      - in: query
        name: asc
        schema:
          $ref: '#/components/schemas/stream_asc'
      - in: query
        name: search
        schema:
          $ref: '#/components/schemas/stream_search'
      - in: query
        name: start
        schema:
          $ref: '#/components/schemas/stream_start'
      - in: query
        name: end
        schema:
          $ref: '#/components/schemas/stream_end'
      - in: query
        name: include_counts
        schema:
          $ref: '#/components/schemas/stream_include_counts'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: List videos response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_video_response_collection'
          description: List videos response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform List videos
      tags:
      - Stream Videos
      x-api-token-group:
      - Stream Write
      - Stream Read
    post:
      description: Initiates a video upload using the TUS protocol. On success, the server responds with a status code 201 (created) and includes a `location` header to indicate where the content should be uploaded. Refer to https://tus.io for protocol details.
      operationId: stream-videos-initiate-video-uploads-using-tus
      parameters:
      - in: header
        name: Tus-Resumable
        required: true
        schema:
          $ref: '#/components/schemas/stream_tus_resumable'
      - in: header
        name: Upload-Creator
        schema:
          $ref: '#/components/schemas/stream_creator'
      - in: header
        name: Upload-Length
        required: true
        schema:
          $ref: '#/components/schemas/stream_upload_length'
      - in: header
        name: Upload-Metadata
        schema:
          $ref: '#/components/schemas/stream_upload_metadata'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json: {}
          description: Initiate video uploads using TUS response failure
        '200':
          content:
            application/json: {}
          description: Initiate video uploads using TUS response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Initiate video uploads using TUS
      tags:
      - Stream Videos
      x-api-token-group:
      - Stream Write
  /accounts/{account_id}/stream/{identifier}:
    delete:
      description: Deletes a video and its copies from Cloudflare Stream.
      operationId: stream-videos-delete-video
      parameters:
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json: {}
          description: Delete video response failure
        '200':
          content:
            application/json: {}
          description: Delete video response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Delete video
      tags:
      - Stream Videos
      x-api-token-group:
      - Stream Write
    get:
      description: Fetches details for a single video.
      operationId: stream-videos-retrieve-video-details
      parameters:
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Retrieve video details response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_video_response_single'
          description: Retrieve video details response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Retrieve video details
      tags:
      - Stream Videos
      x-api-token-group:
      - Stream Write
      - Stream Read
    post:
      description: Edit details for a single video.
      operationId: stream-videos-update-video-details
      parameters:
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stream_video_update'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Edit video details response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_video_response_single'
          description: Edit video details response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Edit video details
      tags:
      - Stream Videos
  /accounts/{account_id}/stream/{identifier}/embed:
    get:
      description: Fetches an HTML code snippet to embed a video in a web page delivered through Cloudflare. On success, returns an HTML fragment for use on web pages to display a video. On failure, returns a JSON response body.
      operationId: stream-videos-retreieve-embed-code-html
      parameters:
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Retreieve embed Code HTML response failure
        '200':
          content:
            application/json:
              schema:
                example: <stream id="ea95132c15732412d22c1476fa83f27a"></stream><script data-cfasync="false" defer type="text/javascript" src="https://embed.cloudflarestream.com/embed/we4g.fla9.latest.js"></script>
          description: Retreieve embed Code HTML response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Retrieve embed Code HTML
      tags:
      - Stream Videos
  /accounts/{account_id}/stream/{identifier}/token:
    post:
      description: Creates a signed URL token for a video. If a body is not provided in the request, a token is created with default values.
      operationId: stream-videos-create-signed-url-tokens-for-videos
      parameters:
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stream_signed_token_request'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Create signed URL tokens for videos response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_signed_token_response'
          description: Create signed URL tokens for videos response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Create signed URL tokens for videos
      tags:
      - Stream Videos
  /accounts/{account_id}/stream/copy:
    post:
      description: Uploads a video to Stream from a provided URL.
      operationId: stream-videos-upload-videos-from-a-url
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: header
        name: Upload-Creator
        schema:
          $ref: '#/components/schemas/stream_creator'
      - in: header
        name: Upload-Metadata
        schema:
          $ref: '#/components/schemas/stream_upload_metadata'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stream_video_copy_request'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Upload videos from a URL response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_video_response_single'
          description: Upload videos from a URL response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Upload videos from a URL
      tags:
      - Stream Videos
  /accounts/{account_id}/stream/direct_upload:
    post:
      description: Creates a direct upload that allows video uploads without an API key.
      operationId: stream-videos-upload-videos-via-direct-upload-ur-ls
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: header
        name: Upload-Creator
        schema:
          $ref: '#/components/schemas/stream_creator'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stream_direct_upload_request'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Upload videos via direct upload URLs response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_direct_upload_response'
          description: Upload videos via direct upload URLs response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Upload videos via direct upload URLs
      tags:
      - Stream Videos
  /accounts/{account_id}/stream/storage-usage:
    get:
      description: Returns information about an account's storage use.
      operationId: stream-videos-storage-usage
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_account_identifier'
      - in: query
        name: creator
        schema:
          $ref: '#/components/schemas/stream_creator'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Returns information about an account's storage use response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_storage_use_response'
          description: Returns information about an account's storage use response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Storage use
      tags:
      - Stream Videos
components:
  schemas:
    stream_asc:
      default: false
      description: Lists videos in ascending order of creation.
      example: true
      type: boolean
    stream_pctComplete:
      description: Indicates the size of the entire upload in bytes. The value must be a non-negative integer.
      maximum: 100
      minimum: 0
      type: string
    stream_watermark_size:
      description: The size of the image in bytes.
      example: 29472
      type: number
    stream_playback:
      properties:
        dash:
          description: DASH Media Presentation Description for the video.
          example: https://customer-m033z5x00ks6nunl.cloudflarestream.com/ea95132c15732412d22c1476fa83f27a/manifest/video.mpd
          type: string
        hls:
          description: The HLS manifest for the video.
          example: https://customer-m033z5x00ks6nunl.cloudflarestream.com/ea95132c15732412d22c1476fa83f27a/manifest/video.m3u8
          type: string
      type: object
    stream_type:
      description: Specifies whether the video is `vod` or `live`.
      example: live
      type: string
    stream_errorReasonCode:
      description: Specifies why the video failed to encode. This field is empty if the video is not in an `error` state. Preferred for programmatic use.
      example: ERR_NON_VIDEO
      type: string
    stream_search:
      description: Searches over the `name` key in the `meta` field. This field can be set with or after the upload request.
      example: puppy.mp4
      type: string
    stream_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/stream_messages'
        messages:
          $ref: '#/components/schemas/stream_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    stream_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    stream_preview:
      description: The video's preview page URI. This field is omitted until encoding is complete.
      example: https://customer-m033z5x00ks6nunl.cloudflarestream.com/ea95132c15732412d22c1476fa83f27a/watch
      format: uri
      type: string
    stream_allowedOrigins:
      description: Lists the origins allowed to display the video. Enter allowed origin domains in an array and use `*` for wildcard subdomains. Empty arrays allow the video to be viewed on any origin.
      example:
      - example.com
      items:
        type: string
      type: array
    stream_identifier:
      description: A Cloudflare-generated unique identifier for a media item.
      example: ea95132c15732412d22c1476fa83f27a
      maxLength: 32
      type: string
    stream_creator:
      description: A user-defined identifier for the media creator.
      example: creator-id_abcde12345
      maxLength: 64
      type: string
    stream_tus_resumable:
      description: 'Specifies the TUS protocol version. This value must be included in every upload request.

        Notes: The only supported version of TUS protocol is 1.0.0.'
      enum:
      - 1.0.0
      example: 1.0.0
      type: string
    stream_video_copy_request:
      properties:
        allowedOrigins:
          $ref: '#/components/schemas/stream_allowedOrigins'
        creator:
          $ref: '#/components/schemas/stream_creator'
        meta:
          $ref: '#/components/schemas/stream_media_metadata'
        requireSignedURLs:
          $ref: '#/components/schemas/stream_requireSignedURLs'
        scheduledDeletion:
          $ref: '#/components/schemas/stream_scheduledDeletion'
        thumbnailTimestampPct:
          $ref: '#/components/schemas/stream_thumbnailTimestampPct'
        url:
          description: A video's URL. The server must be publicly routable and support `HTTP HEAD` requests and `HTTP GET` range requests. The server should respond to `HTTP HEAD` requests with a `content-range` header that includes the size of the file.
          example: https://example.com/myvideo.mp4
          format: uri
          type: string
        watermark:
          $ref: '#/components/schemas/stream_watermark_at_upload'
      required:
      - url
    stream_video_response_collection:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/stream_videos'
            type: array
      - properties:
          range:
            description: The total number of remaining videos based on cursor position.
            example: 1000
            type: integer
          total:
            description: The total number of videos that match the provided filters.
            example: 35586
            type: integer
    stream_padding:
      default: 0.05
      description: The whitespace between the adjacent edges (determined by position) of the video and the image. `0.0` indicates no padding, and `1.0` indicates a fully padded video width or length, as determined by the algorithm.
      example: 0.1
      maximum: 1
      minimum: 0
      type: number
    stream_scheduledDeletion:
      description: Indicates the date and time at which the video will be deleted. Omit the field to indicate no change, or include with a `null` value to remove an existing scheduled deletion. If specified, must be at least 30 days from upload time.
      example: '2014-01-02T02:20:00Z'
      format: date-time
      type: string
    stream_upload_length:
      description: Indicates the size of the entire upload in bytes. The value must be a non-negative integer.
      minimum: 0
      type: integer
    stream_errorReasonText:
      description: Specifies why the video failed to encode using a human readable error message in English. This field is empty if the video is not in an `error` state.
      example: The file was not recognized as a valid video file.
      type: string
    stream_position:
      default: upperRight
      description: 'The location of the image. Valid positions are: `upperRight`, `upperLeft`, `lowerLeft`, `lowerRight`, and `center`. Note that `center` ignores the `padding` parameter.'
      example: center
      type: string
    stream_readyToStreamAt:
      description: Indicates the time at which the video became playable. The field is empty if the video is not ready for viewing or the live stream is still in progress.
      example: '2014-01-02T02:20:00Z'
      format: date-time
      type: string
    stream_signed_token_response:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-single'
      - properties:
          result:
            properties:
              token:
                description: The signed token used with the signed URLs feature.
                example: eyJhbGciOiJSUzI1NiIsImtpZCI6ImU5ZGI5OTBhODI2NjZkZDU3MWM3N2Y5NDRhNWM1YzhkIn0.eyJzdWIiOiJlYTk1MTMyYzE1NzMyNDEyZDIyYzE0NzZmYTgzZjI3YSIsImtpZCI6ImU5ZGI5OTBhODI2NjZkZDU3MWM3N2Y5NDRhNWM1YzhkIiwiZXhwIjoiMTUzNzQ2MDM2NSIsIm5iZiI6IjE1Mzc0NTMxNjUifQ.OZhqOARADn1iubK6GKcn25hN3nU-hCFF5q9w2C4yup0C4diG7aMIowiRpP-eDod8dbAJubsiFuTKrqPcmyCKWYsiv0TQueukqbQlF7HCO1TV-oF6El5-7ldJ46eD-ZQ0XgcIYEKrQOYFF8iDQbqPm3REWd6BnjKZdeVrLzuRaiSnZ9qqFpGu5dfxIY9-nZKDubJHqCr3Imtb211VIG_b9MdtO92JjvkDS-rxT_pkEfTZSafl1OU-98A7KBGtPSJHz2dHORIrUiTA6on4eIXTj9aFhGiir4rSn-rn0OjPRTtJMWIDMoQyE_fwrSYzB7MPuzL2t82BWaEbHZTfixBm5A
                type: string
    stream_width:
      description: The width of the image in pixels.
      type: integer
    stream_storage_use_response:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-single'
      - properties:
          result:
            properties:
              creator:
                $ref: '#/components/schemas/stream_creator'
              totalStorageMinutes:
                description: The total minutes of video content stored in the account.
                type: integer
              totalStorageMinutesLimit:
                description: The storage capacity alloted for the account.
                type: integer
              videoCount:
                description: The total count of videos associated with the account.
                type: integer
    stream_maxDurationSeconds:
      description: The maximum duration in seconds for a video upload. Can be set for a video that is not yet uploaded to limit its duration. Uploads that exceed the specified duration will fail during processing. A value of `-1` means the value is unknown.
      maximum: 21600
      minimum: 1
      type: integer
    stream_api-response-single:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      type: object
    stream_media_metadata:
      description: A user modifiable key-value store used to reference other systems of record for managing videos.
      example:
        name: video12345.mp4
      type: object
    stream_size:
      description: The size of the media item in bytes.
      example: 4190963.0
      type: number
    stream_accessRules:
      description: Defines rules for fine-grained control over content than signed URL tokens alone. Access rules primarily make tokens conditionally valid based on user information. Access Rules are specified on token payloads as the `accessRules` property containing an array of Rule objects.
      properties:
        action:
