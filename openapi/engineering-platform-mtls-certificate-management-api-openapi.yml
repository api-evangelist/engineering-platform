security:
- hmac: []
tags:
- name: mTLS Certificate Management
paths:
  /accounts/{account_id}/mtls_certificates:
    get:
      description: Lists all mTLS certificates.
      operationId: m-tls-certificate-management-list-m-tls-certificates
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_collection'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
          description: List mTLS certificates response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_collection'
          description: List mTLS certificates response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List mTLS certificates
      tags:
      - mTLS Certificate Management
      x-api-token-group:
      - 'Account: SSL and Certificates Read'
      - 'Account: SSL and Certificates Write'
      x-cfPermissionsRequired:
        enum:
        - '#ssl:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
    post:
      description: Upload a certificate that you want to use with mTLS-enabled Cloudflare services.
      operationId: m-tls-certificate-management-upload-m-tls-certificate
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ca:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_ca'
                certificates:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-certificates'
                name:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-name'
                private_key:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_components-schemas-private_key'
              required:
              - certificates
              - ca
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single_post'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
          description: Upload mTLS certificate response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single_post'
          description: Upload mTLS certificate response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Upload mTLS certificate
      tags:
      - mTLS Certificate Management
      x-api-token-group:
      - 'Account: SSL and Certificates Write'
      x-cfPermissionsRequired:
        enum:
        - '#ssl:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/mtls_certificates/{mtls_certificate_id}:
    delete:
      description: Deletes the mTLS certificate unless the certificate is in use by one or more Cloudflare services.
      operationId: m-tls-certificate-management-delete-m-tls-certificate
      parameters:
      - in: path
        name: mtls_certificate_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_single'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
          description: Delete mTLS certificate response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_single'
          description: Delete mTLS certificate response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete mTLS certificate
      tags:
      - mTLS Certificate Management
      x-api-token-group:
      - 'Account: SSL and Certificates Write'
      x-cfPermissionsRequired:
        enum:
        - '#ssl:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
    get:
      description: Fetches a single mTLS certificate.
      operationId: m-tls-certificate-management-get-m-tls-certificate
      parameters:
      - in: path
        name: mtls_certificate_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_single'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
          description: Get mTLS certificate response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_single'
          description: Get mTLS certificate response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get mTLS certificate
      tags:
      - mTLS Certificate Management
      x-api-token-group:
      - 'Account: SSL and Certificates Read'
      - 'Account: SSL and Certificates Write'
      x-cfPermissionsRequired:
        enum:
        - '#ssl:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
  /accounts/{account_id}/mtls_certificates/{mtls_certificate_id}/associations:
    get:
      description: Lists all active associations between the certificate and Cloudflare services.
      operationId: m-tls-certificate-management-list-m-tls-certificate-associations
      parameters:
      - in: path
        name: mtls_certificate_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_association_response_collection'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
          description: List mTLS certificate associations response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_association_response_collection'
          description: List mTLS certificate associations response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List mTLS certificate associations
      tags:
      - mTLS Certificate Management
      x-api-token-group:
      - 'Account: SSL and Certificates Read'
      - 'Account: SSL and Certificates Write'
      x-cfPermissionsRequired:
        enum:
        - '#ssl:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
components:
  schemas:
    tls-certificates-and-hostnames_components-schemas-private_key:
      description: The private key for the certificate
      example: '-----BEGIN PRIVATE KEY-----

        

        -----END PRIVATE KEY-----'
      type: string
    tls-certificates-and-hostnames_ca:
      description: Indicates whether the certificate is a CA or leaf certificate.
      example: true
      type: boolean
    tls-certificates-and-hostnames_certificate_response_single_post:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-single'
      - properties:
          result:
            allOf:
            - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificateObjectPost'
            type: object
    tls-certificates-and-hostnames_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    tls-certificates-and-hostnames_schemas-issuer:
      description: The certificate authority that issued the certificate.
      example: O=Example Inc.,L=California,ST=San Francisco,C=US
      readOnly: true
      type: string
    tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_single:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-single'
      - properties:
          result:
            allOf:
            - $ref: '#/components/schemas/tls-certificates-and-hostnames_components-schemas-certificateObject'
            type: object
    tls-certificates-and-hostnames_result_info:
      properties:
        count:
          description: Total number of results for the requested service
          example: 1
          type: number
        page:
          description: Current page within paginated list of results
          example: 1
          type: number
        per_page:
          description: Number of results per page of results
          example: 20
          type: number
        total_count:
          description: Total results available without any search parameters
          example: 2000
          type: number
      type: object
    tls-certificates-and-hostnames_association_response_collection:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-collection'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/tls-certificates-and-hostnames_associationObject'
            type: array
    tls-certificates-and-hostnames_mtls-management_components-schemas-uploaded_on:
      description: This is the time the certificate was uploaded.
      example: '2022-11-22T17:32:30.467938Z'
      format: date-time
      type: string
    tls-certificates-and-hostnames_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_messages'
        messages:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    tls-certificates-and-hostnames_components-schemas-certificateObject:
      properties:
        ca:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_ca'
        certificates:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-certificates'
        expires_on:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-expires_on'
        id:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
        issuer:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-issuer'
        name:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-name'
        serial_number:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-serial_number'
        signature:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_signature'
        uploaded_on:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-uploaded_on'
    tls-certificates-and-hostnames_mtls-management_components-schemas-expires_on:
      description: When the certificate expires.
      example: '2122-10-29T16:59:47Z'
      format: date-time
      readOnly: true
      type: string
    tls-certificates-and-hostnames_signature:
      description: The type of hash used for the certificate.
      example: SHA256WithRSA
      readOnly: true
      type: string
    tls-certificates-and-hostnames_associationObject:
      properties:
        service:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_service'
        status:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-status'
    tls-certificates-and-hostnames_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    tls-certificates-and-hostnames_schemas-name:
      description: Optional unique name for the certificate. Only used for human readability.
      example: example_ca_cert
      type: string
    tls-certificates-and-hostnames_mtls-management_components-schemas-status:
      description: Certificate deployment status for the given service.
      example: pending_deployment
      type: string
    tls-certificates-and-hostnames_schemas-serial_number:
      description: The certificate serial number.
      example: '235217144297995885180570755458463043449861756659'
      readOnly: true
      type: string
    tls-certificates-and-hostnames_service:
      description: The service using the certificate.
      example: gateway
      type: string
    tls-certificates-and-hostnames_mtls-management_components-schemas-certificate_response_collection:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-collection'
      - properties:
          result:
            items:
              $ref: '#/components/schemas/tls-certificates-and-hostnames_components-schemas-certificateObject'
            type: array
      - properties:
          result_info:
            properties:
              count:
                example: 1
              page:
                example: 1
              per_page:
                example: 50
              total_count:
                example: 1
              total_pages:
                description: Total pages available of results
                example: 1
                type: number
            type: object
    tls-certificates-and-hostnames_components-schemas-updated_at:
      description: This is the time the certificate was updated.
      example: '2022-11-22T17:32:30.467938Z'
      format: date-time
      type: string
    tls-certificates-and-hostnames_schemas-certificates:
      description: The uploaded root CA certificate.
      example: '-----BEGIN CERTIFICATE-----

        

        -----END CERTIFICATE-----'
      type: string
    tls-certificates-and-hostnames_certificateObjectPost:
      properties:
        ca:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_ca'
        certificates:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-certificates'
        expires_on:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-expires_on'
        id:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
        issuer:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-issuer'
        name:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-name'
        serial_number:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_schemas-serial_number'
        signature:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_signature'
        updated_at:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_components-schemas-updated_at'
        uploaded_on:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_mtls-management_components-schemas-uploaded_on'
    tls-certificates-and-hostnames_api-response-single:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common'
      type: object
    tls-certificates-and-hostnames_api-response-collection:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common'
      - properties:
          result_info:
            $ref: '#/components/schemas/tls-certificates-and-hostnames_result_info'
      type: object
    tls-certificates-and-hostnames_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/tls-certificates-and-hostnames_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/tls-certificates-and-hostnames_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/apigateway/
x-hasEquivalentPaths: true
