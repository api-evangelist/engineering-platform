tags:
- name: Radar Email Routing
paths:
  /radar/email/routing/summary/arc:
    get:
      description: Percentage distribution of emails classified per ARC validation.
      operationId: radar-get-email-routing-summary-by-arc
      parameters:
      - description: Array of names that will be used to name the series in responses.
        in: query
        name: name
        schema:
          description: Array of names that will be used to name the series in responses.
          example: main_series
          items:
            type: string
          type: array
      - description: For example, use `7d` and `7dControl` to compare this week with the previous week. Use this parameter or set specific start and end dates (`dateStart` and `dateEnd` parameters).
        in: query
        name: dateRange
        schema:
          description: For example, use `7d` and `7dControl` to compare this week with the previous week. Use this parameter or set specific start and end dates (`dateStart` and `dateEnd` parameters).
          example: 7d
          items:
            example: 7d
            pattern: ^((([1-9]|[1-9][0-9]|[1-2][0-9][0-9]|3[0-5][0-9]|36[0-4])[d](control)?)|(([1-9]|[1-4][0-9]|5[0-2])[w](control)?))$
            type: string
          type: array
      - description: Array of datetimes to filter the start of a series.
        in: query
        name: dateStart
        schema:
          description: Array of datetimes to filter the start of a series.
          example: '2023-09-01T11:41:33.782Z'
          items:
            format: date-time
            type: string
          type: array
      - description: End of the date range (inclusive).
        in: query
        name: dateEnd
        schema:
          description: End of the date range (inclusive).
          example: '2023-09-01T11:41:33.782Z'
          items:
            format: date-time
            type: string
          type: array
      - description: Filter for dkim.
        in: query
        name: dkim
        schema:
          description: Filter for dkim.
          example: PASS
          items:
            enum:
            - PASS
            - NONE
            - FAIL
            type: string
          type: array
      - description: Filter for dmarc.
        in: query
        name: dmarc
        schema:
          description: Filter for dmarc.
          example: PASS
          items:
            enum:
            - PASS
            - NONE
            - FAIL
            type: string
          type: array
      - description: Filter for spf.
        in: query
        name: spf
        schema:
          description: Filter for spf.
          example: PASS
          items:
            enum:
            - PASS
            - NONE
            - FAIL
            type: string
          type: array
      - description: Filter for ip version.
        in: query
        name: ipVersion
        schema:
          description: Filter for ip version.
          example: IPv4
          items:
            enum:
            - IPv4
            - IPv6
            type: string
          type: array
      - description: Filter for encrypted emails.
        in: query
        name: encrypted
        schema:
          description: Filter for encrypted emails.
          example: ENCRYPTED
          items:
            enum:
            - ENCRYPTED
            - NOT_ENCRYPTED
            type: string
          type: array
      - description: Format results are returned in.
        in: query
        name: format
        schema:
          description: Format results are returned in.
          enum:
          - JSON
          - CSV
          example: json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      meta:
                        properties:
                          confidenceInfo:
                            properties:
                              annotations:
                                items:
                                  properties:
                                    dataSource:
                                      example: ALL
                                      type: string
                                    description:
                                      example: Cable cut in Tonga
                                      type: string
                                    endTime:
                                      format: date-time
                                      type: string
                                    eventType:
                                      example: OUTAGE
                                      type: string
                                    isInstantaneous:
                                      example: true
                                      type: boolean
                                    linkedUrl:
                                      type: string
                                    startTime:
                                      format: date-time
                                      type: string
                                  required:
                                  - dataSource
                                  - eventType
                                  - description
                                  - isInstantaneous
                                  type: object
                                type: array
                              level:
                                type: integer
                            type: object
                          dateRange:
                            items:
                              properties:
                                endTime:
                                  description: Adjusted end of date range.
                                  example: '2022-09-17T10:22:57.555Z'
                                  format: date-time
                                  type: string
                                startTime:
                                  description: Adjusted start of date range.
                                  example: '2022-09-16T10:22:57.555Z'
                                  format: date-time
                                  type: string
                              required:
                              - startTime
                              - endTime
                              type: object
                            type: array
                          lastUpdated:
                            example: '2023-07-26T08:59:57Z'
                            type: string
                          normalization:
                            example: PERCENTAGE
                            type: string
                        required:
                        - dateRange
                        - normalization
                        - lastUpdated
                        type: object
                      summary_0:
                        properties:
                          FAIL:
                            example: '2'
                            type: string
                          NONE:
                            example: '53'
                            type: string
                          PASS:
                            example: '45'
                            type: string
                        required:
                        - NONE
                        - PASS
                        - FAIL
                        type: object
                    required:
                    - meta
                    - summary_0
                    type: object
                  success:
                    example: true
                    type: boolean
                required:
                - result
                - success
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    example: false
                    type: boolean
                required:
                - result
                - success
                - errors
                type: object
          description: Bad Request
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Get ARC Validations Summary
      tags:
      - Radar Email Routing
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.user.read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
