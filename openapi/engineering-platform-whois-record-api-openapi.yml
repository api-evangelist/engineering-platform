tags:
- name: WHOIS Record
paths:
  /accounts/{account_id}/intel/whois:
    get:
      operationId: whois-record-get-whois-record
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/cloudforce-one_identifier'
      - in: query
        name: domain
        schema:
          type: string
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cloudforce-one_schemas-single_response'
                - $ref: '#/components/schemas/cloudforce-one_api-response-common-failure'
          description: Get WHOIS Record response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_schemas-single_response'
          description: Get WHOIS Record response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get WHOIS Record
      tags:
      - WHOIS Record
      x-api-token-group:
      - Intel Read
components:
  schemas:
    cloudforce-one_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      type: string
    cloudforce-one_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/cloudforce-one_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/cloudforce-one_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    cloudforce-one_domain_name:
      example: cloudflare.com
      type: string
    cloudforce-one_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/cloudforce-one_messages'
        messages:
          $ref: '#/components/schemas/cloudforce-one_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    cloudforce-one_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    cloudforce-one_api-response-single:
      allOf:
      - $ref: '#/components/schemas/cloudforce-one_api-response-common'
      type: object
    cloudforce-one_schemas-single_response:
      allOf:
      - $ref: '#/components/schemas/cloudforce-one_api-response-single'
