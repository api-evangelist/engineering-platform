openapi: 3.2.0
info:
  title: VSOnline Configuration API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: Configuration
paths:
  /api/v1/GenevaActions/Configuration/{key}:
    get:
      tags:
      - Configuration
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get api geneva actions configuration by key
      x-summary-source: derived
      operationId: getApiV1GenevaActionsConfigurationByKey
      x-operation-id-source: derived
    delete:
      tags:
      - Configuration
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Delete api geneva actions configuration by key
      x-summary-source: derived
      operationId: deleteApiV1GenevaActionsConfigurationByKey
      x-operation-id-source: derived
  /api/v1/GenevaActions/Configuration:
    post:
      tags:
      - Configuration
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigurationBody'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigurationBody'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigurationBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigurationBody'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Create api geneva actions configuration
      x-summary-source: derived
      operationId: postApiV1GenevaActionsConfiguration
      x-operation-id-source: derived
components:
  schemas:
    SystemConfigurationResponse:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    UpdateSystemConfigurationBody:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
