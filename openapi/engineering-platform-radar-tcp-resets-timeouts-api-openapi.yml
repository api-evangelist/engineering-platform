                                  type: string
                              required:
                              - startTime
                              - endTime
                              type: object
                            type: array
                          lastUpdated:
                            format: date-time
                            type: string
                        required:
                        - dateRange
                        - aggInterval
                        - lastUpdated
                        type: object
                      serie_0:
                        properties:
