  description: The AWS Lambda endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: Layers
paths:
  /2018-10-31/layers/{LayerName}/versions/{VersionNumber}/policy:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: AddLayerVersionPermission
      description: 'Adds permissions to the resource-based policy of a version of an Lambda layer. Use this action to grant layer usage permission to other accounts. You can grant permission to a single account, all accounts in an organization, or all Amazon Web Services accounts.


        To revoke permission, call RemoveLayerVersionPermission with the statement ID that you specified when you added it.'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLayerVersionPermissionResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: ResourceConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceConflictException'
        '483':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
        '484':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '485':
          description: PolicyLengthExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyLengthExceededException'
        '486':
          description: PreconditionFailedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreconditionFailedException'
      parameters:
      - name: LayerName
        in: path
        required: true
        description: The name or Amazon Resource Name (ARN) of the layer.
        schema:
          type: string
          pattern: (arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+)|[a-zA-Z0-9-_]+
          minLength: 1
          maxLength: 140
      - name: VersionNumber
        in: path
        required: true
        description: The version number.
        schema:
          type: integer
      - name: RevisionId
        in: query
        required: false
        description: Only update the policy if the revision ID matches the ID specified. Use this option to avoid modifying a policy that has changed since you last read it.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - StatementId
              - Action
              - Principal
              properties:
                StatementId:
                  description: An identifier that distinguishes the policy from others on the same layer version.
                  type: string
                  pattern: ([a-zA-Z0-9-_]+)
                  minLength: 1
                  maxLength: 100
                Action:
                  description: The API action that grants access to the layer. For example, <code>lambda:GetLayerVersion</code>.
                  type: string
                  pattern: lambda:GetLayerVersion
                  maxLength: 22
                Principal:
                  description: 'An account ID, or <code>*</code> to grant layer usage permission to all accounts in an organization, or all Amazon Web Services accounts (if <code>organizationId</code> is not specified). For the last case, make sure that you really do want all Amazon Web Services accounts to have usage permission to this layer. '
                  type: string
                  pattern: \d{12}|\*|arn:(aws[a-zA-Z-]*):iam::\d{12}:root
                OrganizationId:
                  description: With the principal set to <code>*</code>, grant permission to all accounts in the specified organization.
                  type: string
                  pattern: o-[a-z0-9]{10,32}
                  maxLength: 34
      tags:
      - Layers
      summary: Add layer version permission
      x-summary-source: derived
    get:
      operationId: GetLayerVersionPolicy
      description: Returns the permission policy for a version of an Lambda layer. For more information, see AddLayerVersionPermission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLayerVersionPolicyResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
        '483':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
      parameters:
      - name: LayerName
        in: path
        required: true
        description: The name or Amazon Resource Name (ARN) of the layer.
        schema:
          type: string
          pattern: (arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+)|[a-zA-Z0-9-_]+
          minLength: 1
          maxLength: 140
      - name: VersionNumber
        in: path
        required: true
        description: The version number.
        schema:
          type: integer
      tags:
      - Layers
      summary: Get layer version policy
      x-summary-source: derived
  /2018-10-31/layers/{LayerName}/versions/{VersionNumber}:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    delete:
      operationId: DeleteLayerVersion
      description: Deletes a version of an Lambda layer. Deleted versions can no longer be viewed or added to functions. To avoid breaking functions, a copy of the version remains in Lambda until no functions refer to it.
      responses:
        '204':
          description: Success
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
      parameters:
      - name: LayerName
        in: path
        required: true
        description: The name or Amazon Resource Name (ARN) of the layer.
        schema:
          type: string
          pattern: (arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+)|[a-zA-Z0-9-_]+
          minLength: 1
          maxLength: 140
      - name: VersionNumber
        in: path
        required: true
        description: The version number.
        schema:
          type: integer
      tags:
      - Layers
      summary: Delete layer version
      x-summary-source: derived
    get:
      operationId: GetLayerVersion
      description: Returns information about a version of an Lambda layer, with a link to download the layer archive that's valid for 10 minutes.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLayerVersionResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '482':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      parameters:
      - name: LayerName
        in: path
        required: true
        description: The name or Amazon Resource Name (ARN) of the layer.
        schema:
          type: string
          pattern: (arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+)|[a-zA-Z0-9-_]+
          minLength: 1
          maxLength: 140
      - name: VersionNumber
        in: path
        required: true
        description: The version number.
        schema:
          type: integer
      tags:
      - Layers
      summary: Get layer version
      x-summary-source: derived
  /2018-10-31/layers#find=LayerVersion&Arn:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: GetLayerVersionByArn
      description: Returns information about a version of an Lambda layer, with a link to download the layer archive that's valid for 10 minutes.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLayerVersionResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '482':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      parameters:
      - name: Arn
        in: query
        required: true
        description: The ARN of the layer version.
        schema:
          type: string
          pattern: arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+:[0-9]+
          minLength: 1
          maxLength: 140
      - name: find
        in: query
        required: true
        schema:
          type: string
          enum:
          - LayerVersion
      tags:
      - Layers
      summary: Get layer version by arn
      x-summary-source: derived
  /2018-10-31/layers/{LayerName}/versions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListLayerVersions
      description: Lists the versions of an Lambda layer. Versions that have been deleted aren't listed. Specify a runtime identifier to list only versions that indicate that they're compatible with that runtime. Specify a compatible architecture to include only layer versions that are compatible with that architecture.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLayerVersionsResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
      parameters:
      - name: CompatibleRuntime
        in: query
        required: false
        description: A runtime identifier. For example, <code>go1.x</code>.
        schema:
          type: string
          enum:
          - nodejs
          - nodejs4.3
          - nodejs6.10
          - nodejs8.10
          - nodejs10.x
          - nodejs12.x
          - nodejs14.x
          - nodejs16.x
          - java8
          - java8.al2
          - java11
          - python2.7
          - python3.6
          - python3.7
          - python3.8
          - python3.9
          - dotnetcore1.0
          - dotnetcore2.0
          - dotnetcore2.1
          - dotnetcore3.1
          - dotnet6
          - nodejs4.3-edge
          - go1.x
          - ruby2.5
          - ruby2.7
          - provided
          - provided.al2
          - nodejs18.x
          - python3.10
      - name: LayerName
        in: path
        required: true
        description: The name or Amazon Resource Name (ARN) of the layer.
        schema:
          type: string
          pattern: (arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+)|[a-zA-Z0-9-_]+
          minLength: 1
          maxLength: 140
      - name: Marker
        in: query
        required: false
        description: A pagination token returned by a previous call.
        schema:
          type: string
      - name: MaxItems
        in: query
        required: false
        description: The maximum number of versions to return.
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: CompatibleArchitecture
        in: query
        required: false
        description: The compatible <a href="https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html">instruction set architecture</a>.
        schema:
          type: string
          enum:
          - x86_64
          - arm64
      tags:
      - Layers
      summary: List layer versions
      x-summary-source: derived
    post:
      operationId: PublishLayerVersion
      description: 'Creates an Lambda layer from a ZIP archive. Each time you call PublishLayerVersion with the same layer name, a new version is created.


        Add layers to your function with CreateFunction or UpdateFunctionConfiguration.'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishLayerVersionResponse'
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
        '483':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
        '484':
          description: CodeStorageExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeStorageExceededException'
      parameters:
      - name: LayerName
        in: path
        required: true
        description: The name or Amazon Resource Name (ARN) of the layer.
        schema:
          type: string
          pattern: (arn:[a-zA-Z0-9-]+:lambda:[a-zA-Z0-9-]+:\d{12}:layer:[a-zA-Z0-9-_]+)|[a-zA-Z0-9-_]+
          minLength: 1
          maxLength: 140
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - Content
              properties:
                Description:
                  description: The description of the version.
                  type: string
                  minLength: 0
                  maxLength: 256
                Content:
                  description: A ZIP archive that contains the contents of an <a href="https://docs.aws.amazon.com/lambda/latest/dg/configuration-layers.html">Lambda layer</a>. You can specify either an Amazon S3 location, or upload a layer archive directly.
                  type: object
                  properties:
                    S3Bucket:
                      allOf:
                      - $ref: '#/components/schemas/S3Bucket'
                      - description: The Amazon S3 bucket of the layer archive.
                    S3Key:
                      allOf:
                      - $ref: '#/components/schemas/S3Key'
                      - description: The Amazon S3 key of the layer archive.
                    S3ObjectVersion:
                      allOf:
                      - $ref: '#/components/schemas/S3ObjectVersion'
                      - description: For versioned objects, the version of the layer archive object to use.
                    ZipFile:
                      allOf:
                      - $ref: '#/components/schemas/Blob'
                      - description: The base64-encoded contents of the layer archive. Amazon Web Services SDK and Amazon Web Services CLI clients handle the encoding for you.
                CompatibleRuntimes:
                  description: A list of compatible <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html">function runtimes</a>. Used for filtering with <a>ListLayers</a> and <a>ListLayerVersions</a>.
                  type: array
                  items:
                    $ref: '#/components/schemas/Runtime'
                  maxItems: 15
                LicenseInfo:
                  description: <p>The layer's software license. It can be any of the following:</p> <ul> <li> <p>An <a href="https://spdx.org/licenses/">SPDX license identifier</a>. For example, <code>MIT</code>.</p> </li> <li> <p>The URL of a license hosted on the internet. For example, <code>https://opensource.org/licenses/MIT</code>.</p> </li> <li> <p>The full text of the license.</p> </li> </ul>
                  type: string
                  maxLength: 512
                CompatibleArchitectures:
                  description: A list of compatible <a href="https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html">instruction set architectures</a>.
                  type: array
                  items:
                    $ref: '#/components/schemas/Architecture'
                  maxItems: 2
      tags:
      - Layers
      summary: Publish layer version
      x-summary-source: derived
  /2018-10-31/layers:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
