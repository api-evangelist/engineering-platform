openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Zone API
  version: 4.0.0
tags:
- name: Zone
paths:
  /zones:
    get:
      description: 'Lists, searches, sorts, and filters your zones. Listing zones across more than 500 accounts

        is currently not allowed.

        '
      operationId: zones-get
      parameters:
      - examples:
          Basic Query:
            summary: Simple Query
            value: example.com
          Contains Query:
            summary: Contains Query
            value: contains:.org
          Ends With Query:
            summary: Ends With Query
            value: ends_with:arpa
          Starts With Query:
            summary: Starts With Query
            value: starts_with:dev
        in: query
        name: name
        schema:
          description: "A domain name. Optional filter operators can be provided to extend refine the search:\n  * `equal` (default)\n  * `not_equal`\n  * `starts_with`\n  * `ends_with`\n  * `contains`\n  * `starts_with_case_sensitive`\n  * `ends_with_case_sensitive`\n  * `contains_case_sensitive`\n"
          maxLength: 253
          type: string
      - in: query
        name: status
        schema:
          description: A zone status
          enum:
          - initializing
          - pending
          - active
          - moved
          type: string
      - in: query
        name: account.id
        schema:
          description: An account ID
          type: string
      - examples:
          Basic Query:
            summary: Simple Query
            value: Dev Account
          Contains Query:
            summary: Contains Query
            value: contains:Test
        in: query
        name: account.name
        schema:
          description: "An account Name. Optional filter operators can be provided to extend refine the search:\n  * `equal` (default)\n  * `not_equal`\n  * `starts_with`\n  * `ends_with`\n  * `contains`\n  * `starts_with_case_sensitive`\n  * `ends_with_case_sensitive`\n  * `contains_case_sensitive`\n"
          maxLength: 253
          type: string
      - in: query
        name: page
        schema:
          default: 1
          description: Page number of paginated results.
          minimum: 1
          type: number
      - in: query
        name: per_page
        schema:
          default: 20
          description: Number of zones per page.
          maximum: 50
          minimum: 5
          type: number
      - in: query
        name: order
        schema:
          description: Field to order zones by.
          enum:
          - name
          - status
          - account.id
          - account.name
          example: status
          type: string
      - in: query
        name: direction
        schema:
          description: Direction to order zones.
          enum:
          - asc
          - desc
          example: desc
          type: string
      - in: query
        name: match
        schema:
          default: all
          description: Whether to match all search requirements or at least one (any).
          enum:
          - any
          - all
          type: string
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
          description: List Zones response failure
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result_info:
                      $ref: '#/components/schemas/zones_result_info'
                - properties:
                    result:
                      items:
                        $ref: '#/components/schemas/zones_zone'
                      type: array
          description: List Zones response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform List Zones
      tags:
      - Zone
    post:
      operationId: zones-post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                account:
                  properties:
                    id:
                      $ref: '#/components/schemas/zones_identifier'
                  type: object
                name:
                  $ref: '#/components/schemas/zones_name'
                type:
                  $ref: '#/components/schemas/zones_type'
              required:
              - name
              - account
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
          description: Create Zone response failure
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/zones_zone'
                  type: object
          description: Create Zone response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create Zone
      tags:
      - Zone
  /zones/{zone_id}:
    delete:
      description: Deletes an existing zone.
      operationId: zones-0-delete
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          $ref: '#/components/schemas/zones_identifier'
      requestBody:
        content:
          application/json: {}
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
          description: Delete Zone response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-single-id'
          description: Delete Zone response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Delete Zone
      tags:
      - Zone
      x-cfPermissionsRequired:
        enum:
        - '#zone:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
    get:
      operationId: zones-0-get
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          $ref: '#/components/schemas/zones_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
          description: Zone Details response failure
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/zones_zone'
                  type: object
          description: Zone Details response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Zone Details
      tags:
      - Zone
      x-cfPermissionsRequired:
        enum:
        - '#zone:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
    patch:
      description: Edits a zone. Only one zone property can be changed at a time.
      operationId: zones-0-patch
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          $ref: '#/components/schemas/zones_identifier'
      requestBody:
        content:
          application/json:
            schema:
              example:
                paused: true
              properties:
                paused:
                  $ref: '#/components/schemas/zones_paused'
                plan:
                  description: '(Deprecated) Please use the `/zones/{zone_id}/subscription` API

                    to update a zone''s plan. Changing this value will create/cancel

                    associated subscriptions. To view available plans for this zone,

                    see Zone Plans.

                    '
                  properties:
                    id:
                      $ref: '#/components/schemas/zones_identifier'
                  type: object
                type:
                  description: 'A full zone implies that DNS is hosted with Cloudflare. A partial

                    zone is typically a partner-hosted zone or a CNAME setup. This

                    parameter is only available to Enterprise customers or if it has

                    been explicitly enabled on a zone.

                    '
                  enum:
                  - full
                  - partial
                  - secondary
                  example: full
                  type: string
                vanity_name_servers:
                  $ref: '#/components/schemas/zones_vanity_name_servers'
              type: object
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
          description: Edit Zone response failure
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/zones_zone'
                  type: object
          description: Edit Zone response
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Edit Zone
      tags:
      - Zone
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
components:
  schemas:
    zones_paused:
      default: false
      description: 'Indicates whether the zone is only using Cloudflare DNS services. A

        true value means the zone will not receive security or performance

        benefits.

        '
      readOnly: true
      type: boolean
    zones_zone:
      properties:
        account:
          description: The account the zone belongs to
          properties:
            id:
              $ref: '#/components/schemas/zones_identifier'
            name:
              description: The name of the account
              example: Example Account Name
              type: string
          type: object
        activated_on:
          description: 'The last time proof of ownership was detected and the zone was made

            active'
          example: '2014-01-02T00:01:00.12345Z'
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        created_on:
          description: When the zone was created
          example: '2014-01-01T05:20:00.12345Z'
          format: date-time
          readOnly: true
          type: string
        development_mode:
          description: 'The interval (in seconds) from when development mode expires

            (positive integer) or last expired (negative integer) for the

            domain. If development mode has never been enabled, this value is 0.'
          example: 7200
          readOnly: true
          type: number
        id:
          $ref: '#/components/schemas/zones_identifier'
        meta:
          description: Metadata about the zone
          properties:
            cdn_only:
              description: The zone is only configured for CDN
              example: true
              type: boolean
            custom_certificate_quota:
              description: Number of Custom Certificates the zone can have
              example: 1
              type: integer
            dns_only:
              description: The zone is only configured for DNS
              example: true
              type: boolean
            foundation_dns:
              description: The zone is setup with Foundation DNS
              example: true
              type: boolean
            page_rule_quota:
              description: Number of Page Rules a zone can have
              example: 100
              type: integer
            phishing_detected:
              description: The zone has been flagged for phishing
              example: false
              type: boolean
            step:
              example: 2
              type: integer
          type: object
        modified_on:
          description: When the zone was last modified
          example: '2014-01-01T05:20:00.12345Z'
          format: date-time
          readOnly: true
          type: string
        name:
          description: The domain name
          example: example.com
          maxLength: 253
          pattern: ^([a-zA-Z0-9][\-a-zA-Z0-9]*\.)+[\-a-zA-Z0-9]{2,20}$
          type: string
        name_servers:
          description: The name servers Cloudflare assigns to a zone
          example:
          - bob.ns.cloudflare.com
          - lola.ns.cloudflare.com
          items:
            format: hostname
            type: string
          readOnly: true
          type: array
        original_dnshost:
          description: DNS host at the time of switching to Cloudflare
          example: NameCheap
          maxLength: 50
          readOnly: true
          type:
          - string
          - 'null'
        original_name_servers:
          description: Original name servers before moving to Cloudflare
          example:
          - ns1.originaldnshost.com
          - ns2.originaldnshost.com
          items:
            format: hostname
            type: string
          readOnly: true
          type:
          - array
          - 'null'
        original_registrar:
          description: Registrar for the domain at the time of switching to Cloudflare
          example: GoDaddy
          readOnly: true
          type:
          - string
          - 'null'
        owner:
          description: The owner of the zone
          properties:
            id:
              $ref: '#/components/schemas/zones_identifier'
            name:
              description: Name of the owner
              example: Example Org
              type: string
            type:
              description: The type of owner
              example: organization
              type: string
          type: object
        paused:
          $ref: '#/components/schemas/zones_paused'
        status:
          description: The zone status on Cloudflare.
          enum:
          - initializing
          - pending
          - active
          - moved
          example: active
          readOnly: true
          type: string
        type:
          $ref: '#/components/schemas/zones_type'
        vanity_name_servers:
          description: An array of domains used for custom name servers. This is only available for Business and Enterprise plans.
          example:
          - ns1.example.com
          - ns2.example.com
          items:
            format: hostname
            maxLength: 253
            type: string
          type: array
      required:
      - id
      - name
      - development_mode
      - owner
      - account
      - meta
      - name_servers
      - original_name_servers
      - original_registrar
      - original_dnshost
      - created_on
      - modified_on
      - activated_on
      type: object
    zones_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    zones_api-response-single-id:
      allOf:
      - $ref: '#/components/schemas/zones_api-response-common'
      - properties:
          result:
            properties:
              id:
                $ref: '#/components/schemas/zones_identifier'
            required:
            - id
            type:
            - object
            - 'null'
      type: object
    zones_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/zones_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/zones_messages'
          example: []
        result:
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    zones_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/zones_messages'
        messages:
          $ref: '#/components/schemas/zones_messages'
        success:
          description: Whether the API call was successful
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    zones_name:
      description: The domain name
      example: example.com
      maxLength: 253
      pattern: ^([a-zA-Z0-9][\-a-zA-Z0-9]*\.)+[\-a-zA-Z0-9]{2,20}$
      type: string
    zones_vanity_name_servers:
      description: 'An array of domains used for custom name servers. This is only

        available for Business and Enterprise plans.'
      example:
      - ns1.example.com
      - ns2.example.com
      items:
        format: hostname
        maxLength: 253
        type: string
      type: array
    zones_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    zones_type:
      default: full
      description: 'A full zone implies that DNS is hosted with Cloudflare. A partial zone is

        typically a partner-hosted zone or a CNAME setup.

        '
      enum:
      - full
      - partial
      - secondary
      example: full
      type: string
    zones_result_info:
      properties:
        count:
          description: Total number of results for the requested service
          example: 1
          type: number
        page:
          description: Current page within paginated list of results
          example: 1
          type: number
        per_page:
          description: Number of results per page of results
          example: 20
          type: number
        total_count:
          description: Total results available without any search parameters
          example: 2000
          type: number
      type: object
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
