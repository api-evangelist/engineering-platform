components:
  schemas:
    MediaObject:
      properties:
        contentUrl:
          type: string
          description: Original URL to retrieve the source (file) for the media object (e.g the source URL for the image).
          readOnly: true
        height:
          type: integer
          description: The height of the source media object, in pixels.
          format: int32
          readOnly: true
        hostPageUrl:
          type: string
          description: URL of the page that hosts the media object.
          readOnly: true
        width:
          type: integer
          description: The width of the source media object, in pixels.
          format: int32
          readOnly: true
      allOf:
      - $ref: '#/components/schemas/CreativeWork'
    ResponseBase:
      required:
      - _type
      type: object
      properties:
        _type:
          type: string
      discriminator:
        propertyName: _type
    CreativeWork:
      properties:
        provider:
          type: array
          description: The source of the creative work.
          readOnly: true
          items:
            $ref: '#/components/schemas/Thing'
        text:
          type: string
          readOnly: true
        thumbnailUrl:
          type: string
          description: The URL to a thumbnail of the item.
          readOnly: true
      allOf:
      - $ref: '#/components/schemas/Thing'
    VideoDetails:
      properties:
        relatedVideos:
          $ref: '#/components/schemas/VideosModule'
        videoResult:
          $ref: '#/components/schemas/VideoObject'
      allOf:
      - $ref: '#/components/schemas/Response'
    Identifiable:
      properties:
        id:
          type: string
          description: A String identifier.
          readOnly: true
      description: Defines the identity of a resource.
      allOf:
      - $ref: '#/components/schemas/ResponseBase'
    Thing:
      properties:
        alternateName:
          type: string
          readOnly: true
        bingId:
          type: string
          description: An ID that uniquely identifies this item.
          readOnly: true
        description:
          type: string
          description: A short description of the item.
          readOnly: true
        image:
          $ref: '#/components/schemas/ImageObject'
        name:
          type: string
          description: The name of the thing represented by this object.
          readOnly: true
        url:
          type: string
          description: The URL to get more information about the thing represented by this object.
          readOnly: true
      allOf:
      - $ref: '#/components/schemas/Response'
    VideoObject:
      properties:
        allowHttpsEmbed:
          type: boolean
          readOnly: true
        allowMobileEmbed:
          type: boolean
          readOnly: true
        embedHtml:
          type: string
          readOnly: true
        isSuperfresh:
          type: boolean
          readOnly: true
        motionThumbnailId:
          type: string
          readOnly: true
        motionThumbnailUrl:
          type: string
          readOnly: true
        thumbnail:
          $ref: '#/components/schemas/ImageObject'
        videoId:
          type: string
          readOnly: true
        viewCount:
          type: integer
          format: int32
          readOnly: true
      description: Defines a video object that is relevant to the query.
      allOf:
      - $ref: '#/components/schemas/MediaObject'
    ImageObject:
      properties:
        thumbnail:
          $ref: '#/components/schemas/ImageObject'
      description: Defines an image
      allOf:
      - $ref: '#/components/schemas/MediaObject'
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: The error code that identifies the category of error.
          default: None
          enum:
          - None
          - ServerError
          - InvalidRequest
          - RateLimitExceeded
          - InvalidAuthorization
          - InsufficientAuthorization
          x-ms-enum:
            modelAsString: false
            name: ErrorCode
        message:
          type: string
          description: A description of the error.
        moreDetails:
          type: string
          description: A description that provides additional information about the error.
          readOnly: true
        parameter:
          type: string
          description: The parameter in the request that caused the error.
          readOnly: true
        subCode:
          type: string
          description: The error code that further helps to identify the error.
          readOnly: true
          enum:
          - UnexpectedError
          - ResourceError
          - NotImplemented
          - ParameterMissing
          - ParameterInvalidValue
          - HttpNotAllowed
          - Blocked
          - AuthorizationMissing
          - AuthorizationRedundancy
          - AuthorizationDisabled
          - AuthorizationExpired
          x-ms-enum:
            modelAsString: false
            name: ErrorSubCode
        value:
          type: string
          description: The parameter's value in the request that was not valid.
          readOnly: true
      description: Defines the error that occurred.
    ErrorResponse:
      required:
      - errors
      properties:
        errors:
          type: array
          description: A list of errors that describe the reasons why the request failed.
          items:
            $ref: '#/components/schemas/Error'
      description: The top-level response that represents a failed request.
      allOf:
      - $ref: '#/components/schemas/Response'
    VideosModule:
      type: object
      properties:
        value:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/VideoObject'
    Response:
      properties:
        webSearchUrl:
          type: string
          description: The URL To Bing's search result for this item.
          readOnly: true
      description: Defines a response. All schemas that could be returned at the root of a response should inherit from this
      allOf:
      - $ref: '#/components/schemas/Identifiable'
