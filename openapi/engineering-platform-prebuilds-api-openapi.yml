components:
  schemas:
    PrebuildReadinessResult:
      type: object
      properties:
        repoId:
          type:
          - string
          - 'null'
        branchName:
          type:
          - string
          - 'null'
        prebuildHash:
          type:
          - string
          - 'null'
        devContainerPath:
          type:
          - string
          - 'null'
        location:
          $ref: '#/components/schemas/AzureLocation'
        templateSkus:
          type:
          - array
          - 'null'
          items:
            type: string
        poolSkus:
          type:
          - array
          - 'null'
          items:
            type: string
        supportedSkus:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    MessageCodes:
      enum:
      - 0 (Unknown)
      - 1 (ExceededQuota)
      - 2 (EnvironmentNameAlreadyExists)
      - 3 (EnvironmentDoesNotExist)
      - 4 (ShutdownStaticEnvironment)
      - 5 (StartStaticEnvironment)
      - 6 (EnvironmentNotAvailable)
      - 7 (EnvironmentNotShutdown)
      - 8 (UnableToAllocateResources)
      - 9 (UnableToAllocateResourcesWhileStarting)
      - 10 (RequestedAutoShutdownDelayMinutesIsInvalid)
      - 11 (UnableToUpdateSku)
      - 12 (RequestedSkuIsInvalid)
      - 13 (HeartbeatUnhealthy)
      - 14 (StartEnvironmentGenericError)
      - 15 (RestoringFromArchive)
      - 16 (FilePathIsInvalid)
      - 17 (TooManyRecentFolders)
      - 18 (SubscriptionIsBanned)
      - 19 (EnvironmentArchived)
      - 20 (SubscriptionStateIsNotRegistered)
      - 21 (FeatureDisabled)
      - 22 (SubscriptionCannotPerformAction)
      - 23 (InvalidLocationChange)
      - 24 (PlanDoesNotExist)
      - 25 (UnableToResolveEnvironmentNameConflict)
      - 26 (ExceededSecretsQuota)
      - 27 (InvalidPlanTenant)
      - 28 (ExportStaticEnvironment)
      - 29 (ExportEnvironmentGenericError)
      - 30 (ExceededOrgDevContainerMaxLength)
      - 31 (ActionNotAllowedInThisState)
      - 32 (ExportRunningEnvironmentError)
      - 34 (EnvironmentCreationIsNotAllowed)
      - 35 (GitHubProxyError)
      - 36 (PrebuildTemplateDeletionIsNotAllowed)
      - 37 (TierCapacityIsUnavailable)
      - 38 (EnvironmentIsNotRestorable)
      - 39 (StartFailureCircuitBreakerTripped)
      - 40 (HardDeleteConfirmationRequired)
      type: integer
      format: int32
    CreateEnvironmentPoolResourceBody:
      type: object
      properties:
        secrets:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SecretDataBody'
        environmentOptions:
          $ref: '#/components/schemas/PrebuildEnvironmentOptions'
      additionalProperties: false
    StorageImageVersion:
      enum:
      - 0 (None)
      - 1 (Minimal)
      - 2 (Raw)
      type: integer
      format: int32
    SeedInfoBody:
      type: object
      properties:
        seedType:
          type:
          - string
          - 'null'
        seedMoniker:
          type:
          - string
          - 'null'
        gitConfig:
          $ref: '#/components/schemas/GitConfigOptionsBody'
        recurseClone:
          type: boolean
        repository:
          $ref: '#/components/schemas/RepositoryInfoBody'
        cloneUrl:
          type:
          - string
          - 'null'
      additionalProperties: false
    DeletePrebuildTemplatesBody:
      required:
      - branchName
      - repoId
      type: object
      properties:
        repoId:
          type: integer
          format: int64
        branchName:
          type: string
        devContainerPath:
          type:
          - string
          - 'null'
        prebuildConfigurationId:
          type: integer
          format: int64
      additionalProperties: false
    UpdatePrebuildTemplateVersionsBody:
      required:
      - branchName
      - maxPrebuildTemplateVersions
      - repoId
      type: object
      properties:
        repoId:
          type: integer
          format: int64
        branchName:
          type: string
        maxPrebuildTemplateVersions:
          type: integer
          format: int32
        devContainerPath:
          type:
          - string
          - 'null'
      additionalProperties: false
    ExperimentalFeaturesBody:
      type: object
      properties:
        queueResourceAllocation:
          type: boolean
        enableDynamicHttpsDetection:
          type: boolean
        usePrebuiltImages:
          type: boolean
        usePrebuildFastPathIfAvailable:
          type: boolean
        useStorageV2:
          type: boolean
        useRawFuse:
          type: boolean
        copilotWorkspace:
          type: boolean
        systemOnContainerCommandParams:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/JToken'
        fileSyncerWithBridge:
          type: boolean
        sparkCloudspace:
          type: boolean
        sessionHardLimit:
          type:
          - number
          - 'null'
          format: double
        useGpsCompute:
          type: boolean
      additionalProperties: false
    JToken:
      type: array
      items:
        $ref: '#/components/schemas/JToken'
    UpdatePrebuildTemplateBody:
      required:
      - isSuccess
      type: object
      properties:
        isSuccess:
          type: boolean
      additionalProperties: false
    PrebuildMode:
      enum:
      - 0 (None)
      - 1 (Blob)
      - 2 (CodespacePool)
      type: integer
      format: int32
    GitConfigOptionsBody:
      type: object
      properties:
        userName:
          type:
          - string
          - 'null'
        userEmail:
          type:
          - string
          - 'null'
      additionalProperties: false
    AzureLocation:
      enum:
      - 0 (None)
      - 101 (EastAsia)
      - 102 (SouthEastAsia)
      - 201 (AustraliaCentral)
      - 202 (AustraliaCentral2)
      - 203 (AustraliaEast)
      - 205 (AustraliaSouthEast)
      - 301 (BrazilSouth)
      - 401 (CanadaCentral)
      - 402 (CanadaEast)
      - 501 (NorthEurope)
      - 502 (WestEurope)
      - 601 (FranceCentral)
      - 602 (FranceSouth)
      - 701 (CentralIndia)
      - 702 (SouthIndia)
      - 703 (WestIndia)
      - 801 (JapanEast)
      - 802 (JapanWest)
      - 901 (KoreaCentral)
      - 902 (KoreaSouth)
      - 1001 (SouthAfricaNorth)
      - 1002 (SouthAfricaWest)
      - 1201 (UaeCentral)
      - 1202 (UaeNorth)
      - 1401 (UkSouth)
      - 1402 (UkWest)
      - 1501 (CentralUs)
      - 1502 (EastUs)
      - 1503 (EastUs2)
      - 1504 (NorthCentralUs)
      - 1505 (SouthCentralUs)
      - 1506 (WestCentralUs)
      - 1507 (WestUs)
      - 1508 (WestUs2)
      - 1509 (WestUs3)
      - 1601 (CentralUsEuap)
      - 1602 (EastUs2Euap)
      - 1701 (SwitzerlandNorth)
      - 1702 (SwitzerlandWest)
      - 1801 (GermanyNorth)
      - 1802 (GermanyWestCentral)
      - 1901 (NorwayWest)
      - 1902 (NorwayEast)
      type: integer
      format: int32
    SecretType:
      enum:
      - 0 (None)
      - 1 (EnvironmentVariable)
      - 2 (ContainerRegistry)
      - 3 (HostSetupEnvironmentVariable)
      type: integer
      format: int32
    ContainerInfo:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        schemaVersion:
          type:
          - string
          - 'null'
        imageName:
          type:
