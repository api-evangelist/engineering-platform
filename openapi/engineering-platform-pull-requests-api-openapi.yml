                example: Test PR
              description:
                type: string
                description: The pull request's description.
                example: This is a test pull request.
              reviewers:
                type: array
                description: A list of reviewers to assign to the pull request.
                items:
                  type: string
                  description: The reviewer's user ID.
                  example: '87654321'
              destinationId:
                type: string
