openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Zero Trust Accounts API
  version: 4.0.0
tags:
- name: Zero Trust Accounts
paths:
  /accounts/{account_id}/devices/settings:
    get:
      description: Describes the current device settings for a Zero Trust account.
      operationId: zero-trust-accounts-get-device-settings-for-zero-trust-account
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings-response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Get device settings for a Zero Trust account response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings-response'
          description: Get device settings for a Zero Trust account response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get device settings for a Zero Trust account
      tags:
      - Zero Trust Accounts
      x-api-token-group:
      - Teams Read
      - Teams Write
    patch:
      description: Patches the current device settings for a Zero Trust account.
      operationId: zero-trust-accounts-patch-device-settings-for-the-zero-trust-account
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings-response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Patch device settings for a Zero Trust account response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings-response'
          description: Patch device settings for a Zero Trust account response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Patch device settings for a Zero Trust account
      tags:
      - Zero Trust Accounts
      x-api-token-group:
      - Teams Write
    put:
      description: Updates the current device settings for a Zero Trust account.
      operationId: zero-trust-accounts-update-device-settings-for-the-zero-trust-account
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings-response'
                - $ref: '#/components/schemas/teams-devices_api-response-common-failure'
          description: Update device settings for a Zero Trust account response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings-response'
          description: Update device settings for a Zero Trust account response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update device settings for a Zero Trust account
      tags:
      - Zero Trust Accounts
      x-api-token-group:
      - Teams Write
  /accounts/{account_id}/gateway:
    get:
      description: Gets information about the current Zero Trust account.
      operationId: zero-trust-accounts-get-zero-trust-account-information
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway_account'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Get Zero Trust account information response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway_account'
          description: Get Zero Trust account information response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get Zero Trust account information
      tags:
      - Zero Trust Accounts
      x-api-token-group:
      - Teams Read
      - Teams Write
    post:
      description: Creates a Zero Trust account with an existing Cloudflare account.
      operationId: zero-trust-accounts-create-zero-trust-account
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway_account'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Create Zero Trust account response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway_account'
          description: Create Zero Trust account response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Create Zero Trust account
      tags:
      - Zero Trust Accounts
      x-api-token-group:
      - Teams Write
  /accounts/{account_id}/gateway/configuration:
    get:
      description: Fetches the current Zero Trust account configuration.
      operationId: zero-trust-accounts-get-zero-trust-account-configuration
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway_account_config'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Get Zero Trust account configuration response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway_account_config'
          description: Get Zero Trust account configuration response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get Zero Trust account configuration
      tags:
      - Zero Trust Accounts
    patch:
      description: Patches the current Zero Trust account configuration. This endpoint can update a single subcollection of settings such as `antivirus`, `tls_decrypt`, `activity_log`, `block_page`, `browser_isolation`, `fips`, `body_scanning`, or `certificate`, without updating the entire configuration object. Returns an error if any collection of settings is not properly configured.
      operationId: zero-trust-accounts-patch-zero-trust-account-configuration
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zero-trust-gateway_gateway-account-settings'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway_account_config'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Update Zero Trust account configuration response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway_account_config'
          description: Update Zero Trust account configuration response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Patch Zero Trust account configuration
      tags:
      - Zero Trust Accounts
    put:
      description: Updates the current Zero Trust account configuration.
      operationId: zero-trust-accounts-update-zero-trust-account-configuration
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zero-trust-gateway_gateway-account-settings'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway_account_config'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Update Zero Trust account configuration response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway_account_config'
          description: Update Zero Trust account configuration response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update Zero Trust account configuration
      tags:
      - Zero Trust Accounts
  /accounts/{account_id}/gateway/configuration/custom_certificate:
    get:
      description: Fetches the current Zero Trust certificate configuration.
      operationId: zero-trust-accounts-get-zero-trust-certificate-configuration
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_custom-certificate-settings'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Get Zero Trust account configuration response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_custom-certificate-settings'
          description: Get Zero Trust account configuration response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get Zero Trust certificate configuration
      tags:
      - Zero Trust Accounts
  /accounts/{account_id}/gateway/logging:
    get:
      description: Fetches the current logging settings for Zero Trust account.
      operationId: zero-trust-accounts-get-logging-settings-for-the-zero-trust-account
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway-account-logging-settings-response'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Get logging settings for the Zero Trust account response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway-account-logging-settings-response'
          description: Get logging settings for the Zero Trust account response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get logging settings for the Zero Trust account
      tags:
      - Zero Trust Accounts
    put:
      description: Updates logging settings for the current Zero Trust account.
      operationId: zero-trust-accounts-update-logging-settings-for-the-zero-trust-account
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zero-trust-gateway_gateway-account-logging-settings'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_gateway-account-logging-settings-response'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
          description: Update logging settings for the Zero Trust account response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_gateway-account-logging-settings-response'
          description: Update logging settings for the Zero Trust account response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update Zero Trust account logging settings
      tags:
      - Zero Trust Accounts
components:
  schemas:
    zero-trust-gateway_gateway_tag:
      description: Gateway internal ID.
      example: f174e90afafe4643bbbc4a0ed4fc8415
      maxLength: 32
      type: string
    zero-trust-gateway_gateway-account-settings:
      description: account settings.
      properties:
        settings:
          description: account settings.
          properties:
            activity_log:
              $ref: '#/components/schemas/zero-trust-gateway_activity-log-settings'
            antivirus:
              $ref: '#/components/schemas/zero-trust-gateway_anti-virus-settings'
            block_page:
              $ref: '#/components/schemas/zero-trust-gateway_block-page-settings'
            body_scanning:
              $ref: '#/components/schemas/zero-trust-gateway_body-scanning-settings'
            browser_isolation:
              $ref: '#/components/schemas/zero-trust-gateway_browser-isolation-settings'
            certificate:
              $ref: '#/components/schemas/zero-trust-gateway_certificate-settings'
            custom_certificate:
              $ref: '#/components/schemas/zero-trust-gateway_custom-certificate-settings'
            extended_email_matching:
              $ref: '#/components/schemas/zero-trust-gateway_extended-email-matching'
            fips:
              $ref: '#/components/schemas/zero-trust-gateway_fips-settings'
            protocol_detection:
              $ref: '#/components/schemas/zero-trust-gateway_protocol-detection'
            tls_decrypt:
              $ref: '#/components/schemas/zero-trust-gateway_tls-settings'
          type: object
      type: object
    teams-devices_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/teams-devices_messages'
        messages:
          $ref: '#/components/schemas/teams-devices_messages'
        result:
          anyOf:
          - type: object
          - items: {}
            type: array
          - type: string
        success:
          description: Whether the API call was successful.
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    zero-trust-gateway_identifier:
      example: 699d98642c564d2e855e9661899b7252
      type: string
    teams-devices_zero-trust-account-device-settings-response:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/teams-devices_zero-trust-account-device-settings'
      type: object
    zero-trust-gateway_browser-isolation-settings:
      description: Browser isolation settings.
      properties:
        non_identity_enabled:
          description: Enable non-identity onramp support for Browser Isolation.
          example: true
          type: boolean
        url_browser_isolation_enabled:
          description: Enable Clientless Browser Isolation.
          example: true
          type: boolean
      type: object
    zero-trust-gateway_gateway-account-logging-settings:
      properties:
        redact_pii:
          description: 'Redact personally identifiable information from activity logging (PII fields are: source IP, user email, user ID, device ID, URL, referrer, user agent).'
          example: true
          type: boolean
        settings_by_rule_type:
          description: Logging settings by rule type.
          properties:
            dns:
              description: Logging settings for DNS firewall.
              type: object
            http:
              description: Logging settings for HTTP/HTTPS firewall.
              type: object
            l4:
              description: Logging settings for Network firewall.
              type: object
          type: object
      type: object
    zero-trust-gateway_api-response-single:
      allOf:
      - $ref: '#/components/schemas/zero-trust-gateway_api-response-common'
      type: object
    zero-trust-gateway_certificate-settings:
      description: Certificate settings for Gateway TLS interception. If not specified, the Cloudflare Root CA will be used.
      properties:
        id:
          description: UUID of certificate to be used for interception. Certificate must be active on the edge. A nil UUID will indicate the Cloudflare Root CA should be used.
          example: d1b364c5-1311-466e-a194-f0e943e0799f
          type: string
      required:
      - id
      type: object
    zero-trust-gateway_gateway_account:
      allOf:
      - $ref: '#/components/schemas/zero-trust-gateway_api-response-single'
      - properties:
          result:
            properties:
              gateway_tag:
                $ref: '#/components/schemas/zero-trust-gateway_gateway_tag'
              id:
                $ref: '#/components/schemas/zero-trust-gateway_cf_account_id'
              provider_name:
                $ref: '#/components/schemas/zero-trust-gateway_provider_name'
            type: object
      type: object
    zero-trust-gateway_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/zero-trust-gateway_messages'
        messages:
          $ref: '#/components/schemas/zero-trust-gateway_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    zero-trust-gateway_fail_closed:
      description: Block requests for files that cannot be scanned.
      example: false
      type: boolean
    zero-trust-gateway_gateway_account_config:
      allOf:
      - $ref: '#/components/schemas/zero-trust-gateway_api-response-single'
      - properties:
          result:
            allOf:
            - $ref: '#/components/schemas/zero-trust-gateway_gateway-account-settings'
            - properties:
                created_at:
                  $ref: '#/components/schemas/zero-trust-gateway_timestamp'
                updated_at:
                  $ref: '#/components/schemas/zero-trust-gateway_timestamp'
            type: object
      type: object
    teams-devices_zero-trust-account-device-settings:
      properties:
        disable_for_time:
          description: Sets the time limit, in seconds, that a user can use an override code to bypass WARP.
          type: number
        gateway_proxy_enabled:
          description: Enable gateway proxy filtering on TCP.
          example: true
          type: boolean
        gateway_udp_proxy_enabled:
          description: Enable gateway proxy filtering on UDP.
          example: true
          type: boolean
        root_certificate_installation_enabled:
          description: Enable installation of cloudflare managed root certificate.
          example: true
          type: boolean
        use_zt_virtual_ip:
          description: Enable using CGNAT virtual IPv4.
          example: true
          type: boolean
      type: object
    zero-trust-gateway_tls-settings:
      description: TLS interception settings.
      properties:
        enabled:
          description: Enable inspecting encrypted HTTP traffic.
          example: true
          type: boolean
      type: object
    zero-trust-gateway_provider_name:
      description: The name of the provider. Usually Cloudflare.
      example: Cloudflare
      type: string
    teams-devices_identifier:
      example: 699d98642c564d2e855e9661899b7252
    zero-trust-gateway_cf_account_id:
      description: Cloudflare account ID.
      example: 699d98642c564d2e855e9661899b7252
      maxLength: 32
      type: string
    teams-devices_api-response-single:
      allOf:
      - $ref: '#/components/schemas/teams-devices_api-response-common'
      - properties:
          result:
            anyOf:
            - type: object
            - type: string
            type:
            - object
            - 'null'
      type: object
    zero-trust-gateway_activity-log-settings:
      description: Activity log settings.
      properties:
        enabled:
          description: Enable activity logging.
          example: true
          type: boolean
      type: object
    zero-trust-gateway_body-scanning-settings:
      description: DLP body scanning settings.
      properties:
        inspection_mode:
          description: Set the inspection mode to either `deep` or `shallow`.
          example: deep
          type: string
      type: object
    teams-devices_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/teams-devices_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/teams-devices_messages'
          example: []
        result:
          enum:
          - null
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    zero-trust-gateway_custom-certificate-settings:
      deprecated: true
      description: Custom certificate settings for BYO-PKI. (deprecated and replaced by `certificate`)
      properties:
        binding_status:
          description: Certificate status (internal).
          example: pending_deployment
          readOnly: true
          type: string
        enabled:
          description: Enable use of custom certificate authority for signing Gateway traffic.
          example: true
          type: boolean
        id:
          description: UUID of certificate (ID from MTLS certificate store).
          example: d1b364c5-1311-466e-a194-f0e943e0799f
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
      - enabled
      type: object
    zero-trust-gateway_notification_settings:
      description: Configure a message to display on the user's device when an antivirus search is performed.
      properties:
        enabled:
          description: Set notification on
          type: boolean
        msg:
          description: Customize the message shown in the notification.
          type: string
        support_url:
          description: Optional URL to direct users to additional information. If not set, the notification will open a block page.
          type: string
      type: object
    zero-trust-gateway_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    zero-trust-gateway_extended-email-matching:
      description: Extended e-mail matching settings.
      properties:
        enabled:
          description: Enable matching all variants of user emails (with + or . modifiers) used as criteria in Firewall policies.
          example: true
          type: boolean
      type: object
    zero-trust-gateway_block-page-settings:
      description: Block page layout settings.
      properties:
        background_color:
          description: 'Block page background color in #rrggbb format.'
          type: string
        enabled:
          description: Enable only cipher suites and TLS versions compliant with FIPS 140-2.
          example: true
          type: boolean
        footer_text:
          description: Block page footer text.
          example: --footer--
          type: string
        header_text:
          description: Block page header text.
          example: --header--
          type: string
        logo_path:
          description: Full URL to the logo file.
          example: https://logos.com/a.png
          type: string
        mailto_address:
          description: Admin email for users to contact.
          example: admin@example.com
          type: string
        mailto_subject:
          description: Subject line for emails created from block page.
          example: Blocked User Inquiry
          type: string
        name:
          description: Block page title.
          example: Cloudflare
          type: string
        suppress_footer:
          description: Suppress detailed info at the bottom of the block page.
          example: false
          type: boolean
      type: object
    zero-trust-gateway_anti-virus-settings:
      description: Anti-virus settings.
      properties:
        enabled_download_phase:
          $ref: '#/components/schemas/zero-trust-gateway_enabled_download_phase'
        enabled_upload_phase:
          $ref: '#/components/schemas/zero-trust-gateway_enabled_upload_phase'
        fail_closed:
          $ref: '#/components/schemas/zero-trust-gateway_fail_closed'
        notification_settings:
          $ref: '#/components/schemas/zero-trust-gateway_notification_settings'
      type: object
    zero-trust-gateway_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/zero-trust-gateway_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
