components:
  parameters:
    threadId:
      name: threadId
      in: path
      required: true
      description: The comment's thread ID.
      schema:
        type: integer
        example: 34567
    apiId:
      name: apiId
      in: path
      required: true
      description: The API's ID.
      schema:
        type: string
        example: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
    collectionRequestUid:
      name: requestId
      in: path
      required: true
      description: The request's unique ID.
      schema:
        type: string
        format: uid
        example: 12345678-c82dd02c-4870-4907-8fcb-593a876cf05b
    collectionFolderUid:
      name: folderId
      in: path
      required: true
      description: The folder's unique ID.
      schema:
        type: string
        format: uid
        example: 12345678-65a99e60-8e0a-4b6e-b79c-7d8264cc5caa
    collectionUid:
      name: collectionId
      in: path
      required: true
      description: The collection's unique ID.
      schema:
        type: string
        format: uid
        example: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
    collectionResponseUid:
      name: responseId
      in: path
      required: true
      description: The response's unique ID.
      schema:
        type: string
        format: uid
        example: 12345678-cc364734-7dfd-4bfc-897d-be763dcdbb07
    commentId:
      name: commentId
      in: path
      required: true
      description: The comment's ID.
      schema:
        type: integer
        example: 46814
  schemas:
    featureUnavailable403Error:
      title: Feature Unavailable
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
          example: https://api.postman.com/problems/forbidden
        title:
          type: string
          description: A short summary of the problem.
          example: Forbidden
        detail:
          type: string
          description: Information about the error.
          example: This feature isn't available in your region.
        status:
          type: integer
          format: http-status-code
          description: The error's HTTP status code.
          example: 403
    commentCreateUpdate:
      title: Comment Payload Object
      type: object
      description: Information about the comment.
      required:
      - body
      properties:
        body:
          type: string
          description: The contents of the comment.
          example: This is an example.
        tags:
          type: object
          description: Information about users tagged in the `body` comment.
          properties:
            userName:
              type: object
              required:
              - type
              - id
              description: An object that contains information about the tagged user. The object's name is the user's Postman username. For example, `@user-postman`.
              properties:
                type:
                  type: string
                  description: The `user` value.
                  enum:
                  - user
                  example: user
                id:
                  type: integer
                  description: The user's ID.
                  example: 87654321
    commentCreatedUpdated:
      title: Comment Updated/Created Object
      type: object
      properties:
        data:
          type: object
          properties:
