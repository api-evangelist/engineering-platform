          type:
          - string
          - 'null'
        domain:
          type:
          - string
          - 'null'
        connectTokenExpiration:
          type:
          - integer
          - 'null'
          format: int64
        connectAccessToken:
          type:
          - string
          - 'null'
        managePortsTokenExpiration:
          type:
          - integer
          - 'null'
          format: int64
        managePortsAccessToken:
          type:
          - string
          - 'null'
        serviceUri:
          type:
          - string
          - 'null'
      additionalProperties: false
    MessageCodes:
      enum:
      - 0 (Unknown)
