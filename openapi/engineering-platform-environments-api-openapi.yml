openapi: 3.2.0
info:
  title: APIs.io Engineering Platform Postman Environments API
  description: "The Postman API enables you to programmatically access data stored in your Postman account.\n\n> Certain endpoints may be unavailable depending on your region and/or Postman plan.\n\nFor a comprehensive set of examples of requests and responses, see the [**Postman API** collection](https://www.postman.com/postman/workspace/postman-public-workspace/documentation/12959542-c8142d51-e97c-46b6-bd77-52bb66712c9a).\n\n## Getting started\n\nYou can get started with the Postman API by creating a copy of this definition in your workspace.\n\n### EU users\n\nFor users in the EU with [**Enterprise** plans](https://www.postman.com/pricing/), the Postman API uses the `http://api.eu.postman.com` subdomain. This is available in the definition's list of servers. You can change this by selecting the `http://api.eu.postman.com` subdomain in the **Server** dropdown list below.\n\n## About the Postman API\n\n- You must use a valid API Key to send requests to the API endpoints.\n- The API has [rate and usage limits](https://learning.postman.com/docs/developer/postman-api/postman-api-rate-limits/).\n- The API only responds to HTTPS-secured communications. Any requests sent via HTTP return an HTTP `301` redirect to the corresponding HTTPS resources.\n- The API returns requests responses in JSON format. When an API request returns an error, it is sent in the JSON response as an error key.\n- The request method (verb) determines the nature of action you intend to perform. A request made using the `GET` method implies that you want to fetch something from Postman. The `POST` method implies you want to save something new to Postman.\n- For all requests, API calls respond with their corresponding [HTTP status codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes). In the Postman client, the status code also provides help text that details the possible meaning of the response code.\n- When calling the API Builder endpoints, you must send an `Accept` header with the `application/vnd.api.v10+json` value.\n\n### IDs and UIDs\n\nAll items in Postman, such as collections, workspaces, and APIs, have IDs and UIDs:\n\n- An ID is the unique ID assigned to a Postman item. For example, `ec29121c-5203-409f-9e84-e83ffc10f226`.\n- The UID is the **full** ID of a Postman item. This value is the item's unique ID concatenated with the user ID. For example, in the `12345678-ec29121c-5203-409f-9e84-e83ffc10f226` UID:\n    - `12345678` is the user's ID.\n    - `ec29121c-5203-409f-9e84-e83ffc10f226` is the item's ID.\n\n### Enum values\n\nAny documented enum values should be considered partial lists and may change over time.\n\n### 403 response for unavailable features\n\nDepending on your region and/or Postman [plan](https://www.postman.com/pricing/), some endpoints will return an HTTP `403 Forbidden` response with the \"This feature isn't available in your region.\" detail.\n\n### 503 response\n\nAn HTTP `503 Service Unavailable` response from our servers indicates there is an unexpected spike in API access traffic. The server is usually operational within the next five minutes.\n\nIf the outage persists or you receive any other form of an HTTP `5XX` error, [contact support](https://support.postman.com/hc/en-us/requests/new/).\n\n## Authentication\n\nPostman uses API keys for authentication. The API key tells the API server that the request came from you. Everything that you have access to in Postman is accessible with your API key. You can [generate](https://learning.postman.com/docs/developer/postman-api/authentication/#generate-a-postman-api-key) a Postman API key in the [**API keys**](https://postman.postman.co/settings/me/api-keys) section of your Postman account settings.\n\nYou must include an API key in each request to the Postman API with the `X-API-Key` request header. In Postman, you can store your API key as a [vault secret](https://learning.postman.com/docs/sending-requests/postman-vault/postman-vault-secrets/) or an [environment variable](https://www.getpostman.com/docs/environments). The Postman API [collection](https://www.getpostman.com/docs/collections) will use it to make API calls.\n\n### SCIM authentication\n\nWhile all other endpoints in this collection require a Postman API key, the SCIM endpoints require a [SCIM API key](https://learning.postman.com/docs/administration/scim-provisioning/scim-provisioning-overview/#generating-scim-api-key).\n\n### Authentication error response\n\nIf an API key is missing, malformed, or invalid, you will receive an HTTP `401 Unauthorized` response code.\n\n## Rate and usage limits\n\nAPI access [rate limits](https://learning.postman.com/docs/developer/postman-api/postman-api-rate-limits/) apply at a per-user basis in unit time. The limit is **300 requests per minute**. Postman Monitors, the GET `/collections`, and the GET `/workspaces` endpoint have a rate limit of **10 calls in 10 seconds**. Depending on your [plan](https://www.postman.com/pricing/), you may also have [usage limits](https://learning.postman.com/docs/billing/resource-usage/).\n\nWhen you reach your rate or usage limits, the API returns the following HTTP `429 Too Many Requests` status code with one of the following error responses:\n\n- `rateLimited` — Rate limits reached. The response returns the time after which you can resume calls to the Postman API.\n- `serviceLimitExhausted` — Postman API service limits reached. You will need to contact your Postman Team Admin for assistance.\n\n## Support\n\nFor help regarding accessing the Postman API, you can:\n\n- Visit [Postman Support](https://support.postman.com/hc/en-us) or our [Community and Support](https://www.postman.com/community/) sites.\n- Reach out to the [Postman community](https://community.postman.com/).\n- Submit a help request to [Postman support](https://support.postman.com/hc/en-us/requests/new/).\n\n## Policies\n\n- [Postman Terms of Service](http://www.postman.com/legal/terms/)\n- [Postman Privacy Policy](https://www.postman.com/legal/privacy-policy/)\n"
  version: '1.0'
  termsOfService: https://www.postman.com/legal/terms/
  contact:
    name: Postman Support
    email: help@postman.com
    url: https://www.postman.com/community/
servers:
- url: https://api.getpostman.com
- url: https://api.eu.postman.com
security:
- PostmanApiKey: []
- scimApiKey: []
tags:
- name: Environments
  description: The **Environments** endpoints enable you to manage your Postman [environments](https://learning.postman.com/docs/sending-requests/managing-environments/).
paths:
  /environments:
    get:
      summary: APIs.io Engineering Platform Get all environments
      description: Gets information about all of your [environments](https://learning.postman.com/docs/sending-requests/managing-environments/).
      operationId: getEnvironments
      tags:
      - Environments
      responses:
        '200':
          $ref: '#/components/responses/getEnvironments'
        '401':
          $ref: '#/components/responses/common401Error'
        '404':
          $ref: '#/components/responses/instanceNotFoundEnvironment'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
      parameters:
      - $ref: '#/components/parameters/workspaceQuery'
    post:
      summary: APIs.io Engineering Platform Create an environment
      description: 'Creates an environment.


        **Note:**


        If you do not include the `workspace` query parameter, the system creates the collection in your "My Workspace" workspace.

        '
      operationId: createEnvironment
      tags:
      - Environments
      requestBody:
        $ref: '#/components/requestBodies/createEnvironment'
      responses:
        '200':
          $ref: '#/components/responses/createEnvironment'
        '400':
          $ref: '#/components/responses/environments400ErrorMalformedRequest'
        '401':
          $ref: '#/components/responses/common401Error'
        '403':
          $ref: '#/components/responses/common403Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
      parameters:
      - $ref: '#/components/parameters/workspaceQuery'
  /environments/{environmentId}:
    parameters:
    - $ref: '#/components/parameters/environmentId'
    get:
      summary: APIs.io Engineering Platform Get an environment
      description: Gets information about an environment.
      operationId: getEnvironment
      tags:
      - Environments
      responses:
        '200':
          $ref: '#/components/responses/getEnvironment'
        '400':
          $ref: '#/components/responses/instanceNotFoundEnvironment'
        '401':
          $ref: '#/components/responses/common401Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
    put:
      summary: APIs.io Engineering Platform Update an environment
      description: Updates an environment.
      operationId: updateEnvironment
      tags:
      - Environments
      requestBody:
        $ref: '#/components/requestBodies/updateEnvironment'
      responses:
        '200':
          $ref: '#/components/responses/updateEnvironment'
        '400':
          $ref: '#/components/responses/environments400ErrorMalformedRequest'
        '401':
          $ref: '#/components/responses/common401Error'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
    delete:
      summary: APIs.io Engineering Platform Delete an environment
      description: Deletes an environment.
      operationId: deleteEnvironment
      tags:
      - Environments
      responses:
        '200':
          $ref: '#/components/responses/deleteEnvironment'
        '401':
          $ref: '#/components/responses/common401Error'
        '404':
          $ref: '#/components/responses/instanceNotFoundEnvironment'
        '500':
          $ref: '#/components/responses/common500ErrorServerError'
  /environments/{environmentId}/forks:
    parameters:
    - $ref: '#/components/parameters/environmentUid'
    post:
      summary: APIs.io Engineering Platform Create a fork
      description: Creates a [fork](https://learning.postman.com/docs/collaborating-in-postman/using-version-control/forking-elements/) of an existing environment.
      operationId: forkEnvironment
      tags:
      - Environments
      requestBody:
        $ref: '#/components/requestBodies/forkEnvironment'
      responses:
        '200':
          $ref: '#/components/responses/forkEnvironment'
        '401':
          $ref: '#/components/responses/common401Error'
        '404':
          $ref: '#/components/responses/environmentForks404Error'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/workspaceIdQueryTrue'
    get:
      summary: APIs.io Engineering Platform Get an environment's forks
      description: Gets all of an environment's forked environments.
      operationId: getEnvironmentForks
      tags:
      - Environments
      responses:
        '200':
          $ref: '#/components/responses/getEnvironmentForks'
        '400':
          $ref: '#/components/responses/environmentForks400Error'
        '401':
          $ref: '#/components/responses/common401Error'
        '404':
          $ref: '#/components/responses/environmentForks404Error'
        '500':
          $ref: '#/components/responses/common500Error'
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/directionQuery'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/sortByCreatedAt'
  /environments/{environmentId}/merges:
    parameters:
    - $ref: '#/components/parameters/environmentUid'
    post:
      summary: APIs.io Engineering Platform Merge a fork
      description: '[Merges](https://learning.postman.com/docs/collaborating-in-postman/using-version-control/forking-elements/#merge-changes-from-a-fork) a forked environment back into its parent environment.

        '
      operationId: mergeEnvironmentFork
      tags:
      - Environments
      requestBody:
        $ref: '#/components/requestBodies/mergeEnvironmentFork'
      responses:
        '200':
          $ref: '#/components/responses/mergeEnvironmentFork'
        '400':
          $ref: '#/components/responses/environmentForks400Error'
        '401':
          $ref: '#/components/responses/common401Error'
        '404':
          $ref: '#/components/responses/environmentForks404Error'
        '500':
          $ref: '#/components/responses/common500Error'
  /environments/{environmentId}/pulls:
    parameters:
    - $ref: '#/components/parameters/environmentUid'
    post:
      summary: APIs.io Engineering Platform Pull source changes
      description: '[Pulls](https://learning.postman.com/docs/collaborating-in-postman/using-version-control/forking-elements/#pull-updates-from-a-parent-element) the changes from a parent (source) environment into the forked environment.

        '
      operationId: pullEnvironment
      tags:
      - Environments
      requestBody:
        $ref: '#/components/requestBodies/pullEnvironment'
      responses:
        '200':
          $ref: '#/components/responses/pullEnvironment'
        '400':
          $ref: '#/components/responses/environmentForks400Error'
        '401':
          $ref: '#/components/responses/common401Error'
        '404':
          $ref: '#/components/responses/environmentForks404Error'
        '500':
          $ref: '#/components/responses/common500Error'
components:
  responses:
    forkEnvironment:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                description: Information about the forked environment.
                properties:
                  uid:
                    type: string
                    format: uid
                    description: The forked environment's ID.
                    example: 12345678-0fcea3ba-abcf-49c3-9f48-669c208fef25
                  name:
                    type: string
                    description: The name of the forked environment.
                    example: Testing Environment
                  forkName:
                    type: string
                    description: The forked environment's label.
                    example: Test Fork
          example:
            environment:
              uid: 12345678-0fcea3ba-abcf-49c3-9f48-669c208fef25
              name: Testing Environment
              forkName: Test Fork
    deleteEnvironment:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                properties:
                  id:
                    type: string
                    description: The deleted environment's ID.
                    example: 4dfb28a4-9a6c-4ce4-b31a-17c26a8b2cce
                  uid:
                    type: string
                    format: uid
                    description: The deleted environment's unique ID.
                    example: 12345678-4dfb28a4-9a6c-4ce4-b31a-17c26a8b2cce
          example:
            environment:
              id: 5daabc50-8451-43f6-922d-96b403b4f28e
              uid: 1234567-5daabc50-8451-43f6-922d-96b403b4f28e
    common401Error:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri-reference
                description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
                example: https://api.postman.com/problems/unauthorized
              title:
                type: string
                description: A short summary of the problem.
                example: Unauthorized
              detail:
                type: string
                description: Information about the error.
                example: Unauthorized
              status:
                type: integer
                format: http-status-code
                description: The error's HTTP status code.
                example: 401
          example:
            type: https://api.postman.com/problems/unauthorized
            title: Unauthorized
            detail: Unauthorized
            status: 401
    instanceNotFoundEnvironment:
      description: Instance Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                    description: The error name.
                    example: instanceNotFoundError
                  message:
                    type: string
                    description: The error message.
                    example: We could not find the environment you are looking for
          example:
            error:
              name: instanceNotFoundError
              message: We could not find the environment you are looking for
    createEnvironment:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                properties:
                  id:
                    type: string
                    description: The environment's ID.
                    example: 5daabc50-8451-43f6-922d-96b403b4f28e
                  name:
                    type: string
                    description: The environment's name.
                    example: Test Environment
                  uid:
                    type: string
                    format: uid
                    description: The environment's unique ID.
                    example: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          example:
            environment:
              id: 5daabc50-8451-43f6-922d-96b403b4f28e
              name: Test Environment
              uid: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
    common500Error:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri-reference
                description: The [URI reference](https://www.rfc-editor.org/rfc/rfc3986) that identifies the type of problem.
                example: https://api.postman.com/problems/internal-server-error
              title:
                type: string
                description: A short summary of the problem.
                example: Internal Server Error
              detail:
                type: string
                description: Information about the error.
                example: Internal Server Error
          example:
            type: https://api.postman.com/problems/internal-server-error
            title: Internal Server Error
            detail: Internal Server Error
    common500ErrorServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                    description: The error name.
                    example: serverError
                  message:
                    type: string
                    description: The error message.
                    example: An error has occurred on the server.
          example:
            error:
              name: serverError
              message: An error has occurred on the server.
    updateEnvironment:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                properties:
                  id:
                    type: string
                    description: The environment's ID.
                    example: 5daabc50-8451-43f6-922d-96b403b4f28e
                  name:
                    type: string
                    description: The environment's name.
                    example: Test A Environment
                  uid:
                    type: string
                    format: uid
                    description: The environment's unique ID.
                    example: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          example:
            environment:
              id: 5daabc50-8451-43f6-922d-96b403b4f28e
              name: Test A Environment
              uid: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
    environmentForks400Error:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The type of error.
                example: https://api.postman.com/problems/bad-request
              title:
                type: string
                description: The title of the error message.
                example: The environment Id is not a forked environment.
              detail:
                type: object
                description: Details about the error message.
                example: {}
          examples:
            environmentNotForked:
              value:
                type: https://api.postman.com/problems/bad-request
                title: The environment Id is not a forked environment.
                detail: {}
    environments400ErrorMalformedRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                    example: malformedRequestError
                  message:
                    type: string
                    example: Found 1 errors with the supplied environment.
                  details:
                    type: array
                    items:
                      type: string
                      example: ': must have required property ''environment'''
          example:
            error:
              name: malformedRequestError
              message: Found 1 errors with the supplied environment.
              details:
              - ': must have required property ''environment'''
    getEnvironments:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environments:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The environment's ID.
                      example: 5daabc50-8451-43f6-922d-96b403b4f28e
                    name:
                      type: string
                      description: The environment's name.
                      example: Test Environment
                    createdAt:
                      type: string
                      format: date-time
                      description: The date and time at which the environment was created.
                      example: '2020-09-23T14:31:18.000Z'
                    updatedAt:
                      type: string
                      format: date-time
                      description: The date and time at which the environment was last updated.
                      example: '2020-12-04T14:13:40.000Z'
                    owner:
                      type: string
                      description: The environment owner's ID.
                      example: '12345678'
                    uid:
                      type: string
                      format: uid
                      description: The environment's unique ID.
                      example: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
                    isPublic:
                      type: boolean
                      description: If true, the environment is public and visible to all users.
                      example: false
          example:
            environments:
            - id: 5daabc50-8451-43f6-922d-96b403b4f28e
              name: Test Environment
              createdAt: '2020-09-23T14:31:18.000Z'
              updatedAt: '2020-12-04T14:13:40.000Z'
              owner: '12345678'
              uid: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
              isPublic: false
            - id: 7d786cc8-142b-4d62-b5a5-872afc37ad16
              name: Environment Scanner
              createdAt: '2020-02-04T19:34:23.000Z'
              updatedAt: '2020-08-12T13:34:06.000Z'
              owner: '12345678'
              uid: 12345678-7d786cc8-142b-4d62-b5a5-872afc37ad16
              isPublic: false
    pullEnvironment:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                description: Information about the merged environment.
                properties:
                  uid:
                    type: string
                    format: uid
                    description: The merged environment's unique ID.
                    example: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
          example:
            environment:
              uid: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
    common403Error:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/common403Error'
          example:
            value:
              type: https://api.postman.com/problems/forbidden
              title: Forbidden
              detail: Forbidden
              status: 403
    mergeEnvironmentFork:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                description: Information about the merged environment.
                properties:
                  uid:
                    type: string
                    format: uid
                    description: The merged environment's ID.
                    example: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
          example:
            environment:
              uid: 12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957
    getEnvironment:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                type: object
                properties:
                  id:
                    type: string
                    description: The environment's ID.
                    example: 5daabc50-8451-43f6-922d-96b403b4f28e
                  name:
                    type: string
                    description: The environment's name.
                    example: Test Environment
                  owner:
                    type: string
                    description: The ID of environment's owner.
                    example: '12345678'
                  createdAt:
                    type: string
                    format: date-time
                    description: The date and time at which the environment was created.
                    example: '2020-11-05T13:59:22.000Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: The date and time at which the environment was last updated.
                    example: '2020-11-05T13:59:23.000Z'
                  values:
                    type: array
                    description: Information about the environment's variables.
                    items:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: If true, the variable is enabled.
                          example: true
                        key:
                          type: string
                          description: The variable's name.
                          example: collectionId
                        value:
                          type: string
                          description: The variable's value.
                          example: 12ece9e1-2abf-4edc-8e34-de66e74114d2
                        type:
                          type: string
                          description: The variable type.
                          enum:
                          - secret
                          - default
                          - any
                          example: default
                  isPublic:
                    type: boolean
                    description: If true, the environment is public and visible to all users.
                    example: false
          example:
            environment:
              id: 5daabc50-8451-43f6-922d-96b403b4f28e
              name: Test Environment
              owner: '12345678'
              createdAt: '2020-11-05T13:59:22.000Z'
              updatedAt: '2020-11-05T13:59:23.000Z'
              values:
              - key: collectionId
                value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
                enabled: true
                type: default
              isPublic: false
    getEnvironmentForks:
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                description: A list of the environment's forks.
                items:
                  type: object
                  description: Information about the forked environment.
                  properties:
                    forkId:
                      type: string
                      format: uid
                      description: The forked environment's unique ID.
                      example: 12345678-2fgh78uj-2ee3-8ugc-b678-7742d82e2e1f
                    forkName:
                      type: string
                      description: The forked environment's label.
                      example: my fork
                    createdAt:
                      type: string
                      format: date-time
                      description: The date and time at which the fork was created.
                      example: '2023-11-16T09:18:17.000Z'
                    createdBy:
                      type: string
                      description: The user who created the environment fork.
                      example: Taylor Lee
                    updatedAt:
                      type: string
                      format: date-time
                      description: The date and time at which the fork was last updated.
                      example: '2023-11-16T09:18:17.000Z'
              meta:
                type: object
