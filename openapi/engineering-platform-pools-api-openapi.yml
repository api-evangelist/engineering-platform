openapi: 3.2.0
info:
  title: VSOnline Pools API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: Pools
paths:
  /api/v1/pools/default:
    get:
      tags:
      - Pools
      parameters:
      - name: skuName
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolStatusResponseBody'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolStatusResponseBody'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolStatusResponseBody'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get api pools default
      x-summary-source: derived
      operationId: getApiV1PoolsDefault
      x-operation-id-source: derived
  /api/v1/GenevaActions/Pools/rotate-pools:
    post:
      tags:
      - Pools
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/RotatePoolsRequestBody'
          application/json:
            schema:
              $ref: '#/components/schemas/RotatePoolsRequestBody'
          text/json:
            schema:
              $ref: '#/components/schemas/RotatePoolsRequestBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RotatePoolsRequestBody'
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Create api geneva actions pools rotate pools
      x-summary-source: derived
      operationId: postApiV1GenevaActionsPoolsRotatePools
      x-operation-id-source: derived
  /api/v1/GenevaActions/Pools:
    post:
      tags:
      - Pools
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PoolConfigRequestBody'
          application/json:
            schema:
              $ref: '#/components/schemas/PoolConfigRequestBody'
          text/json:
            schema:
              $ref: '#/components/schemas/PoolConfigRequestBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PoolConfigRequestBody'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Create api geneva actions pools
      x-summary-source: derived
      operationId: postApiV1GenevaActionsPools
      x-operation-id-source: derived
  /api/v1/GenevaActions/Pools/change-resource-deletion-setting:
    post:
      tags:
      - Pools
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ChangeResourceDeletionRequestBody'
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeResourceDeletionRequestBody'
          text/json:
            schema:
              $ref: '#/components/schemas/ChangeResourceDeletionRequestBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ChangeResourceDeletionRequestBody'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SystemConfigurationResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Create api geneva actions pools change resource deletion setting
      x-summary-source: derived
      operationId: postApiV1GenevaActionsPoolsChangeResourceDeletionSetting
      x-operation-id-source: derived
components:
  schemas:
    PoolStatusResponseBody:
      type: object
      properties:
        poolCode:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        sku:
          type:
          - string
          - 'null'
        resourceType:
          type:
          - string
          - 'null'
        isEnvironmentPool:
          type: boolean
        allWithLatestVersion:
          type: boolean
        readyUnassignedCount:
          type: integer
          format: int32
        readyUnassignedLatestVersionCount:
          type: integer
          format: int32
        readyUnassignedNotLatestVersionCount:
          type: integer
          format: int32
        readyUnassignedNotLatestVersionAndIdleCount:
          type: integer
          format: int32
      additionalProperties: false
    SystemConfigurationResponse:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ChangeResourceDeletionRequestBody:
      type: object
      properties:
        poolCode:
          type:
          - string
          - 'null'
        poolType:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        comment:
          type:
          - string
          - 'null'
      additionalProperties: false
    RotatePoolsRequestBody:
      type: object
      properties:
        poolType:
          type:
          - string
          - 'null'
        poolSubtype:
          type:
          - string
          - 'null'
        poolCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    PoolConfigRequestBody:
      type: object
      properties:
        poolCode:
          type:
          - string
          - 'null'
        poolType:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        maxTargetCount:
          type:
          - string
          - 'null'
        minTargetCount:
          type:
          - string
          - 'null'
        targetCount:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
