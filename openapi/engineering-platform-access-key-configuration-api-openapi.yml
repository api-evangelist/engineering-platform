tags:
- name: Access Key Configuration
paths:
  /accounts/{account_id}/access/keys:
    get:
      description: Gets the Access key rotation settings for an account.
      operationId: access-key-configuration-get-the-access-key-configuration
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Get the Access key configuration response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_keys_components-schemas-single_response'
          description: Get the Access key configuration response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Get the Access key configuration
      tags:
      - Access Key Configuration
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
    put:
      description: Updates the Access key rotation settings for an account.
      operationId: access-key-configuration-update-the-access-key-configuration
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                key_rotation_interval_days:
                  $ref: '#/components/schemas/access_key_rotation_interval_days'
              required:
              - key_rotation_interval_days
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Update the Access key configuration response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_keys_components-schemas-single_response'
          description: Update the Access key configuration response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Update the Access key configuration
      tags:
      - Access Key Configuration
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
  /accounts/{account_id}/access/keys/rotate:
    post:
      description: Perfoms a key rotation for an account.
      operationId: access-key-configuration-rotate-access-keys
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
          description: Rotate Access keys response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_keys_components-schemas-single_response'
          description: Rotate Access keys response
      security:
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Rotate Access keys
      tags:
      - Access Key Configuration
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
components:
  schemas:
    access_last_key_rotation_at:
      description: The timestamp of the previous key rotation.
      example: '2014-01-01T05:20:00.12345Z'
      format: date-time
      type: string
    access_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/access_messages'
        messages:
          $ref: '#/components/schemas/access_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    access_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/access_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/access_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    access_keys_components-schemas-single_response:
      allOf:
      - $ref: '#/components/schemas/access_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/access_key_config'
    access_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    access_days_until_next_rotation:
      description: The number of days until the next key rotation.
      example: 1
      readOnly: true
      type: number
    access_key_rotation_interval_days:
      description: The number of days between key rotations.
      example: 30
      maximum: 365
      minimum: 21
      type: number
    access_key_config:
      properties:
        days_until_next_rotation:
          $ref: '#/components/schemas/access_days_until_next_rotation'
        key_rotation_interval_days:
          $ref: '#/components/schemas/access_key_rotation_interval_days'
        last_key_rotation_at:
          $ref: '#/components/schemas/access_last_key_rotation_at'
      type: object
    access_api-response-single:
      allOf:
      - $ref: '#/components/schemas/access_api-response-common'
      type: object
    access_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/apigateway/
