components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    TooManyRequestsException: {}
    HeadersList:
      type: array
      items:
        $ref: '#/components/schemas/Header'
      maxItems: 100
    FunctionArn:
      type: string
      pattern: arn:(aws[a-zA-Z-]*)?:lambda:[a-z]{2}(-gov)?-[a-z]+-\d{1}:\d{12}:function:[a-zA-Z0-9-_]+(:(\$LATEST|[a-zA-Z0-9-_]+))?
    AllowCredentials:
      type: boolean
    Timestamp:
      type: string
    FunctionUrlConfig:
      type: object
      required:
      - FunctionUrl
      - FunctionArn
      - CreationTime
      - LastModifiedTime
      - AuthType
      properties:
        FunctionUrl:
          allOf:
          - $ref: '#/components/schemas/FunctionUrl'
          - description: The HTTP URL endpoint for your function.
        FunctionArn:
          allOf:
          - $ref: '#/components/schemas/FunctionArn'
          - description: The Amazon Resource Name (ARN) of your function.
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: When the function URL was created, in <a href="https://www.w3.org/TR/NOTE-datetime">ISO-8601 format</a> (YYYY-MM-DDThh:mm:ss.sTZD).
        LastModifiedTime:
