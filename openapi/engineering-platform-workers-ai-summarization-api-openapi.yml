openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Workers AI Summarization API
  version: 4.0.0
tags:
- name: Workers AI Summarization
paths:
  /accounts/{account_id}/ai/run/@cf/facebook/bart-large-cnn:
    post:
      operationId: workers-ai-post-run-cf-facebook-bart-large-cnn
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          example: 023e105f4ecef8ad9ca31a8372d0c353
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                input_text:
                  minLength: 1
                  type: string
                max_length:
                  default: 1024
                  type: integer
              required:
              - input_text
              type: object
      responses:
        '200':
          content:
            image/png:
              schema:
                properties:
                  result:
                    format: binary
                    type: string
                  success:
                    default: 'true'
                    type: boolean
                type: object
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                    type: array
                  result:
                    type: object
                  success:
                    type: boolean
                required:
                - errors
                - success
                - result
                type: object
          description: Bad request
      security:
      - api_token: []
      - api_email: []
        api_key: []
      summary: APIs.io Engineering Platform Execute @cf/facebook/bart-large-cnn model.
      tags:
      - Workers AI Summarization
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
components:
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
