openapi: 3.2.0
info:
  title: VSOnline Open ID Discovery API
  description: Public APIs for managing VS Codespaces
  version: v1
servers:
- url: https://online.visualstudio.com
security:
- Bearer: []
tags:
- name: OpenIdDiscovery
paths:
  /.well-known/jwks:
    get:
      tags:
      - OpenIdDiscovery
      responses:
        '200':
          description: Success
      summary: Get well known jwks
      x-summary-source: derived
      operationId: getWellKnownJwks
      x-operation-id-source: derived
  /.well-known/openid-configuration:
    get:
      tags:
      - OpenIdDiscovery
      responses:
        '200':
          description: Success
      summary: Get well known openid configuration
      x-summary-source: derived
      operationId: getWellKnownOpenidConfiguration
      x-operation-id-source: derived
components:
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT auth token for the user. Example: eyJ2...'
      scheme: bearer
      bearerFormat: JWT
