openapi: 3.2.0
info:
  description: 'To get started using Cloudflare''s products and services via the API, refer to [how to interact with Cloudflare](https://developers.cloudflare.com/fundamentals/basic-tasks/interact-with-cloudflare/), which covers using tools like [Terraform](https://developers.cloudflare.com/terraform/#cloudflare-terraform) and the [official SDKs](https://developers.cloudflare.com/fundamentals/api/reference/sdks/) to maintain your Cloudflare resources.


    Using the Cloudflare API requires authentication so that Cloudflare knows who is making requests and what permissions you have. Create an API token to grant access to the API to perform actions.


    To create an API token, from the Cloudflare dashboard, go to My Profile > API Tokens and select Create Token. For more information on how to create and troubleshoot API tokens, refer to

    our [API fundamentals](https://developers.cloudflare.com/fundamentals/api/).


    Totally new to Cloudflare? [Start here](https://developers.cloudflare.com/fundamentals/get-started/).'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: APIs.io Engineering Platform Cloudflare Logcontrol CMB Config for an Account API
  version: 4.0.0
tags:
- name: Logcontrol CMB Config for an Account
paths:
  /accounts/{account_id}/logs/control/cmb/config:
    delete:
      description: Deletes CMB config.
      operationId: delete-accounts-account_id-logs-control-cmb-config
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/logcontrol_identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/logcontrol_api-response-common-failure'
          description: Delete CMB config response failure
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/logcontrol_api-response-common'
                - properties:
                    result:
                      enum:
                      - null
                      type:
                      - object
                      - 'null'
          description: Delete CMB config response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Delete CMB config
      tags:
      - Logcontrol CMB Config for an Account
      x-api-token-group:
      - Logs Write
      x-cfPermissionsRequired:
        enum:
        - '#logs:edit'
    get:
      description: Gets CMB config.
      operationId: get-accounts-account_id-logs-control-cmb-config
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/logcontrol_identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/logcontrol_api-response-common-failure'
          description: Get CMB config response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logcontrol_cmb_config_response_single'
          description: Get CMB config response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Get CMB config
      tags:
      - Logcontrol CMB Config for an Account
      x-api-token-group:
      - Logs Write
      - Logs Read
      x-cfPermissionsRequired:
        enum:
        - '#logs:read'
        - '#analytics:read'
    post:
      description: Updates CMB config.
      operationId: post-accounts-account_id-logs-control-cmb-config
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/logcontrol_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/logcontrol_cmb_config'
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/logcontrol_api-response-common-failure'
          description: Update CMB config response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logcontrol_cmb_config_response_single'
          description: Update CMB config response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Update CMB config
      tags:
      - Logcontrol CMB Config for an Account
      x-api-token-group:
      - Logs Write
      x-cfPermissionsRequired:
        enum:
        - '#logs:edit'
components:
  schemas:
    logcontrol_cmb_config:
      properties:
        regions:
          $ref: '#/components/schemas/logcontrol_regions'
      type:
      - object
      - 'null'
    logcontrol_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/logcontrol_messages'
        messages:
          $ref: '#/components/schemas/logcontrol_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    logcontrol_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/logcontrol_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/logcontrol_messages'
          example: []
        result:
          enum:
          - null
          type:
          - object
          - 'null'
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    logcontrol_api-response-single:
      allOf:
      - $ref: '#/components/schemas/logcontrol_api-response-common'
      type: object
    logcontrol_identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    logcontrol_cmb_config_response_single:
      allOf:
      - $ref: '#/components/schemas/logcontrol_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/logcontrol_cmb_config'
    logcontrol_regions:
      description: Comma-separated list of regions.
      example: eu
      maxLength: 256
      pattern: ^[a-z,]*$
      type: string
    logcontrol_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
