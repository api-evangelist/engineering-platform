                type: number
              values:
                items:
                  type: number
                nullable: true
                type: array
            type: object
          type: array
      type: object
    vectorize_index-insert-response:
      properties:
        count:
          description: Specifies the count of the vectors successfully inserted.
          example: 768
          type: integer
        ids:
          description: Array of vector identifiers of the vectors successfully inserted.
          items:
            $ref: '#/components/schemas/vectorize_vector-identifier'
          type: array
      type: object
    vectorize_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/vectorize_messages'
        messages:
          $ref: '#/components/schemas/vectorize_messages'
        result:
          anyOf:
          - type: object
          - items: {}
            type: array
          - type: string
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    vectorize_index-delete-vectors-by-id-request:
      properties:
        ids:
          description: A list of vector identifiers to delete from the index indicated by the path.
          example:
          - 5121db81354a40c6aedc3fe1ace51c59
          - f90eb49c2107486abdfd78c67e853430
          items:
            $ref: '#/components/schemas/vectorize_vector-identifier'
          type: array
      type: object
    vectorize_index-get-vectors-by-id-response:
      description: Array of vectors with matching ids.
      example:
      - id: some-vector-id
        metadata:
          another-key: another-value
          customer-id: 442
        values:
        - 0.812
        - 0.621
        - 0.261
      - id: other-vector-id
        metadata:
          another-key: with-a-value
          customer-id: 2151
        namespace: namespaced
        values:
        - 0.961
        - 0.751
        - 0.661
      items:
        properties:
          id:
            $ref: '#/components/schemas/vectorize_vector-identifier'
          metadata:
            type: object
          namespace:
            nullable: true
            type: string
          values:
            items:
              type: number
            type: array
        type: object
      type: array
    vectorize_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/vectorize_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/vectorize_messages'
          example: []
        result:
