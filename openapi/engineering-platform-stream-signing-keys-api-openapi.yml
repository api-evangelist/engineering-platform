tags:
- name: Stream Signing Keys
paths:
  /accounts/{account_id}/stream/keys:
    get:
      description: Lists the video ID and creation date and time when a signing key was created.
      operationId: stream-signing-keys-list-signing-keys
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_schemas-identifier'
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: List signing keys response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_key_response_collection'
          description: List signing keys response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform List signing keys
      tags:
      - Stream Signing Keys
      x-api-token-group:
      - Stream Write
      - Stream Read
    post:
      description: Creates an RSA private key in PEM and JWK formats. Key files are only displayed once after creation. Keys are created, used, and deleted independently of videos, and every key can sign any video.
      operationId: stream-signing-keys-create-signing-keys
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_schemas-identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Create signing keys response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_key_generation_response'
          description: Create signing keys response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Create signing keys
      tags:
      - Stream Signing Keys
      x-api-token-group:
      - Stream Write
  /accounts/{account_id}/stream/keys/{identifier}:
    delete:
      description: Deletes signing keys and revokes all signed URLs generated with the key.
      operationId: stream-signing-keys-delete-signing-keys
      parameters:
      - in: path
        name: identifier
        required: true
        schema:
          $ref: '#/components/schemas/stream_schemas-identifier'
      - in: path
        name: account_id
        required: true
        schema:
          $ref: '#/components/schemas/stream_schemas-identifier'
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_api-response-common-failure'
          description: Delete signing keys response failure
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stream_deleted_response'
          description: Delete signing keys response
      security:
      - api_email: []
        api_key: []
        api_token: []
      summary: APIs.io Engineering Platform Delete signing keys
      tags:
      - Stream Signing Keys
      x-api-token-group:
      - Stream Write
components:
  schemas:
    stream_keys:
      properties:
        created:
          $ref: '#/components/schemas/stream_signing_key_created'
        id:
          $ref: '#/components/schemas/stream_schemas-identifier'
        jwk:
          $ref: '#/components/schemas/stream_jwk'
        pem:
          $ref: '#/components/schemas/stream_pem'
      type: object
    stream_schemas-identifier:
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      type: string
    stream_signing_key_created:
      description: The date and time a signing key was created.
      example: '2014-01-02T02:20:00Z'
      format: date-time
      type: string
    stream_key_generation_response:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/stream_keys'
    stream_key_response_collection:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      - properties:
          result:
            items:
              properties:
                created:
                  $ref: '#/components/schemas/stream_signing_key_created'
                id:
                  $ref: '#/components/schemas/stream_schemas-identifier'
              type: object
            type: array
    stream_deleted_response:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-single'
      - properties:
          result:
            example: ok
            type: string
    stream_api-response-common-failure:
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/stream_messages'
          example:
          - code: 7003
            message: No route for the URI
          minLength: 1
        messages:
          allOf:
          - $ref: '#/components/schemas/stream_messages'
          example: []
        result:
          enum:
          - null
          nullable: true
          type: object
        success:
          description: Whether the API call was successful
          enum:
          - false
          example: false
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
      type: object
    stream_api-response-common:
      properties:
        errors:
          $ref: '#/components/schemas/stream_messages'
        messages:
          $ref: '#/components/schemas/stream_messages'
        success:
          description: Whether the API call was successful
          enum:
          - true
          example: true
          type: boolean
      required:
      - success
      - errors
      - messages
      type: object
    stream_pem:
      description: The signing key in PEM format.
      example: 
      type: string
    stream_messages:
      example: []
      items:
        properties:
          code:
            minimum: 1000
            type: integer
          message:
            type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      type: array
    stream_jwk:
      description: The signing key in JWK format.
      example: 
      type: string
    stream_api-response-single:
      allOf:
      - $ref: '#/components/schemas/stream_api-response-common'
      type: object
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/apigateway/
